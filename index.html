<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANDYCAM DV-2000</title>
<style>
:root{color-scheme:dark;--ink:#d8d8d0;--red:#d8322b;--plate:#2a2c31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#0d0d0f;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.cam{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px;box-sizing:border-box;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.15em;color:#8b8d92}
.top b{color:#c9c9c0;font-size:13px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:14px;border:7px solid #34363c;box-shadow:inset 0 0 24px #000,0 0 0 2px #0a0a0a,0 6px 20px #0008;overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;text-align:center;padding:20px;font-size:13px;line-height:1.6;color:#9a9a92}
.deck{background:linear-gradient(#2d2f35,#1f2024);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;border:1px solid #3b3d44}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:#3a3c43;color:var(--ink);border:1px solid #55575f;border-bottom-width:3px;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer}
.btn.act{background:#c9c9c0;color:#111;border-color:#e8e8e0}
.btn:active{transform:translateY(1px)}
.shut{width:76px;height:76px;border-radius:50%;border:5px solid #9a9a96;background:#18181b;position:relative;cursor:pointer;padding:0;flex:none}
.shut::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--red);transition:.15s}
.shut.photo::after{background:#e4e4dc}
.shut.rec::after{inset:21px;border-radius:6px;background:var(--red)}
.fx{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;color:#8b8d92;flex:1}
.fx input{flex:1;accent-color:#c9c9c0}
#gal{position:fixed;inset:0;background:#111;z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#gal.on{display:flex}
#gal header{display:flex;justify-content:space-between;align-items:center;padding:12px;font-size:13px;letter-spacing:.1em}
#gl{flex:1;overflow:auto;padding:0 12px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
#gl .it{background:#1d1e22;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
#gl img,#gl video{width:100%;display:block;background:#000}
#gl .btn{border-radius:0;border-width:1px 0 0;text-align:center}
</style></head>
<body>
<div class="cam">
  <div class="top"><b>HANDYCAM DV-2000</b><span>NTSC · DIGITAL VIDEO</span></div>
  <div class="lcd">
    <canvas id="out" width="640" height="480"></canvas>
    <div id="flash"></div>
    <div id="pw"><div>点 POWER 开机并允许使用摄像头 / 麦克风<br>（需要 HTTPS，在 iPhone Safari 中打开）</div><button class="btn act" id="pwb">⏻ POWER</button></div>
  </div>
  <div class="deck">
    <div class="row">
      <div style="display:flex;gap:6px"><button class="btn act" id="mV">VIDEO</button><button class="btn" id="mP">PHOTO</button></div>
      <label class="fx">FX<input type="range" id="fx" min="0" max="1.5" step=".05" value="1"></label>
    </div>
    <div class="row">
      <button class="btn" id="gb">GALLERY 0</button>
      <button class="shut" id="sh" aria-label="shutter"></button>
      <button class="btn" id="fl">FLIP</button>
    </div>
  </div>
</div>
<div id="gal"><header><span>TAPE LIBRARY</span><button class="btn" id="gc">CLOSE</button></header><div id="gl"></div></div>

<script>
const $=s=>document.querySelector(s);
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t;uniform vec2 r;uniform float T,k,m;varying vec2 u;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p.x=mix(p.x,1.-p.x,m);return texture2D(t,clamp(p,0.,1.)).rgb;}
void main(){
 vec3 w=vec3(.299,.587,.114);
 vec2 uv=u;float L=floor(uv.y*240.);float f=floor(T*30.);
 float jit=h(vec2(L,f))-.5;
 uv.x+=jit*.0025*k+sin(uv.y*8.+T*1.5)*.0006*k;
 float inb=smoothstep(.03,0.,abs(uv.y-fract(T*.05)));
 uv.x+=inb*jit*.03*k;
 vec2 c=uv-.5;vec2 ca=c*(.004+dot(c,c)*.03)*k;
 vec3 col=vec3(S(uv+ca).r,S(uv).g,S(uv-ca).b);
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,min(.8*k,1.));
 col=dot(col,w)+(cm-dot(cm,w))*1.15;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*r.x/r.y);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*k*vec3(1.,.92,.8);
 col=(col-.5)*1.1+.5;col=mix(vec3(dot(col,w)),col,1.1);
 col+=vec3(.02,.01,-.01)*k;col=max(col,vec3(.04*k));
 col*=1.-.12*k*(.5+.5*sin(uv.y*240.*6.2832));
 col*=1.-.03*k*mod(f,2.);
 float n=h(uv*r+T)-.5;col+=n*.22*k*(1.-dot(col,w)*.5);
 col+=(vec3(h(uv*r*.5+T+1.),h(uv*r*.5+T+2.),h(uv*r*.5+T+3.))-.5)*.08*k;
 col*=1.-dot(c,c)*1.1*k;
 gl_FragColor=vec4(col,1.);}`;
function sh(ty,s){const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
const U=n=>gl.getUniformLocation(pg,n);

const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;
let stream,facing='environment',on=false,mode='video',rec,chunks=[],t0=0,items=[],last=0,W=0,H=0;

async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pwMsg('此环境不支持摄像头，请在 Safari 中直接打开链接。');return}
  const c={video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true};
  try{stream=await navigator.mediaDevices.getUserMedia(c)}
  catch(e){try{c.audio=false;stream=await navigator.mediaDevices.getUserMedia(c)}
  catch(e2){pwMsg('无法使用摄像头：'+e2.name+'。请检查权限，或在 Safari 中直接打开链接。');return}}
  vid.srcObject=stream;await vid.play();on=true;$('#pw').style.display='none';
}
function pwMsg(s){$('#pw').firstElementChild.textContent=s}
$('#pwb').onclick=start;
$('#fl').onclick=()=>{if(rec&&rec.state==='recording')return;facing=facing==='user'?'environment':'user';if(on)start()};

function size(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
  const s=Math.min(1,960/Math.max(vw,vh)),w=Math.round(vw*s),h=Math.round(vh*s);
  if(w!==W||h!==H){W=w;H=h;gc.width=out.width=w;gc.height=out.height=h;gl.viewport(0,0,w,h)}
  return true;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ov(T){
  const f=Math.max(14,H*.04),m=f*.9,isRec=rec&&rec.state==='recording';
  oc.font=`bold ${f}px ui-monospace,Menlo,monospace`;oc.textBaseline='top';
  const tx=(s,x,y,al)=>{oc.textAlign=al||'left';
    oc.fillStyle='rgba(255,40,60,.75)';oc.fillText(s,x-1.6,y);
    oc.fillStyle='rgba(40,200,255,.75)';oc.fillText(s,x+1.6,y);
    oc.shadowColor='#fff';oc.shadowBlur=f*.35;oc.fillStyle='#f4f4ee';oc.fillText(s,x,y);oc.shadowBlur=0};
  const blink=Math.floor(T*1.5)%2===0;
  if(mode==='photo')tx('PHOTO',m,m);
  else tx(isRec?(blink?'● REC':'  REC'):'STBY',m,m);
  tx('SP ▮▮▮▯',W-m,m,'right');
  const d=new Date();
  tx(d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase(),m,H-m-f*2.2);
  tx(d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),m,H-m-f);
  tx(isRec?fmt((performance.now()-t0)/1000):'0:00:00',W-m,H-m-f,'right');
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!on||vid.readyState<2||ts-last<33||!size())return;
  last=ts;const T=ts/1000;
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  gl.uniform2f(U('r'),W,H);gl.uniform1f(U('T'),T%1000);gl.uniform1f(U('k'),+$('#fx').value);gl.uniform1f(U('m'),facing==='user'?1:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  oc.drawImage(gc,0,0);ov(T);
}
oc.fillStyle='#000';oc.fillRect(0,0,640,480);requestAnimationFrame(loop);

function setMode(m){
  if(rec&&rec.state==='recording')return;
  mode=m;$('#mV').classList.toggle('act',m==='video');$('#mP').classList.toggle('act',m==='photo');
  $('#sh').className='shut'+(m==='photo'?' photo':'');
}
$('#mV').onclick=()=>setMode('video');$('#mP').onclick=()=>setMode('photo');
function add(it){items.unshift(it);$('#gb').textContent='GALLERY '+items.length}
$('#sh').onclick=()=>{
  if(!on)return;
  if(mode==='photo'){
    const fl=$('#flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),60);
    out.toBlob(b=>add({k:'img',blob:b,url:URL.createObjectURL(b)}),'image/jpeg',.92);
    return;
  }
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(typeof MediaRecorder==='undefined'){alert('此浏览器不支持录像');return}
  const cs=out.captureStream(30);
  stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  chunks=[];rec=new MediaRecorder(cs,mt?{mimeType:mt,videoBitsPerSecond:3e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/mp4'});add({k:'vid',blob:b,url:URL.createObjectURL(b)});$('#sh').classList.remove('rec')};
  rec.start(500);t0=performance.now();$('#sh').classList.add('rec');
};
async function save(it){
  const ext=it.k==='img'?'jpg':(it.blob.type.includes('mp4')?'mp4':'webm');
  const f=new File([it.blob],'DV_'+Date.now()+'.'+ext,{type:it.blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=it.url;a.download=f.name;a.click();
}
function render(){
  const g=$('#gl');g.innerHTML='';
  if(!items.length){g.textContent='NO TAPE';return}
  items.forEach(it=>{
    const d=document.createElement('div');d.className='it';
    const el=document.createElement(it.k==='img'?'img':'video');el.src=it.url;
    if(it.k==='vid'){el.controls=true;el.playsInline=true}
    const b=document.createElement('button');b.className='btn';b.textContent='SAVE / SHARE';b.onclick=()=>save(it);
    d.append(el,b);g.append(d);
  });
}
$('#gb').onclick=()=>{render();$('#gal').classList.add('on')};
$('#gc').onclick=()=>$('#gal').classList.remove('on');
</script>
</body></html>
