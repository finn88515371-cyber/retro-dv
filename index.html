<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202329">
<title>HANDYCAM DV-2000</title>
<style>
:root{color-scheme:dark;--page:#0d0e11;--cam:#202329;--edge:#50545d;--deck:linear-gradient(#383c43,#202329);--ink:#f1f2f4;--mut:#a1a6ae;--btn:linear-gradient(#555a62,#292c32 50%,#17191d);--btn-edge:#696f78;--btn-ink:#fff;--accent:linear-gradient(#c8e5ff,#7db9ee 50%,#4289ce);--accent-ink:#102b45;--menu:#25282e;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.cam{position:relative;display:flex;flex-direction:column;gap:8px;width:min(100%,620px);height:100%;margin:auto;padding:10px;background:var(--cam);border:2px solid var(--edge);border-radius:var(--radius);overflow:hidden}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:-10px -10px 0;padding:0 10px;height:30px;background:linear-gradient(#4d535d,#282b31);font-size:12px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;flex:none}
.tb{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--btn-edge);border-bottom-width:2px;border-radius:7px;background:var(--btn);color:var(--btn-ink);padding:7px 9px;font-size:11px;letter-spacing:.02em;box-shadow:inset 0 1px 1px #ffffff20,0 1px 2px #0005;transition:filter .14s,transform .14s,box-shadow .14s;user-select:none}
.btn:active{filter:brightness(.86);transform:translateY(1px) scale(.985)}
.btn.act{background:var(--accent);color:var(--accent-ink);border-color:#83b9e6;box-shadow:inset 0 1px 1px #fff9,0 1px 3px #0005}
.lcd{position:relative;flex:1;min-height:100px;background:#000;border:5px solid #454a53;border-radius:13px;box-shadow:inset 0 0 22px #000;overflow:hidden}
#out{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{opacity:.92}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;background:#000;color:#b5bac2;font-size:12px;line-height:1.6}
#pw .btn{font-size:13px;padding:11px 18px}
.deck{flex:none;background:var(--deck);border:1px solid var(--edge);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:9px;box-shadow:inset 0 1px 1px #fff1}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;align-items:center;gap:4px;min-width:0}
.zb{width:38px;padding:5px 0;font-size:16px}
.zr{font-size:11px;min-width:40px;text-align:center;color:var(--mut)}
.shut{position:relative;flex:none;width:58px;height:58px;border-radius:50%;padding:0;border:4px solid #9ca4ae;background:linear-gradient(#4c525b,#22262b);box-shadow:inset 0 2px 3px #fff4,0 2px 5px #0008;transition:transform .12s}
.shut:after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#ff8d83,#d92d22 54%,#8f140e);box-shadow:inset 0 2px 3px #fff6,0 1px 3px #0007}
.shut.photo:after{background:radial-gradient(circle at 32% 25%,#fff,#d5dbe4 58%,#8593a5)}
.shut.rec:after{inset:16px;border-radius:5px}
.shut:active{transform:scale(.93)}
#menu{display:none;flex:none;max-height:44%;overflow:auto;background:var(--menu);border:1px solid var(--edge);border-radius:10px;padding:10px}
.cam.menu #menu{display:block}
.cam.menu .deck{display:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px}
.tabs .btn{flex:none}
.pane{display:none}.pane.on{display:block}
.gh{font-size:11px;color:var(--mut);margin:12px 0 6px;letter-spacing:.08em}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}
.note{font-size:11px;line-height:1.55;color:var(--mut);margin:5px 0}
.ms{display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0}
.ms span{width:100px;flex:none}.ms input{flex:1;min-width:0;accent-color:#78b8ee}.ms i{width:42px;text-align:right;color:var(--mut);font-size:11px;font-style:normal}
.field{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}.field label{width:100px;flex:none}.field input[type=text],.field select{min-width:0;flex:1;background:#111318;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:7px}
.field input[type=color]{width:42px;height:32px;border:0;background:transparent;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:8px 12px;margin:8px 0}.checks label{display:flex;align-items:center;gap:5px;font-size:12px}.checks input{accent-color:#78b8ee}
#lvl{height:6px;background:#555;border-radius:5px;overflow:hidden;margin:7px 0}#lvl b{display:block;width:0;height:100%;background:#54d58b}
#gal{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:linear-gradient(145deg,#292d34,#101114);animation:fadeIn .2s ease-out}
#gal.on{display:flex}
#gal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #4c515a;font-size:12px;letter-spacing:.1em}
.gtitle small{display:block;margin-top:4px;color:#aeb5bf;font-size:10px;letter-spacing:0}
#gl{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;align-content:start;padding:13px}
#gl .it{display:flex;flex-direction:column;gap:6px;min-width:0;padding:6px;border:1px solid #50555e;border-radius:11px;background:linear-gradient(#3a3f47,#202329);box-shadow:0 3px 10px #0005;animation:thumbIn .24s ease-out both}
#gl .preview{position:relative;overflow:hidden;border-radius:7px;background:#050505;aspect-ratio:4/3}
#gl img,#gl video{width:100%;height:100%;object-fit:contain;display:block}
.meta{font-size:10px;line-height:1.5;color:#c5cad2;display:flex;justify-content:space-between;gap:6px}
.savebtn{border:1px solid #a5d2ff!important;border-radius:8px!important;padding:11px 7px!important;background:linear-gradient(#d8edff,#86c5fa 48%,#388bd4)!important;color:#102b45!important;font-size:12px!important;font-weight:800;box-shadow:inset 0 1px 1px #fff,0 2px 4px #0006}
.danger{background:linear-gradient(#6c4144,#48272a);border-color:#98666b}
.empty{grid-column:1/-1;text-align:center;padding:48px 12px;color:#aeb5bf;font-size:12px;line-height:1.8}
.empty .reel{font-size:36px;opacity:.8;margin-bottom:10px}
.toast{position:absolute;z-index:30;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 14px;border:1px solid #ffffff55;border-radius:20px;background:#222a;color:white;font-size:12px;box-shadow:0 4px 18px #0008;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.skin-xp{--page:linear-gradient(#2f6fd6,#7db0ee 55%,#6fb25a 56%,#44842f);--cam:#ece9d8;--edge:#0831d9;--deck:#ece9d8;--ink:#000;--mut:#4a4a4a;--btn:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);--btn-edge:#003c74;--btn-ink:#000;--accent:linear-gradient(#cdcab8,#e6e3d3);--accent-ink:#000;--menu:#fcfcfe;--radius:8px;--font:Tahoma,"Segoe UI",sans-serif}
body.skin-w7{--page:radial-gradient(ellipse at 25% 15%,#8fd3ff,#2a7fc4 45%,#0a2f5e);--cam:linear-gradient(#f4f6f9,#d8e2ef);--edge:#8c9caf;--deck:linear-gradient(#f4f6f9,#dce4ed);--ink:#111;--mut:#505a66;--btn:linear-gradient(#fff,#ececec 49%,#dcdcdc 50%,#cfcfcf);--btn-edge:#707070;--btn-ink:#111;--accent:linear-gradient(#cfe6fa,#9ccbf0 49%,#6fb1e8 50%,#8cc4f2);--accent-ink:#000;--menu:#f0f0f0;--radius:7px}
body.skin-metal{--page:radial-gradient(ellipse at top,#777d85,#24272d 75%);--cam:#c9cdd2;--edge:#eef0f2;--deck:linear-gradient(#edf0f3,#aeb4bc 48%,#d9dde2);--ink:#20242a;--mut:#626a74;--btn:linear-gradient(#fff,#e1e4e8 48%,#bcc2ca 50%,#e6e8eb);--btn-edge:#858c96;--btn-ink:#252a31;--accent:linear-gradient(#fff,#c9e3f8 50%,#8bbbe7);--accent-ink:#102b45;--menu:#e5e8ec}
body.skin-black{--page:radial-gradient(ellipse at top,#33383e,#08090b 80%);--cam:#202328;--edge:#555a62;--deck:linear-gradient(#383c42,#17191d);--ink:#f2f3f5;--mut:#a1a6ae;--btn:linear-gradient(#555a62,#292c32 50%,#17191d);--btn-edge:#696f78;--btn-ink:#fff;--accent:linear-gradient(#f9fafb,#b7c0cb);--accent-ink:#17191d;--menu:#22252a}
body.skin-ceramic{--page:linear-gradient(145deg,#e5e4df,#a7a8a8);--cam:#f5f4ef;--edge:#fff;--deck:linear-gradient(#fff,#e5e3dd);--ink:#33343a;--mut:#7e7f84;--btn:linear-gradient(#fff,#f1f0eb 52%,#d7d6d0);--btn-edge:#c3c2bb;--btn-ink:#33343a;--accent:linear-gradient(#fff,#d8e5f5);--accent-ink:#24354d;--menu:#f7f6f1}
body.skin-champagne{--page:radial-gradient(ellipse at top,#b9a27c,#514333 80%);--cam:#e6d4b1;--edge:#fff0cf;--deck:linear-gradient(#f8e8c9,#c9b38c);--ink:#453723;--mut:#817054;--btn:linear-gradient(#fff5dd,#e7d3aa 50%,#cbb487);--btn-edge:#a18a60;--btn-ink:#453723;--accent:linear-gradient(#fff8e8,#edce8b);--accent-ink:#46351d;--menu:#f3e7cf}
body.skin-leather{--page:radial-gradient(ellipse at top,#513a2d,#17100d 80%);--cam:#39271e;--edge:#725442;--deck:linear-gradient(#5a4030,#2b1c15);--ink:#f1e2cc;--mut:#c1a78b;--btn:linear-gradient(#77553d,#4a3022 50%,#342116);--btn-edge:#967356;--btn-ink:#fff0dc;--accent:linear-gradient(#f3dfb9,#c8a675);--accent-ink:#362318;--menu:#38271e}
body.skin-champagne .lcd,body.skin-ceramic .lcd,body.skin-metal .lcd{border-color:#747b84}
body.skin-leather .cam{background-image:repeating-linear-gradient(35deg,#ffffff03 0 2px,#00000008 2px 4px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes thumbIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes shutterFlash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* Landscape is deliberately compact; preview stays the main focus. */
body.land .cam{width:100%;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 184px;grid-template-rows:auto auto minmax(0,1fr);gap:7px;padding:8px}
body.land .top{grid-column:2;grid-row:1;align-content:center;justify-content:center}
body.land .lcd{grid-column:1;grid-row:1/4;min-height:0}
body.land .deck{grid-column:2;grid-row:2;justify-content:center;padding:7px;gap:8px}
body.land #menu{grid-column:2;grid-row:2/4;max-height:none;height:100%;min-height:0}
body.land .cam.menu{grid-template-columns:minmax(0,1fr) 280px}
body.land .cam.menu .top{grid-column:2;grid-row:1}
body.land .cam.menu .lcd{grid-column:1;grid-row:1/4}
body.land .cam.menu #menu{grid-column:2;grid-row:2/4}
body.land .ctl{gap:5px;flex-wrap:wrap;justify-content:center}
body.land .seg{justify-content:center;flex-wrap:wrap}
body.land .btn{padding:6px 7px;font-size:10px}
body.land .shut{width:50px;height:50px}
body.land .top .tb{justify-content:center}
body.land .top .tb:last-child #skb{display:none}
@media(max-width:390px){.btn{padding:6px 7px;font-size:10px}.cam{padding:7px;gap:6px}.deck{padding:7px}.shut{width:52px;height:52px}#gl{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px;padding:10px}}
</style>
</head>
<body>
<div class="cam">
  <div class="tbar"><span>◉ HANDYCAM DV-2000</span><span>—　□　×</span></div>
  <div class="top">
    <div class="tb"><button class="btn" id="bar">4:3</button><button class="btn" id="bre">480p</button></div>
    <div class="tb"><button class="btn" id="gb">GALLERY 0</button><button class="btn" id="mb">MENU</button></div>
  </div>
  <div class="lcd">
    <canvas id="out" width="640" height="480"></canvas>
    <div id="flash"></div>
    <div id="pw"><div>点击 POWER 开机并允许使用摄像头</div><button class="btn act" id="pwb">⏻ POWER</button></div>
  </div>
  <div class="deck">
    <div class="ctl">
      <div class="seg"><button class="btn zb" id="zo">－</button><span class="zr" id="zr">1.0×</span><button class="btn zb" id="zi">＋</button></div>
      <button class="btn" id="mic">MIC OFF</button>
    </div>
    <div class="ctl">
      <div class="seg"><button class="btn act" id="mV">VIDEO</button><button class="btn" id="mP">PHOTO</button></div>
      <button class="shut" id="sh" aria-label="快门"></button>
      <div class="seg"><button class="btn" id="ori">横屏</button><button class="btn" id="fl">FLIP</button></div>
    </div>
  </div>
  <div id="menu">
    <div class="mh"><b>SETTINGS / 设置</b><button class="btn" id="mc">CLOSE</button></div>
    <div class="tabs" id="tabs"></div><div id="panes"></div>
  </div>
  <div id="gal"><header><div class="gtitle">TAPE LIBRARY<small id="gsub">你的复古影像收藏</small></div><button class="btn" id="gc">✕ 关闭</button></header><div id="gl"></div></div>
  <div class="toast" id="toast"></div>
</div><script>
'use strict';
const $=s=>document.querySelector(s), cam=$('.cam'), out=$('#out'), oc=out.getContext('2d');
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.setAttribute('playsinline','');
const D={wb:-.08,sh:.45,pf:.25,ca:.25,bl:.08,bd:.18,bm:.25,nz:.25,sn:.12,vg:.22,jt:.15,sat:.95};
const DEFAULTS={...D};
const DS={mic:false,gain:1,ns:true,agc:true,ec:false,lofi:false,abr:1,skin:3};
let P={...D},S={...DS};
try{Object.assign(P,JSON.parse(localStorage.getItem('dvP3')||'{}'))}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem('dvS3')||'{}'))}catch(e){}
const saveSettings=()=>{try{localStorage.setItem('dvP3',JSON.stringify(P));localStorage.setItem('dvS3',JSON.stringify(S));localStorage.setItem('dvW3',JSON.stringify(WM))}catch(e){}};
const SK=['dv','xp','w7','metal','black','ceramic','champagne','leather'];
const SKNAME=['经典 DV','Windows XP','Windows 7','拉丝银色','专业黑色','白色陶瓷','香槟金','复古皮革'];
function applySkin(){document.body.classList.remove(...SK.map(s=>'skin-'+s));document.body.classList.add('skin-'+SK[Math.max(0,Math.min(SK.length-1,S.skin|0))]);saveSettings()}
applySkin();
const FN=['DV','VHS','NIGHT','B&W','HOME','CYBER','GOLD','PORTRA','FUJI','FADE','CINE'];
const FILTERS=[
 {name:'DV 原色',desc:'清淡自然，轻微磁带质感',css:'none'},
 {name:'VHS 磁带',desc:'轻微褪色与扫描线',css:'saturate(.88) contrast(.96)'},
 {name:'夜景',desc:'略微提亮暗部',css:'brightness(1.06) saturate(.92)'},
 {name:'黑白',desc:'经典黑白影像',css:'grayscale(1) contrast(1.04)'},
 {name:'家庭录像',desc:'温暖、柔和的家庭影像',css:'sepia(.13) saturate(.91)'},
 {name:'Cyber',desc:'冷调数码复古',css:'hue-rotate(18deg) saturate(1.08)'},
 {name:'Gold 金色',desc:'温暖金黄、高光柔和',css:'sepia(.18) saturate(1.06)'},
 {name:'Portrait 人像',desc:'柔和肤色与低反差',css:'saturate(.86) contrast(.92) brightness(1.02)'},
 {name:'Fuji 青绿',desc:'轻微青绿与冷调',css:'hue-rotate(-7deg) saturate(.94)'},
 {name:'Fade 褪色',desc:'低反差、轻褪色',css:'saturate(.72) contrast(.86) brightness(1.04)'},
 {name:'Cine 电影',desc:'柔和冷暖平衡',css:'saturate(.88) contrast(.96)'}
];
let stream=null,audioStream=null,audioContext=null,audioDest=null,audioAnalyser=null;
let on=false,facing='environment',mode='video',rec=null,chunks=[],recStart=0,items=[],fi=0,ri=0,si=2,land=innerWidth>innerHeight,zoom=1,zoomTarget=1,lastFrame=0,frameCount=0;
const RATIOS=[['4:3',4/3],['16:9',16/9],['1:1',1],['2.35:1',2.35],['原始',0]], RES=[240,360,480,720,1080];
const WM={enabled:true,color:'#e8e4d5',font:'mono',size:14,opacity:.88,position:'br',date:true,time:true,rec:true,device:true,filter:false,serial:false,custom:'',shadow:true};
try{Object.assign(WM,JSON.parse(localStorage.getItem('dvW3')||'{}'))}catch(e){}
let shotNo=1,displayDate=true;
const fontMap={mono:'ui-monospace,Menlo,monospace',ios:'-apple-system,BlinkMacSystemFont,sans-serif',serif:'Georgia,serif',type:'Courier New,monospace'};
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('on'),1800)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/3600)+':'+String(Math.floor(sec/60)%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function addPane(name){const d=document.createElement('div');d.className='pane';const b=document.createElement('button');b.className='btn';b.textContent=name;b.onclick=()=>showPane(d);$('#tabs').append(b);$('#panes').append(d);d.tab=b;return d}
const panes=[],chipSync=[];
function showPane(d){panes.forEach(p=>{p.classList.toggle('on',p===d);p.tab.classList.toggle('act',p===d)})}
function head(p,t){const e=document.createElement('div');e.className='gh';e.textContent=t;p.append(e)}
function note(p,t){const e=document.createElement('div');e.className='note';e.textContent=t;p.append(e)}
function chips(p,labels,get,set){const w=document.createElement('div');w.className='chips';const bs=labels.map((label,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{set(i);sync()};w.append(b);return b});function sync(){bs.forEach((b,i)=>b.classList.toggle('act',get()===i))}chipSync.push(sync);p.append(w);sync()}
function slider(p,label,min,max,step,obj,key,cb){const l=document.createElement('label');l.className='ms';l.innerHTML='<span></span><input type="range"><i></i>';l.children[0].textContent=label;const input=l.children[1],v=l.children[2];input.min=min;input.max=max;input.step=step;function sync(){input.value=obj[key];v.textContent=(+obj[key]).toFixed(2)}input.oninput=()=>{obj[key]=+input.value;v.textContent=(+obj[key]).toFixed(2);saveSettings();cb&&cb()};p.append(l);sync();return sync}
function toggle(p,label,obj,key,cb){const w=document.createElement('div');w.className='chips';const b=document.createElement('button');b.className='btn';function sync(){b.textContent=label+' '+(obj[key]?'开':'关');b.classList.toggle('act',!!obj[key])}b.onclick=()=>{obj[key]=!obj[key];sync();saveSettings();cb&&cb()};w.append(b);p.append(w);sync();return sync}
function field(p,label,control){const r=document.createElement('div');r.className='field';const l=document.createElement('label');l.textContent=label;r.append(l,control);p.append(r);return control}
function textInput(value,placeholder=''){const i=document.createElement('input');i.type='text';i.value=value;i.placeholder=placeholder;return i}
function selectInput(options,value){const s=document.createElement('select');options.forEach(([label,val])=>{const o=document.createElement('option');o.textContent=label;o.value=val;s.append(o)});s.value=value;return s}
function check(p,label,key){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=!!WM[key];i.onchange=()=>{WM[key]=i.checked;saveSettings()};l.append(i,document.createTextNode(label));p.append(l)}
const pFilter=addPane('滤镜');panes.push(pFilter);head(pFilter,'FILM LOOK / 胶片风格');note(pFilter,'滤镜会应用于取景器、照片和录制的视频。选择轻量风格，保留自然的光线与肤色。');
chips(pFilter,FILTERS.map(f=>f.name),()=>fi,i=>{fi=i;updateFilterButtons();toast('滤镜：'+FILTERS[fi].name)});
const filterDesc=document.createElement('div');filterDesc.className='note';pFilter.append(filterDesc);
function updateFilterButtons(){filterDesc.textContent=FILTERS[fi].desc;chipSync.forEach(f=>f())}
const pQuality=addPane('画质');panes.push(pQuality);head(pQuality,'分辨率');chips(pQuality,RES.map(n=>n+'p'),()=>si,i=>{if(isRecording())return;si=i;$('#bre').textContent=RES[si]+'p'});
head(pQuality,'画面比例');chips(pQuality,RATIOS.map(r=>r[0]),()=>ri,i=>{if(isRecording())return;ri=i;$('#bar').textContent=RATIOS[ri][0]});
head(pQuality,'成像调整');const pSyncs=[];

const pLook=addPane('外观');panes.push(pLook);head(pLook,'界面皮肤');chips(pLook,SKNAME,()=>S.skin,i=>{S.skin=i;applySkin();toast('外观已切换')});note(pLook,'拟物化金属、专业黑色、白陶瓷、香槟金与复古皮革主题。皮肤设置已从主界面移除。');

head(pWater,'样式');const color=document.createElement('input');color.type='color';color.value=WM.color;field(pWater,'水印颜色',color);color.oninput=()=>{WM.color=color.value;saveSettings()};
const fsel=selectInput([['等宽数码','mono'],['iOS 系统','ios'],['衬线字体','serif'],['打字机','type']],WM.font);field(pWater,'字体',fsel);fsel.onchange=()=>{WM.font=fsel.value;saveSettings()};

function syncAll(){chipSync.forEach(f=>f())}
$('#mb').onclick=()=>cam.classList.toggle('menu');$('#mc').onclick=()=>cam.classList.remove('menu');
$('#skb')?.remove();/* Camera and optional audio */
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){pwMsg('当前浏览器不支持摄像头，请使用 HTTPS 页面并允许摄像头权限。');return}
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});vid.srcObject=stream;await vid.play();on=true;$('#pw').style.display='none';toast('摄像机已就绪')}
  catch(e){pwMsg('无法使用摄像头：'+(e.name||e)+'。请检查浏览器权限。')}
}
function pwMsg(s){$('#pw').firstElementChild.textContent=s}
$('#pwb').onclick=async()=>{await startCamera();if(S.mic)await setupAudio()};
async function setupAudio(){
  if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null}
  audioDest=null;audioAnalyser=null;
  $('#mic').textContent=S.mic?'MIC ON':'MIC OFF';$('#mic').classList.toggle('act',S.mic);
  if(!S.mic)return;
  try{
    audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!!S.ec,noiseSuppression:!!S.ns,autoGainControl:!!S.agc}});
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioContext=new AC();const src=audioContext.createMediaStreamSource(audioStream),gain=audioContext.createGain(),an=audioContext.createAnalyser(),dest=audioContext.createMediaStreamDestination();
    gain.gain.value=S.gain;an.fftSize=256;src.connect(gain);gain.connect(dest);gain.connect(an);audioDest=dest;audioAnalyser=an;audioContext.gainNode=gain;
  }catch(e){S.mic=false;saveSettings();$('#mic').textContent='MIC OFF';toast('麦克风不可用，请检查权限')}
}
$('#mic').onclick=()=>{if(isRecording())return;S.mic=!S.mic;saveSettings();setupAudio()};
$('#fl').onclick=async()=>{if(isRecording())return;facing=facing==='user'?'environment':'user';if(on)await startCamera()};
$('#mV').onclick=()=>setMode('video');$('#mP').onclick=()=>setMode('photo');
function setMode(m){if(isRecording())return;mode=m;$('#mV').classList.toggle('act',m==='video');$('#mP').classList.toggle('act',m==='photo');$('#sh').classList.toggle('photo',m==='photo');$('#sh').classList.remove('rec')}
function isRecording(){return rec&&rec.state==='recording'}
function setRes(i){if(isRecording())return;si=i;$('#bre').textContent=RES[si]+'p';syncAll()}
function setRatio(i){if(isRecording())return;ri=i;$('#bar').textContent=RATIOS[ri][0];syncAll()}
$('#bre').onclick=()=>setRes((si+1)%RES.length);$('#bar').onclick=()=>setRatio((ri+1)%RATIOS.length);
function zoomButton(sel,dir){const e=$(sel);let active=false,last=0;e.addEventListener('pointerdown',ev=>{ev.preventDefault();active=true;last=performance.now();try{e.setPointerCapture(ev.pointerId)}catch(_){} });['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,()=>active=false));function tick(){if(active){const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;zoomTarget=Math.max(1,Math.min(5,zoomTarget*Math.exp(dir*dt*.7)))}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
zoomButton('#zi',1);zoomButton('#zo',-1);
$('#ori').onclick=()=>{land=!land;document.body.classList.toggle('land',land);$('#ori').textContent=land?'竖屏':'横屏'};
function updateOrientation(){land=innerWidth>innerHeight;document.body.classList.toggle('land',land);$('#ori').textContent=land?'竖屏':'横屏'}
updateOrientation();addEventListener('resize',updateOrientation);
function filterStyle(){return FILTERS[fi]?.css||'none'}
function watermark(ctx,w,h,recording){
 if(!WM.enabled)return;
 const parts=[];
 if(WM.device)parts.push(WM.custom.trim()||'HANDYCAM DV-2000');
 if(WM.filter)parts.push(FILTERS[fi].name.toUpperCase());
 if(WM.serial)parts.push('TAPE '+String(shotNo).padStart(4,'0'));
 if(WM.date)parts.push(new Date().toLocaleDateString('en-CA'));
 if(WM.time)parts.push(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));
 if(WM.rec)parts.push(recording?'● REC':'STBY');
 if(!parts.length)return;
 const size=Math.max(9,Math.min(28,+WM.size||14))*Math.max(1,w/640);
 ctx.save();ctx.globalAlpha=Math.max(.2,Math.min(1,+WM.opacity||.88));ctx.font=`600 ${size}px ${fontMap[WM.font]||fontMap.mono}`;ctx.textBaseline='top';
 const pad=size*.8,lines=parts;const lineH=size*1.45;let x=pad,y=pad;
 if(WM.position==='tr'||WM.position==='br')x=w-pad;
 if(WM.position==='bl'||WM.position==='br')y=h-pad-lineH*lines.length;
 lines.forEach((s,i)=>{ctx.textAlign=(WM.position==='tr'||WM.position==='br')?'right':'left';if(WM.shadow){ctx.shadowColor='#000';ctx.shadowBlur=size*.35;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1}ctx.fillStyle=WM.color;ctx.fillText(s,x,y+i*lineH, w-pad*2);ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0});
 ctx.restore();
}
function drawFrame(){
 const w=out.width,h=out.height;if(!w||!h)return;
 oc.save();oc.clearRect(0,0,w,h);oc.fillStyle='#000';oc.fillRect(0,0,w,h);
 if(on&&vid.readyState>=2){
   const vw=vid.videoWidth||640,vh=vid.videoHeight||480,ratio=RATIOS[ri][1]||vw/vh;
   let dw=w,dh=h;if(dw/dh>ratio)dw=dh*ratio;else dh=dw/ratio;
   dw*=zoom;dh*=zoom;
   const dx=(w-dw)/2,dy=(h-dh)/2;
   oc.save();oc.filter=filterStyle();
   if(facing==='user'){oc.translate(w,0);oc.scale(-1,1)}
   oc.drawImage(vid,dx,dy,dw,dh);oc.restore();
   /* Very subtle analog texture, kept light by default. */
   if(P.nz>.01){oc.globalAlpha=Math.min(.10,P.nz*.035);for(let i=0;i<Math.round(w*h/4500);i++){oc.fillStyle=Math.random()>.5?'#fff':'#000';oc.fillRect(Math.random()*w,Math.random()*h,1,1)}}
   if(P.vg>.01){const g=oc.createRadialGradient(w/2,h/2,Math.min(w,h)*.22,w/2,h/2,Math.max(w,h)*.72);g.addColorStop(0,'#0000');g.addColorStop(1,`rgba(0,0,0,${Math.min(.28,P.vg*.13)})`);oc.fillStyle=g;oc.fillRect(0,0,w,h)}
   if(P.sn>.01){oc.globalAlpha=Math.min(.10,P.sn*.035);oc.fillStyle='#000';for(let y=0;y<h;y+=4)oc.fillRect(0,y,w,1)}
   oc.globalAlpha=1;
   watermark(oc,w,h,isRecording());
   /* Minimal status icons */
   oc.font=`bold ${Math.max(10,Math.min(w,h)*.025)}px ${fontMap.mono}`;oc.fillStyle='#fff';oc.shadowColor='#000';oc.shadowBlur=3;oc.textAlign='left';oc.textBaseline='bottom';
   if(mode==='photo')oc.fillText('PHOTO',w*.025,h*.96);else if(!WM.enabled||!WM.rec)oc.fillText(isRecording()?'● REC':'STBY',w*.025,h*.96);
   if(zoom>1.03)oc.fillText(zoom.toFixed(1)+'×',w*.025,h*.91);
   oc.restore();
 }else{oc.fillStyle='#a0a0a0';oc.font='12px monospace';oc.textAlign='center';oc.fillText('NO SIGNAL',w/2,h/2)}
}
function resizeCanvas(){
 const N=RES[si],ratio=RATIOS[ri][1]||((vid.videoWidth||640)/(vid.videoHeight||480));let w,h;
 if(ratio>=1){h=N;w=Math.round(N*ratio)}else{w=N;h=Math.round(N/ratio)}
 w=Math.max(2,w&~1);h=Math.max(2,h&~1);
 if(out.width!==w||out.height!==h){out.width=w;out.height=h}
}
function loop(ts){requestAnimationFrame(loop);if(!on||vid.readyState<2||ts-lastFrame<33)return;lastFrame=ts;zoom+=(zoomTarget-zoom)*.18;$('#zr').textContent=zoom.toFixed(1)+'×';resizeCanvas();drawFrame()}
requestAnimationFrame(loop);function flash(){const f=$('#flash');f.classList.add('on');f.style.animation='shutterFlash .42s ease-out';setTimeout(()=>{f.classList.remove('on');f.style.animation=''},430)}
function addItem(item){items.unshift(item);$('#gb').textContent='GALLERY '+items.length;shotNo++;renderGallery();saveSettings()}
$('#sh').onclick=()=>{
 if(!on){toast('请先开启摄像头');return}
 if(mode==='photo'){
   flash();drawFrame();out.toBlob(blob=>{if(!blob){toast('照片生成失败');return}addItem({kind:'img',blob,url:URL.createObjectURL(blob),date:new Date()})},'image/jpeg',.94);toast('已拍摄照片');return
 }
 if(isRecording()){rec.stop();return}
 if(typeof MediaRecorder==='undefined'){toast('此浏览器不支持录像');return}
 try{
   const cs=out.captureStream(30);if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>cs.addTrack(t));
   const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
   const opts={videoBitsPerSecond:Math.min(12e6,Math.max(2e6,RES[si]*RES[si]*4)),audioBitsPerSecond:[64000,128000,256000][S.abr]};if(mime)opts.mimeType=mime;
   chunks=[];rec=new MediaRecorder(cs,opts);rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
   rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});addItem({kind:'vid',blob,url:URL.createObjectURL(blob),date:new Date()});$('#sh').classList.remove('rec');toast('录像已保存到图库')};
   rec.start(300);recStart=performance.now();$('#sh').classList.add('rec');toast('开始录像');
 }catch(e){toast('无法开始录像：'+(e.message||e))}
};
async function saveItem(it){
 const ext=it.kind==='img'?'jpg':(it.blob.type.includes('mp4')?'mp4':'webm');
 const file=new File([it.blob],`DV_${Date.now()}.${ext}`,{type:it.blob.type||'application/octet-stream'});
 try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});toast('已打开分享菜单');return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=it.url;a.download=file.name;document.body.append(a);a.click();a.remove();toast('已触发下载；iPhone 可使用分享菜单存入照片')
}
function deleteItem(index){const it=items[index];if(!it)return;if(!confirm('确定删除这段影像吗？'))return;URL.revokeObjectURL(it.url);items.splice(index,1);$('#gb').textContent='GALLERY '+items.length;renderGallery();toast('已删除')}
function renderGallery(){
 const g=$('#gl');g.innerHTML='';$('#gsub').textContent=`${items.length} 个片段 · PHOTO / VIDEO`;
 if(!items.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<div class="reel">▣</div><strong>NO TAPE YET</strong><br>你的下一段回忆，会从这里开始。<br><br>关闭图库，按下快门拍摄第一张照片。';g.append(e);return}
 items.forEach((it,index)=>{
   const d=document.createElement('div');d.className='it';d.style.animationDelay=Math.min(index*.025,.2)+'s';
   const preview=document.createElement('div');preview.className='preview';
   const el=document.createElement(it.kind==='img'?'img':'video');el.src=it.url;if(it.kind==='vid'){el.controls=true;el.playsInline=true}preview.append(el);
   const meta=document.createElement('div');meta.className='meta';const type=document.createElement('span');type.textContent=it.kind==='img'?'▧ PHOTO':'▶ VIDEO';const time=document.createElement('span');time.textContent=it.date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(type,time);
   const save=document.createElement('button');save.className='btn savebtn';save.textContent=it.kind==='img'?'⬇ 保存照片 / 分享':'⬇ 保存视频 / 分享';save.onclick=()=>saveItem(it);
   const del=document.createElement('button');del.className='btn danger';del.textContent='删除';del.onclick=()=>deleteItem(index);
   d.append(preview,meta,save,del);g.append(d)
 })
}
$('#gb').onclick=()=>{$('#gal').classList.add('on');renderGallery()};$('#gc').onclick=()=>$('#gal').classList.remove('on');
$('#gal').addEventListener('click',e=>{if(e.target===$('#gal'))$('#gal').classList.remove('on')});
