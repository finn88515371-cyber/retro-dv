<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANDYCAM DV-2000</title>
<style>
:root{color-scheme:dark;--ink:#d8d8d0;--red:#d8322b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{height:100%;margin:0;background:#0d0d0f;color:var(--ink);font-family:ui-monospace,Menlo,monospace;overflow:hidden}
.cam{position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;color:#8b8d92}
.top b{color:#c9c9c0;font-size:12px}
.tb{display:flex;gap:5px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:12px;border:6px solid #34363c;box-shadow:inset 0 0 24px #000,0 0 0 2px #0a0a0a,0 6px 20px #0008;overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:16px;font-size:12px;line-height:1.6;color:#9a9a92}
.deck{background:linear-gradient(#2d2f35,#1f2024);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:6px;border:1px solid #3b3d44}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px}
.btn{background:#3a3c43;color:var(--ink);border:1px solid #55575f;border-bottom-width:3px;border-radius:7px;padding:6px 9px;font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer}
.btn.act{background:#c9c9c0;color:#111;border-color:#e8e8e0}
.btn:active{transform:translateY(1px)}
.shut{width:58px;height:58px;border-radius:50%;border:4px solid #9a9a96;background:#18181b;position:relative;cursor:pointer;padding:0;flex:none}
.shut::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--red);transition:.15s}
.shut.photo::after{background:#e4e4dc}
.shut.rec::after{inset:16px;border-radius:5px;background:var(--red)}
.sl{display:flex;align-items:center;gap:7px;font-size:11px;color:#8b8d92;flex:1}
.sl input{flex:1;accent-color:#c9c9c0;min-width:0;margin:0}
/* landscape layout */
body.land .cam{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:auto minmax(0,1fr)}
body.land .lcd{grid-row:1/3;grid-column:1}
body.land .top{grid-column:2;grid-row:1;justify-content:center}
body.land .ttl{display:none}
body.land .deck{grid-column:2;grid-row:2;overflow-y:auto;justify-content:center}
body.land .ctl{flex-direction:column}
body.land .seg{flex-wrap:wrap;justify-content:center}
body.rotr .cam,body.rotl .cam{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;padding:14px 22px}
body.rotr .cam{transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
body.rotl .cam{transform:translateY(100vh) rotate(-90deg);transform:translateY(100dvh) rotate(-90deg)}
/* menu */
#menu{position:absolute;z-index:15;display:none;background:rgba(16,16,18,.92);overflow-y:auto;padding:10px 12px 16px;box-sizing:border-box;left:0;right:0;bottom:0;height:52%;border-top:2px solid #3b3d44;border-radius:14px 14px 0 0}
body.land #menu{left:auto;top:0;height:auto;width:50%;border-top:0;border-left:2px solid #3b3d44;border-radius:14px 0 0 14px}
#menu.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.ms{display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0}
.ms span{width:76px;flex:none}
.ms input{flex:1;min-width:0;accent-color:#c9c9c0;margin:0}
.ms i{width:34px;text-align:right;font-style:normal;color:#8b8d92;font-size:11px}
/* gallery */
#gal{position:absolute;inset:0;background:#111;z-index:20;display:none;flex-direction:column}
#gal.on{display:flex}
#gal header{display:flex;justify-content:space-between;align-items:center;padding:10px;font-size:12px;letter-spacing:.1em}
#gl{flex:1;overflow:auto;padding:0 10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-content:start}
#gl .it{background:#1d1e22;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
#gl img,#gl video{width:100%;display:block;background:#000}
#gl .btn{border-radius:0;border-width:1px 0 0;text-align:center}
</style></head>
<body>
<div class="cam">
  <div class="top"><b class="ttl">DV-2000</b><div class="tb"><button class="btn" id="gb">GALLERY 0</button><button class="btn" id="mb">MENU</button></div></div>
  <div class="lcd">
    <canvas id="out" width="640" height="480"></canvas>
    <div id="flash"></div>
    <div id="pw"><div>点 POWER 开机并允许使用摄像头 / 麦克风</div><button class="btn act" id="pwb">⏻ POWER</button></div>
  </div>
  <div class="deck">
    <label class="sl">W<input type="range" id="zm" min="1" max="6" step=".01" value="1">T</label>
    <div class="ctl">
      <div class="seg"><button class="btn act" id="mV">VIDEO</button><button class="btn" id="mP">PHOTO</button></div>
      <button class="shut" id="sh" aria-label="shutter"></button>
      <div class="seg"><button class="btn" id="ori">横屏</button><button class="btn" id="fl">FLIP</button></div>
    </div>
  </div>
  <div id="menu">
    <div class="mh"><b>MENU</b><span><button class="btn" id="rs">RESET</button> <button class="btn" id="mc">CLOSE</button></span></div>
    <div class="chips" id="chips">
      <button class="btn act" data-f="0">DV</button><button class="btn" data-f="1">VHS</button><button class="btn" data-f="2">NIGHT</button><button class="btn" data-f="3">B&amp;W</button><button class="btn" data-f="4">HOME</button><button class="btn" data-f="5">CYBER</button>
    </div>
    <div id="mp"></div>
  </div>
  <div id="gal"><header><span>TAPE LIBRARY</span><button class="btn" id="gc">CLOSE</button></header><div id="gl"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t;uniform vec2 r;
uniform float T,m,z,fb,F,rot,pf,ca,bl,bd,bm,nz,sn,vg,jt,sat,wb;
varying vec2 u;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(1.-p.y,p.x);else if(rot>.5)p=vec2(p.y,1.-p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb;}
float Yf(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec3 w=vec3(.299,.587,.114);
 vec2 sc=u;float L=floor(sc.y*240.);float f=floor(T*30.);
 float jit=h(vec2(L,f))-.5;
 vec2 uv=(sc-.5)/z+.5;
 uv.x+=jit*.0025*jt+sin(sc.y*8.+T*1.5)*.0006*jt;
 vec2 c=sc-.5;
 vec2 c2=c*(.008+dot(c,c)*.04)*ca+vec2(.0012*ca,0.);
 vec3 col=vec3(S(uv+c2).r,S(uv).g,S(uv-c2*1.3).b);
 float rr=bl*.003+fb;float asp=r.x/r.y;
 if(rr>.0002){vec3 bk=(col+S(uv+vec2(rr,0.))+S(uv-vec2(rr,0.))+S(uv+vec2(0.,rr*asp))+S(uv-vec2(0.,rr*asp)))*.2;col=mix(col,bk,clamp(rr*400.,0.,.9));}
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,clamp(.8*bd,0.,1.));
 col=Yf(col)+(cm-Yf(cm))*1.15;
 float ya=Yf(S(uv+vec2(.005,0.))),yb=Yf(S(uv-vec2(.005,0.)));
 float pu=smoothstep(.04,.3,abs(ya-yb))*(.35+.65*smoothstep(.4,.9,max(ya,yb)));
 col+=vec3(.55,.05,1.)*pu*.7*pf;col.g-=pu*.12*pf;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*asp);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*bm*vec3(1.,.92,.8);
 col=(col-.5)*1.1+.5;col=mix(vec3(Yf(col)),col,1.1*sat);
 col+=vec3(.02,.01,-.01);col=max(col,vec3(.04));
 float Y=Yf(col);float nk=1.;
 if(F==1.){col=mix(vec3(Y),col,.75)*vec3(1.05,.96,1.1);nk=1.6;}
 else if(F==2.){col=vec3(.25,1.,.3)*min(Y*2.2,1.3);nk=2.4;}
 else if(F==3.){col=vec3(Y)*1.12+.02;nk=1.3;}
 else if(F==4.){col=vec3(Y)*vec3(1.25,1.,.72)*1.05+(col-Y)*.35;}
 else if(F==5.){col=mix(col,mix(vec3(0.,.3,.4),vec3(1.,.4,.8),smoothstep(.1,.9,Y)),.65);}
 col*=vec3(1.+wb*.14,1.+wb*.03,1.-wb*.18);
 col*=1.-.05*sn*(.5+.5*sin(sc.y*240.*6.2832));
 col*=1.-.02*sn*mod(f,2.);
 float n=h(sc*r+T)-.5;col+=n*.22*nz*nk*(1.-Yf(col)*.5);
 col+=(vec3(h(sc*r*.5+T+1.),h(sc*r*.5+T+2.),h(sc*r*.5+T+3.))-.5)*.08*nz*nk;
 col*=max(1.-dot(c,c)*1.1*vg,0.);
 gl_FragColor=vec4(col,1.);}`;
function sh(ty,s){const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
const UL={};['r','T','m','z','fb','F','rot','pf','ca','bl','bd','bm','nz','sn','vg','jt','sat','wb'].forEach(n=>UL[n]=gl.getUniformLocation(pg,n));

/* params + menu */
const D={pf:1.2,ca:1,bl:.3,bd:1,bm:1,nz:1,sn:1,vg:1,jt:1,sat:1,wb:0};
let P={...D};
try{Object.assign(P,JSON.parse(localStorage.getItem('dvP')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('dvP',JSON.stringify(P))}catch(e){}};
const PR=[['wb','白平衡 蓝↔黄',-1,1],['pf','紫边',0,3],['ca','色散(红蓝边)',0,3],['bl','画面模糊',0,2],['bd','色彩拖影',0,2],['bm','高光扩散',0,3],['nz','噪点',0,3],['sn','扫描线',0,3],['vg','暗角',0,2],['jt','画面抖动',0,3],['sat','饱和度',0,2]];
const rows={};
PR.forEach(([k,n,lo,hi])=>{
  const l=document.createElement('label');l.className='ms';
  l.innerHTML=`<span>${n}</span><input type="range" min="${lo}" max="${hi}" step=".01" value="${P[k]}"><i>${(+P[k]).toFixed(2)}</i>`;
  const i=l.children[1],v=l.children[2];rows[k]=[i,v];
  i.oninput=()=>{P[k]=+i.value;v.textContent=P[k].toFixed(2);store()};
  $('#mp').append(l);
});
$('#rs').onclick=()=>{P={...D};PR.forEach(([k])=>{rows[k][0].value=P[k];rows[k][1].textContent=P[k].toFixed(2)});store()};
$('#mb').onclick=()=>$('#menu').classList.toggle('on');
$('#mc').onclick=()=>$('#menu').classList.remove('on');

/* state */
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;
let stream,facing='environment',on=false,mode='video',rec,chunks=[],t0=0,items=[],last=0,W=0,H=0,rot=0;
let zt=1,zc=1,zT=0,fi=0;
const FN=['DV','VHS','NIGHT','B&W','HOME','CYBER'];

/* orientation */
let lastDp=innerHeight>=innerWidth,land=!lastDp;
function layout(){
  const dp=innerHeight>=innerWidth,b=document.body.classList;
  b.toggle('land',land);b.toggle('rotr',land&&dp);b.toggle('rotl',!land&&!dp);
  $('#ori').textContent=land?'竖屏':'横屏';
}
addEventListener('resize',()=>{const dp=innerHeight>=innerWidth;if(dp!==lastDp){lastDp=dp;land=!dp}layout()});
$('#ori').onclick=()=>{if(rec&&rec.state==='recording')return;land=!land;layout()};
layout();

async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pwMsg('此环境不支持摄像头，请在 Safari 中直接打开链接。');return}
  const c={video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true};
  try{stream=await navigator.mediaDevices.getUserMedia(c)}
  catch(e){try{c.audio=false;stream=await navigator.mediaDevices.getUserMedia(c)}
  catch(e2){pwMsg('无法使用摄像头：'+e2.name+'。请检查权限。');return}}
  vid.srcObject=stream;await vid.play();on=true;$('#pw').style.display='none';
}
function pwMsg(s){$('#pw').firstElementChild.textContent=s}
$('#pwb').onclick=start;
$('#fl').onclick=()=>{if(rec&&rec.state==='recording')return;facing=facing==='user'?'environment':'user';if(on)start()};
$('#zm').oninput=e=>{zt=+e.target.value;zT=performance.now()};
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;fi=+b.dataset.f;
  document.querySelectorAll('#chips .btn').forEach(x=>x.classList.toggle('act',x===b))};

function size(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
  rot=(land&&vw<vh)?1:(!land&&vw>vh)?2:0;
  const a=rot?vh:vw,b=rot?vw:vh,s=Math.min(1,960/Math.max(a,b)),w=Math.round(a*s),h=Math.round(b*s);
  if(w!==W||h!==H){W=w;H=h;gc.width=out.width=w;gc.height=out.height=h;gl.viewport(0,0,w,h)}
  return true;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ov(T){
  const f=Math.max(12,Math.min(W,H)*.05),m=f*.9,isRec=rec&&rec.state==='recording';
  oc.font=`bold ${f}px ui-monospace,Menlo,monospace`;oc.textBaseline='top';
  const tx=(s,x,y,al)=>{oc.textAlign=al||'left';
    oc.fillStyle='rgba(255,40,60,.75)';oc.fillText(s,x-1.6,y);
    oc.fillStyle='rgba(40,200,255,.75)';oc.fillText(s,x+1.6,y);
    oc.shadowColor='#fff';oc.shadowBlur=f*.35;oc.fillStyle='#f4f4ee';oc.fillText(s,x,y);oc.shadowBlur=0};
  const blink=Math.floor(T*1.5)%2===0;
  if(mode==='photo')tx('PHOTO',m,m);
  else tx(isRec?(blink?'● REC':'  REC'):'STBY',m,m);
  if(fi)tx(FN[fi],m,m+f*1.25);
  tx('SP ▮▮▮▯',W-m,m,'right');
  if(performance.now()-zT<1800||Math.abs(zt-zc)>.01){
    const n=Math.max(0,Math.min(8,Math.round((zc-1)/5*8)));
    tx('W '+'▮'.repeat(n)+'▯'.repeat(8-n)+' T',W/2,H-m-f*3.4,'center');
  }
  const d=new Date();
  tx(d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase(),m,H-m-f*2.2);
  tx(d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),m,H-m-f);
  tx(isRec?fmt((performance.now()-t0)/1000):'0:00:00',W-m,H-m-f,'right');
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!on||vid.readyState<2||ts-last<33||!size())return;
  last=ts;const T=ts/1000;
  zc+=(zt-zc)*.08;if(Math.abs(zt-zc)<.002)zc=zt;
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  gl.uniform2f(UL.r,W,H);gl.uniform1f(UL.T,T%1000);
  gl.uniform1f(UL.m,facing==='user'?1:0);gl.uniform1f(UL.z,zc);
  gl.uniform1f(UL.fb,Math.min(Math.abs(zt-zc)*.0015,.008));
  gl.uniform1f(UL.F,fi);gl.uniform1f(UL.rot,rot);
  for(const k in D)gl.uniform1f(UL[k],P[k]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  oc.drawImage(gc,0,0);ov(T);
}
oc.fillStyle='#000';oc.fillRect(0,0,640,480);requestAnimationFrame(loop);

function setMode(m){
  if(rec&&rec.state==='recording')return;
  mode=m;$('#mV').classList.toggle('act',m==='video');$('#mP').classList.toggle('act',m==='photo');
  $('#sh').className='shut'+(m==='photo'?' photo':'');
}
$('#mV').onclick=()=>setMode('video');$('#mP').onclick=()=>setMode('photo');
function add(it){items.unshift(it);$('#gb').textContent='GALLERY '+items.length}
$('#sh').onclick=()=>{
  if(!on)return;
  if(mode==='photo'){
    const fl=$('#flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),60);
    out.toBlob(b=>add({k:'img',blob:b,url:URL.createObjectURL(b)}),'image/jpeg',.92);
    return;
  }
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(typeof MediaRecorder==='undefined'){alert('此浏览器不支持录像');return}
  const cs=out.captureStream(30);
  stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  chunks=[];rec=new MediaRecorder(cs,mt?{mimeType:mt,videoBitsPerSecond:3e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/mp4'});add({k:'vid',blob:b,url:URL.createObjectURL(b)});$('#sh').classList.remove('rec')};
  rec.start(500);t0=performance.now();$('#sh').classList.add('rec');
};
async function save(it){
  const ext=it.k==='img'?'jpg':(it.blob.type.includes('mp4')?'mp4':'webm');
  const f=new File([it.blob],'DV_'+Date.now()+'.'+ext,{type:it.blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=it.url;a.download=f.name;a.click();
}
function render(){
  const g=$('#gl');g.innerHTML='';
  if(!items.length){g.textContent='NO TAPE';return}
  items.forEach(it=>{
    const d=document.createElement('div');d.className='it';
    const el=document.createElement(it.k==='img'?'img':'video');el.src=it.url;
    if(it.k==='vid'){el.controls=true;el.playsInline=true}
    const b=document.createElement('button');b.className='btn';b.textContent='SAVE / SHARE';b.onclick=()=>save(it);
    d.append(el,b);g.append(d);
  });
}
$('#gb').onclick=()=>{render();$('#gal').classList.add('on')};
$('#gc').onclick=()=>$('#gal').classList.remove('on');
</script>
</body></html>
