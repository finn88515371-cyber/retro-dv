body.skin-ccdd .cam{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 2px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.18),inset -1px 0 0 rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.7),0 12px 34px rgba(0,0,0,.85)}
html{height:100%;height:100dvh}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.lseg{display:inline-flex;gap:2px}.lseg .btn{flex:1}.btn.dis{opacity:.4}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.side{display:contents}
.tbar{order:0}.top{order:1}.lcd{order:2}#fstrip{order:3}.deck{order:4}#menu{order:5}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}

const idb=()=>new Promise(res=>{try{const rq=indexedDB.open('dvcam',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('items',{keyPath:'id'});rq.onsuccess=()=>{db=rq.result;res()};rq.onerror=()=>res()}catch(e){res()}});
var PV={on:false,key:null,pub:null};
const idbPutRaw=r=>{if(!db)return;try{db.transaction('items','readwrite').objectStore('items').put(r)}catch(e){}};
const idbPut=r=>{if(r&&r.pv){if(PV.key&&r.blob)pvEnc(r).then(idbPutRaw);return}idbPutRaw(r)};
const idbDel=id=>{if(!db)return;try{db.transaction('items','readwrite').objectStore('items').delete(id)}catch(e){}};
const idbAll=()=>new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}});
const pad=n=>String(n).padStart(2,'0');
function mkItem(r){const d=new Date(r.t),ext=r.k==='img'?'jpg':(r.blob.type.includes('mp4')?'mp4':'webm');
  const name=`DV_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${ext}`;
  return {...r,url:URL.createObjectURL(r.blob),file:new File([r.blob],name,{type:r.blob.type})}}
function updCount(){$('#gn').textContent=items.length+' 项'}
function addItem(k,blob,dur){
  const r={id:Date.now()+'-'+Math.floor(Math.random()*1000),k,blob,t:Date.now(),d:dur||0,fav:false};if(PV.on)r.pv=true;
  idbPut(r);items.unshift(mkItem(r));updCount();
  const g=$('#gb');g.classList.remove('bump');void g.offsetWidth;g.classList.add('bump');
  if(galOpen()&&!$('#gal').classList.contains('edit'))renderGal();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
idb().then(async()=>{const all=await idbAll();items=all.filter(r=>!r.pv).sort((a,b)=>b.t-a.t).map(mkItem);updCount()});

function addSlider(p,label,lo,hi,st,obj,key,cb){
  const l=document.createElement('label');l.className='ms';
  l.innerHTML=`<span>${label}</span><input type="range" min="${lo}" max="${hi}" step="${st}"><i></i>`;
  const i=l.children[1],v=l.children[2];
  const sync=()=>{i.value=obj[key];v.textContent=(+obj[key]).toFixed(2)};
  i.oninput=()=>{obj[key]=+i.value;v.textContent=(+i.value).toFixed(2);save();cb&&cb()};
  sync();p.append(l);p.sy.push(sync);p.rk.push([obj,key,DEF.get(obj)[key],cb]);
}
function addToggle(p,label,obj,key,cb){
  const w=document.createElement('div');w.className='chips';
  const b=document.createElement('button');b.className='btn';
  const sync=()=>{b.classList.toggle('act',!!obj[key]);b.textContent=label+' '+(obj[key]?'开':'关')};
  b.onclick=()=>{obj[key]=!obj[key];sync();save();cb&&cb()};
  sync();w.append(b);p.append(w);p.sy.push(sync);p.rk.push([obj,key,DEF.get(obj)[key],cb]);

function addChips(p,labels,get,set){

/* mic: only active in VIDEO mode and when the gallery is closed */
const AC=window.AudioContext||window.webkitAudioContext;
let ac,astream,aDst,aHP,aLP,aGain,aAn,aSrc,pS;
const lvBuf=new Uint8Array(512);
const wantMic=()=>S.mic&&mode==='video'&&!galOpen();
function nodes(){if(!aGain)return;aGain.gain.value=S.gain;aHP.frequency.value=S.lofi?250:20;aLP.frequency.value=S.lofi?4800:20000}
function stopMic(){if(astream)astream.getTracks().forEach(t=>t.stop());astream=aDst=aSrc=aAn=aGain=null}
function updMic(){
  const b=$('#mic');b.textContent='MIC';b.classList.toggle('act',S.mic);
  b.style.display=mode==='video'?'':'none';
  const f=$('#fls');const fi2=mode==='photo'?'p':'v';if(f.dataset.i!==fi2){f.dataset.i=fi2;f.innerHTML=mode==='photo'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5L5.5 13.5h5.5l-1 8 8-11.5h-5.5z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>'}f.classList.toggle('act',mode==='photo'?S.flash:S.light);
}
async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,autoGainControl:S.agc}});
    if(!wantMic()){s.getTracks().forEach(t=>t.stop());return}
    astream=s;await ac.resume();
    aSrc=ac.createMediaStreamSource(s);
    aHP=ac.createBiquadFilter();aHP.type='highpass';aLP=ac.createBiquadFilter();aLP.type='lowpass';
    aGain=ac.createGain();aAn=ac.createAnalyser();aAn.fftSize=512;aDst=ac.createMediaStreamDestination();
    aSrc.connect(aHP);aHP.connect(aLP);aLP.connect(aGain);aGain.connect(aDst);aGain.connect(aAn);nodes();
  }catch(e){S.mic=false;save();updMic();pS&&pS.sy.forEach(f=>f());alert('无法使用麦克风：'+(e.name||e))}
}
function applyMic(){stopMic();if(wantMic()){if(!ac&&AC)ac=new AC();if(ac&&ac.resume)ac.resume();startMic()}updMic()}
const guard=k=>()=>{if(recing()){S[k]=!S[k];pS.sy.forEach(f=>f());return}applyMic()};
$('#mic').onclick=()=>{if(recing())return;S.mic=!S.mic;save();pS.sy.forEach(f=>f());applyMic()};

const LB={L:null,R:null,marks:new Map(),on:false};
function landB(on){if(LB.on===on)return;LB.on=on;
  if(!LB.L){LB.L=document.createElement('div');LB.L.className='lcol lcL';LB.R=document.createElement('div');LB.R.className='lcol lcR';cam.append(LB.L,LB.R);
    LB.l1=document.createElement('div');LB.l1.className='lrow';LB.r1=document.createElement('div');LB.r1.className='lrow lrow3';LB.r2=document.createElement('div');LB.r2.className='lrow lrow3';LB.ra=document.createElement('div');LB.ra.className='lsub';LB.rb=document.createElement('div');LB.rb.className='lsub lthin';LB.R.append(LB.ra,LB.rb)}
  const L=[[LB.l1,['#bar','#bre']],['.lseg'],['#fb'],['#fxb'],['.mseg']],Rr=[[LB.r1,['#mic','#fls']],['#dial'],['#sh'],['.rseg2']],Rb=[['#mb'],['.zgrp'],['.evr']];
  const mv=(el,to)=>{if(!LB.marks.has(el)){const m=document.createComment('m');el.parentNode.insertBefore(m,el);LB.marks.set(el,m)}to.append(el)};
  const back=el=>{const m=LB.marks.get(el);if(m)m.parentNode.insertBefore(el,m.nextSibling)};
  const each=(spec,fn)=>spec.forEach(x=>{if(x.length===2&&x[0] instanceof Element){x[1].forEach(q=>fn($(q),x[0]))}else fn(document.querySelector(x[0]),null)});
  if(on){each(L,(el,row)=>{if(row){mv(el,row);if(row.parentNode!==LB.L)LB.L.append(row)}else mv(el,LB.L)});each(Rr,(el,row)=>{if(row){mv(el,row);if(row.parentNode!==LB.ra)LB.ra.append(row)}else mv(el,LB.ra)});each(Rb,el=>mv(el,LB.rb))}
  else{each(L,el=>back(el));each(Rr,el=>back(el));each(Rb,el=>back(el))}
  window.updEVS&&updEVS()}

async function pvSetPin(pin){const salt=crypto.getRandomValues(new Uint8Array(16)),key=await pvDerive(pin,salt),iv=crypto.getRandomValues(new Uint8Array(12));

      show('验证中…');const key=await pvCheck(p);

const CLL=[['h','横着拼',0,0],['v','竖着拼',0,0],['g4','四宫格',2,2],['g6','六宫格 竖',2,3],['g6h','六宫格 横',3,2],['g8','八宫格 竖',2,4],['g8h','八宫格 横',4,2],['g9','九宫格',3,3]];

const CL={lay:'g4',ar:'1',n:2,gap:.03,rad:0,bg:'#ffffff',ph:[],sel:-1,on:false};
function clDef(n){return n<=3?(n===2?'v':'v'):n===4?'g4':n<=6?'g6':n<=8?'g8':'g9'}
function clCount(){const L=CLL.find(l=>l[0]===CL.lay);return L[2]?L[2]*L[3]:CL.n}
async function clLoad(it){let src=null,w=0,h=0;try{src=await createImageBitmap(it.blob);w=src.width;h=src.height}catch(e){src=await new Promise(r=>{const I=new Image();I.onload=()=>r(I);I.onerror=()=>r(null);I.src=it.url});if(src){w=src.naturalWidth;h=src.naturalHeight}}
  if(!src||!w)return null;const k=Math.min(1,1400/Math.max(w,h)),c=mkC(Math.round(w*k),Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);if(src.close)src.close();return {it,c,ox:0,oy:0,z:1}}
function clGeom(){const L=CLL.find(l=>l[0]===CL.lay),n=clCount(),P=i=>CL.ph[i],far=i=>{if(CL.ar!=='o')return +CL.ar;const p=P(i)||CL.ph.find(Boolean);return p?p.c.width/p.c.height:1};
  const U=1000,g=CL.gap*U,R=[];let W,H;
  if(L[2]){const a=CL.ar==='o'?far(0):+CL.ar,cw=a>=1?U:U*a,ch=a>=1?U/a:U;W=L[2]*cw+(L[2]+1)*g;H=L[3]*ch+(L[3]+1)*g;
    for(let r=0;r<L[3];r++)for(let c=0;c<L[2];c++)R.push({x:g+c*(cw+g),y:g+r*(ch+g),w:cw,h:ch})}
  else if(CL.lay==='h'){let x=g;for(let i=0;i<n;i++){const w=U*far(i);R.push({x,y:g,w,h:U});x+=w+g}W=x;H=U+2*g}
  else{let y=g;for(let i=0;i<n;i++){const h=U/far(i);R.push({x:g,y,w:U,h});y+=h+g}W=U+2*g;H=y}
  return {W,H,R}}
function clDraw(x,G,k,prev){x.save();x.scale(k,k);x.fillStyle=CL.bg;x.fillRect(0,0,G.W,G.H);
  G.R.forEach((r,i)=>{const p=CL.ph[i],rr=CL.rad*Math.min(r.w,r.h)*.5;x.save();x.beginPath();
    if(rr>0){x.moveTo(r.x+rr,r.y);x.arcTo(r.x+r.w,r.y,r.x+r.w,r.y+r.h,rr);x.arcTo(r.x+r.w,r.y+r.h,r.x,r.y+r.h,rr);x.arcTo(r.x,r.y+r.h,r.x,r.y,rr);x.arcTo(r.x,r.y,r.x+r.w,r.y,rr);x.closePath()}else x.rect(r.x,r.y,r.w,r.h);x.clip();
    if(p){const iw=p.c.width,ih=p.c.height,s=Math.max(r.w/iw,r.h/ih)*p.z,dw=iw*s,dh=ih*s,sx=dw-r.w,sy=dh-r.h;x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
      x.drawImage(p.c,r.x-sx/2-p.ox*sx/2,r.y-sy/2-p.oy*sy/2,dw,dh)}
    else if(prev){x.fillStyle='rgba(128,128,128,.28)';x.fillRect(r.x,r.y,r.w,r.h);x.fillStyle='rgba(255,255,255,.85)';x.font='bold '+Math.min(r.w,r.h)*.25+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('+',r.x+r.w/2,r.y+r.h/2)}

  x.restore()}
function clRender(){if(!CL.on)return;const G=clGeom(),v=$('#clg .clv'),c=$('#clc'),aw=Math.max(50,v.clientWidth-16),ah=Math.max(50,v.clientHeight-16),k=Math.min(aw/G.W,ah/G.H),dpr=Math.min(2.5,window.devicePixelRatio||1);
  c.style.width=Math.round(G.W*k)+'px';c.style.height=Math.round(G.H*k)+'px';const pw=Math.round(G.W*k*dpr),ph=Math.round(G.H*k*dpr);if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
  const x=c.getContext('2d');x.clearRect(0,0,pw,ph);clDraw(x,G,pw/G.W,true);CL.G=G}

function clClose(){CL.on=false;CL.ph.forEach(p=>{if(p&&p.c){p.c.width=p.c.height=1}});CL.ph=[];CL.sel=-1;const m=document.getElementById('clg');if(m)m.style.display='none';const c=document.getElementById('clc');if(c){c.width=c.height=1}}
function clBuild(){let m=document.getElementById('clg');if(m)return m;m=document.createElement('div');m.id='clg';
  m.innerHTML=`<div class="pkh"><button class="btn" id="clx">取消</button><b id="clt">拼图</b><button class="btn act" id="clok">保存</button></div>
  <div class="clb"><div class="clv"><canvas id="clc"></canvas></div><div class="clp">
   <div class="gh">布局</div><div class="chips" id="cll"></div>
   <div class="chips" id="cln"><button class="btn" id="clnm">－</button><b id="clnv"></b><button class="btn" id="clnp">＋</button></div>
   <div class="gh">每格比例</div><div class="chips" id="cla"></div>
   <label class="ms"><span>边框</span><input type="range" id="clgp" min="0" max=".12" step=".002"><i id="clgpv"></i></label>
   <label class="ms"><span>圆角</span><input type="range" id="clrd" min="0" max="1" step=".01"><i id="clrdv"></i></label>
   <div class="gh">边框颜色</div><div class="sws tcs" id="clbg"></div>
   <div id="clsel"><div class="gh">选中的格子</div><label class="ms"><span>放大</span><input type="range" id="clz" min="1" max="3" step=".01"><i id="clzv"></i></label>
    <div class="vr"><button class="btn" id="clrep">换一张</button><button class="btn warn" id="clrm">清空这格</button></div></div>

  CLL.forEach(([id,n])=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.dataset.l=id;b.onclick=()=>{CL.lay=id;if(!CLL.find(l=>l[0]===id)[2])CL.n=Math.max(2,Math.min(9,CL.ph.filter(Boolean).length||CL.n));CL.sel=-1;clUI()};$('#cll').append(b)});
  CLA.forEach(([a,n])=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.dataset.a=a;b.onclick=()=>{CL.ar=a;clUI()};$('#cla').append(b)});

  {const l=document.createElement('label');l.innerHTML='<input type="color" value="#88aacc">';l.querySelector('input').oninput=e=>{CL.bg=e.target.value;clUI()};$('#clbg').append(l)}
