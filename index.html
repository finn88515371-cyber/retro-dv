<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24272c">
<title>HANDYCAM DV-2000 · Retro Camera</title>
<style>
:root{color-scheme:dark;--page:#101114;--shell:#292d33;--shell-hi:#424750;--edge:#666d77;--ink:#f5f5f2;--mut:#b2b8c0;--panel:#202329;--button-top:#626873;--button-bottom:#25282e;--button-edge:#777e88;--button-ink:#f8f8f8;--accent-top:#d7efff;--accent-bottom:#5498d6;--accent-ink:#122c42;--screen-edge:#17191d;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#454b54,#101114 72%);color:var(--ink);font-family:var(--font);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}
button{touch-action:manipulation;cursor:pointer;user-select:none}
.app{position:relative;width:min(100%,660px);height:100%;margin:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:linear-gradient(145deg,var(--shell-hi),var(--shell) 34%,#191b20);border:2px solid var(--edge);border-radius:var(--radius);box-shadow:inset 0 1px 0 #ffffff24,0 12px 35px #0007;overflow:hidden}
.brandbar{height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px;color:var(--mut);font-size:10px;font-weight:800;letter-spacing:.15em;text-shadow:0 1px 1px #000}
.brand{color:var(--ink);font-size:12px;letter-spacing:.18em}
.led{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#4ed26c;box-shadow:0 0 6px #4ed26c88}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;flex-wrap:wrap}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--button-edge);border-bottom-width:2px;border-radius:6px;padding:7px 9px;color:var(--button-ink);background:linear-gradient(var(--button-top),var(--button-bottom));font-size:11px;font-weight:650;box-shadow:inset 0 1px 0 #ffffff38,0 2px 2px #0005;text-shadow:0 1px 1px #0006;transition:filter .12s,transform .12s}
.btn:active{filter:brightness(.84);transform:translateY(1px)}
.btn.active{background:linear-gradient(var(--accent-top),var(--accent-bottom));color:var(--accent-ink);border-color:#a9d9ff;text-shadow:0 1px #fff8;box-shadow:inset 0 1px 0 #fff,0 2px 4px #0005}
.btn.big{padding:10px 14px;font-size:12px}
.btn.save{background:linear-gradient(#fff3bd,#ffc44e 46%,#d77c16);color:#422706;border-color:#ffe0a0;text-shadow:0 1px #fff8;font-weight:850;font-size:12px;padding:10px 8px}
.btn.danger{background:linear-gradient(#8a4b4b,#4c2528);border-color:#a36c6c}
.viewport{position:relative;flex:1;min-height:80px;overflow:hidden;border:5px solid var(--screen-edge);border-radius:9px;background:#000;box-shadow:inset 0 0 0 1px #7c838b,inset 0 0 22px #000;isolation:isolate}
#view{display:block;width:100%;height:100%;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.fire{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.9}100%{opacity:0}}
.powercover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px;background:radial-gradient(ellipse at center,#15181c,#000);color:#b7c0ca;font:12px/1.6 ui-monospace,monospace}
.powercover .power{font-size:14px;padding:12px 20px}
.deck{flex:none;display:flex;flex-direction:column;gap:9px;padding:9px;border:1px solid var(--edge);border-radius:9px;background:linear-gradient(#484e57,#24272d);box-shadow:inset 0 1px #ffffff20,0 2px 3px #0004}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zoomread{font:11px ui-monospace,monospace;color:var(--mut);min-width:38px;text-align:center}
.zoombtn{font-size:17px;min-width:36px;padding:4px}
.shutter{position:relative;flex:none;width:58px;height:58px;border-radius:50%;padding:0;border:4px solid #a8afb8;background:linear-gradient(#737b85,#262a30);box-shadow:inset 0 2px 3px #fff6,0 3px 5px #0008}
.shutter:after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#ffaaa2,#df3229 54%,#82130f);box-shadow:inset 0 2px 3px #fff7,0 1px 2px #0008}
.shutter.photo:after{background:radial-gradient(circle at 32% 25%,#fff,#d3d9e1 58%,#7e8996)}
.shutter.recording:after{inset:17px;border-radius:4px}
.shutter:active{transform:scale(.94)}
.settings{display:none;flex:none;max-height:46%;overflow:auto;padding:10px;border:1px solid var(--edge);border-radius:9px;background:linear-gradient(#30343b,#1b1d22);box-shadow:inset 0 1px #ffffff16}
.app.menu .settings{display:block}
.app.menu .deck{display:none}
.settingshead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px}
.tabs .btn{white-space:nowrap;flex:none}
.pane{display:none}
.pane.show{display:block}
.section{margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid #ffffff1a;color:var(--mut);font-size:10px;font-weight:800;letter-spacing:.12em}
.hint{color:var(--mut);font-size:11px;line-height:1.5;margin:6px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.sliderrow{display:grid;grid-template-columns:95px minmax(60px,1fr) 42px;gap:7px;align-items:center;margin:8px 0;font-size:11px}
.sliderrow input{width:100%;min-width:0;accent-color:#82c4fa}
.sliderrow output{color:var(--mut);font:10px ui-monospace,monospace;text-align:right}
.field{display:grid;grid-template-columns:95px minmax(0,1fr);gap:8px;align-items:center;margin:8px 0;font-size:11px}
.field select,.field input[type=text]{width:100%;min-width:0;padding:7px;background:#121418;color:var(--ink);border:1px solid var(--edge);border-radius:5px}
.field input[type=color]{width:44px;height:30px;padding:0;border:0;background:transparent}
.checks{display:flex;gap:8px 12px;flex-wrap:wrap;margin:8px 0}
.checks label{font-size:11px;display:flex;align-items:center;gap:5px}
.checks input{accent-color:#82c4fa}
.gallery{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(145deg,#343941,#15171b);animation:appear .18s ease-out}
.gallery.open{display:flex}
@keyframes appear{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:scale(1)}}
.galleryhead{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #59616c;font-size:12px;letter-spacing:.12em}
.galleryhead small{display:block;margin-top:4px;color:var(--mut);font-size:10px;letter-spacing:0}
.gallerylist{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding:12px}
.item{min-width:0;display:flex;flex-direction:column;gap:7px;padding:6px;border:1px solid #5b636e;border-radius:8px;background:linear-gradient(#414751,#23262c);box-shadow:0 3px 8px #0006;animation:appear .2s ease-out}
.preview{aspect-ratio:4/3;background:#000;border-radius:4px;overflow:hidden}
.preview img,.preview video{width:100%;height:100%;object-fit:contain;display:block}
.meta{display:flex;justify-content:space-between;gap:6px;color:#c5cbd3;font:10px ui-monospace,monospace}
.item .btn{width:100%}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--mut);font:12px/1.8 ui-monospace,monospace}
.toast{position:absolute;z-index:20;bottom:16px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:18px;border:1px solid #ffffff45;background:#171a20;color:#fff;font-size:11px;box-shadow:0 4px 16px #0008;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Horizontal layout rearranges the interface; it never rotates or stretches the preview. */
@media (orientation:landscape) and (min-width:560px){
.app{width:100%;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 205px;grid-template-rows:25px auto minmax(0,1fr);gap:7px;padding:8px}
.brandbar{grid-column:1/3;grid-row:1}
.topbar{grid-column:2;grid-row:2;align-content:center;justify-content:center}
.viewport{grid-column:1;grid-row:2/4;min-height:0}
.deck{grid-column:2;grid-row:3;align-self:stretch;justify-content:center;padding:7px}
.row{flex-wrap:wrap;justify-content:center}
.group{justify-content:center}
.shutter{width:52px;height:52px}
.btn{padding:6px 7px;font-size:10px}
.settings{grid-column:2;grid-row:3;max-height:none;height:100%;min-height:0}
.app.menu{grid-template-columns:minmax(0,1fr) 285px}
.app.menu .topbar{grid-column:2;grid-row:2}
.app.menu .viewport{grid-column:1;grid-row:2/4}
.app.menu .settings{grid-column:2;grid-row:3}
.app.menu .deck{display:none}
}
@media(max-width:380px){
.app{padding:7px;gap:6px}
.btn{padding:6px 7px;font-size:10px}
.deck{padding:7px}
.shutter{width:52px;height:52px}
.sliderrow{grid-template-columns:82px minmax(45px,1fr) 38px}
.field{grid-template-columns:82px minmax(0,1fr)}
}
/* Skeuomorphic classic desktop themes */
body.xp{--page:#3b79c7;--shell:#ece9d8;--shell-hi:#fffdf4;--edge:#174ea6;--ink:#1a1a1a;--mut:#53565b;--panel:#f8f7f1;--button-top:#fffef8;--button-bottom:#d7d3c6;--button-edge:#7f9db9;--button-ink:#101010;--accent-top:#fff;--accent-bottom:#b8d7f6;--accent-ink:#081d38;--screen-edge:#8c8b83;--font:Tahoma,"Segoe UI",sans-serif;--radius:7px;background:linear-gradient(#1763be 0%,#82b9ec 55%,#65a849 56%,#34752a 100%)}
body.xp .app{background:linear-gradient(#fffdf1,#e5e1d2);box-shadow:inset 0 1px #fff,0 6px 22px #0006}
body.xp .brandbar{background:linear-gradient(#2868d8,#1749a5);margin:-8px -8px 0;padding:0 10px;color:#fff;text-shadow:0 1px #003}
body.xp .brand{color:#fff}
body.xp .deck,body.xp .settings{background:linear-gradient(#faf9f1,#e0ddd0)}
body.xp .settings{border-color:#b8b5a7}
body.xp .btn{box-shadow:inset 0 1px #fff,0 1px 1px #777}
body.xp .viewport{border-radius:3px}
body.w7{--page:#1a4770;--shell:#e6edf5;--shell-hi:#fff;--edge:#7896b4;--ink:#17283a;--mut:#52667a;--panel:#e9f1fa;--button-top:#fff;--button-bottom:#cbd9e8;--button-edge:#7795b4;--button-ink:#152c43;--accent-top:#fff;--accent-bottom:#9fd1fa;--accent-ink:#092a47;--screen-edge:#8799ac;--font:"Segoe UI",Tahoma,sans-serif;--radius:9px;background:radial-gradient(ellipse at 35% 0%,#8bd6ff,#236ca5 50%,#0a2a4d)}
body.w7 .app{background:linear-gradient(135deg,#f8fbffdd,#dce9f4f2 45%,#c4d6e7f5);backdrop-filter:blur(6px);box-shadow:inset 0 1px #fff,0 8px 30px #0007}
body.w7 .brandbar{background:linear-gradient(#e9f5ff,#a6c6e3);margin:-8px -8px 0;padding:0 10px;color:#31516c;text-shadow:0 1px #fff}
body.w7 .brand{color:#23445e}
body.w7 .deck,body.w7 .settings{background:linear-gradient(#f8fcff,#cbd9e8)}
body.w7 .btn{border-radius:5px;box-shadow:inset 0 1px #fff,0 1px 2px #667}
body.w7 .viewport{border-color:#8197aa}
body.silver{--page:#555b63;--shell:#c9ced5;--shell-hi:#f0f2f4;--edge:#f3f4f5;--ink:#222831;--mut:#606975;--button-top:#fff;--button-bottom:#aeb6c0;--button-edge:#8a939e;--button-ink:#20262e;--accent-top:#fff;--accent-bottom:#8cc7ef;--accent-ink:#142d40;--screen-edge:#646d78;background:radial-gradient(ellipse at top,#b8c0c9,#30353b)}
body.silver .app{background:linear-gradient(145deg,#f7f8f9,#aeb5bd 45%,#e4e7eb)}
body.silver .deck,body.silver .settings{background:linear-gradient(#e9edf1,#aeb5be)}
body.cream{--page:#b6aa91;--shell:#e7ddc6;--shell-hi:#fff5dc;--edge:#fff0cf;--ink:#4b3e2c;--mut:#88785e;--button-top:#fff8e5;--button-bottom:#d0bc96;--button-edge:#ad9872;--button-ink:#4b3a25;--accent-top:#fff;--accent-bottom:#e2bf7e;--accent-ink:#4b3517;--screen-edge:#8c7e68;background:radial-gradient(ellipse at top,#e5d6b6,#6e5a3d)}
body.cream .app{background:linear-gradient(145deg,#fff5df,#d2bd96)}
body.cream .deck,body.cream .settings{background:linear-gradient(#f7e9cc,#cbb68f)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<main class="app" id="app">
 <div class="brandbar"><span class="brand">◉ HANDYCAM <span style="font-weight:400">DV-2000</span></span><span><i class="led" id="led"></i><span id="stateText">STANDBY</span></span></div>
 <div class="topbar"><div class="group"><button class="btn" id="ratioBtn">4:3</button><button class="btn" id="resBtn">480p</button></div><div class="group"><button class="btn" id="galleryBtn">GALLERY 0</button><button class="btn" id="menuBtn">MENU ⚙</button></div></div>
 <div class="viewport"><canvas id="view" width="640" height="480"></canvas><div id="flash"></div><div class="powercover" id="powercover"><div id="powerText">按下 POWER 并允许浏览器访问摄像头</div><button class="btn active power" id="powerBtn">⏻ POWER ON</button></div></div>
 <div class="deck" id="deck"><div class="row"><div class="group"><button class="btn zoombtn" id="zoomOut">−</button><span class="zoomread" id="zoomRead">1.0×</span><button class="btn zoombtn" id="zoomIn">＋</button></div><button class="btn" id="micBtn">MIC OFF</button></div><div class="row"><div class="group"><button class="btn active" id="videoMode">VIDEO</button><button class="btn" id="photoMode">PHOTO</button></div><button class="shutter" id="shutter" aria-label="拍摄"></button><div class="group"><button class="btn" id="orientationBtn">横屏布局</button><button class="btn" id="flipBtn">FLIP</button></div></div></div>
 <section class="settings" id="settings"><div class="settingshead"><b>CAMERA SETTINGS / 设置</b><button class="btn" id="closeMenu">CLOSE ✕</button></div><nav class="tabs" id="tabs"></nav><div id="panes"></div></section>
 <section class="gallery" id="gallery"><header class="galleryhead"><div>TAPE LIBRARY<small id="gallerySub">你的复古影像收藏</small></div><button class="btn" id="closeGallery">✕ CLOSE</button></header><div class="gallerylist" id="galleryList"></div></section>
 <div class="toast" id="toast"></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), app=$('app'), canvas=$('view'), ctx=canvas.getContext('2d',{alpha:false}), video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=true;
const state={stream:null,audioStream:null,audioCtx:null,audioDest:null,recording:null,chunks:[],items:[],powered:false,mode:'video',facing:'environment',zoom:1,zoomTarget:1,ratio:'4:3',resolution:480,fit:'contain',skin:'classic',filter:'DV Original',watermark:true,waterColor:'#e8e4d5',waterFont:'mono',waterSize:14,waterOpacity:.88,waterPosition:'br',waterDate:true,waterTime:true,waterRec:true,waterDevice:true,waterFilter:false,waterSerial:false,customText:'',waterShadow:true,shotNo:1,frame:0};
const filters=[['DV Original','原始 DV · 清淡自然','none'],['VHS Tape','VHS 磁带','saturate(.88) contrast(.96)'],['Warm Home','家庭录像','sepia(.12) saturate(.94)'],['B&W','黑白胶片','grayscale(1) contrast(1.04)'],['Fade Film','褪色胶片','saturate(.74) contrast(.88) brightness(1.03)'],['Portra','柔和人像','saturate(.88) contrast(.94)'],['Fuji Green','青绿胶片','hue-rotate(-7deg) saturate(.94)'],['Gold 200','金色胶片','sepia(.16) saturate(1.05)'],['Night','夜景','brightness(1.06) saturate(.92)'],['Cine','电影柔和','saturate(.9) contrast(.97)']];
const quality=[['锐化','sharp',0,1.2,.01,1],['紫边','purple',0,1.2,.01,1.2],['色散','chromatic',0,1,.01,1],['模糊','blur',0,1,.01,0],['色彩拖影','smear',0,1,.01,.8],['高光扩散','bloom',0,1,.01,.8],['噪点','noise',0,1,.01,1],['扫描线','scan',0,1,.01,1],['暗角','vignette',0,1,.01,1],['抖动','jitter',0,1,.01,1],['饱和度','saturation',0,1.5,.01,1],['白平衡','whiteBalance',-1,1,.01,-.25]];
const q={};quality.forEach(a=>q[a[1]]=a[5]);
const skinClasses=['xp','w7','silver','cream'];function applySkin(){document.body.classList.remove(...skinClasses);if(skinClasses.includes(state.skin))document.body.classList.add(state.skin)}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2000)}
function section(p,title){const d=document.createElement('div');d.className='section';d.textContent=title;p.append(d)}

function showPane(p,b){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('show',x===p));document.querySelectorAll('#tabs .btn').forEach(x=>x.classList.toggle('active',x===b))}
function chips(p,options,get,set){const wrap=document.createElement('div');wrap.className='chips';const buttons=[];options.forEach(([label,value])=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{set(value);sync()};wrap.append(b);buttons.push([b,value])});p.append(wrap);function sync(){buttons.forEach(([b,v])=>b.classList.toggle('active',get()===v))}sync();return sync}

function field(p,label,el){const row=document.createElement('label');row.className='field';const name=document.createElement('span');name.textContent=label;row.append(name,el);p.append(row);return el}
function select(p,label,opts,current,change){const s=document.createElement('select');opts.forEach(([text,val])=>{const o=document.createElement('option');o.textContent=text;o.value=val;s.append(o)});s.value=current;s.onchange=()=>change(s.value);field(p,label,s);return s}
function toggle(p,label,key,initial,onChange){const wrap=document.createElement('div');wrap.className='chips';const b=document.createElement('button');b.className='btn';let val=initial;function sync(){b.textContent=label+'：'+(val?'开':'关');b.classList.toggle('active',val)}b.onclick=()=>{val=!val;sync();onChange(val)};wrap.append(b);p.append(wrap);sync();return {get:()=>val,set(v){val=v;sync()}}}
const pLook=addPane('胶片滤镜');section(pLook,'FILM PRESETS / 胶片预设');hint(pLook,'默认画面保持自然、清淡；胶片效果只在你主动选择时启用。');let selectedFilter='DV Original';const filterSync=chips(pLook,filters.map(f=>[f[0],f[0]]),()=>selectedFilter,v=>{selectedFilter=v;state.filter=v;toast('滤镜：'+v)});const filterDesc=document.createElement('div');filterDesc.className='hint';pLook.append(filterDesc);function syncFilterDesc(){filterDesc.textContent=(filters.find(f=>f[0]===selectedFilter)||filters[0])[1]}syncFilterDesc();
const pQuality=addPane('画质调节');section(pQuality,'VIDEO PROCESSING / 画质参数');hint(pQuality,'恢复旧版参数滑块范围与数值；滑动时会立即更新预览。');const qSliders=[];quality.forEach(a=>{const s=slider(pQuality,a[0],a[1],a[2],a[3],a[4],q[a[1]],v=>{q[a[1]]=v;state.frame=0});qSliders.push(s)});const reset=document.createElement('button');reset.className='btn';reset.textContent='恢复旧版画质参数';reset.onclick=()=>{quality.forEach(a=>q[a[1]]=a[5]);quality.forEach((a,i)=>qSliders[i].set(q[a[1]]));toast('已恢复旧版参数')};pQuality.append(reset);

const pWater=addPane('水印');section(pWater,'WATERMARK / 水印');const wmToggle=toggle(pWater,'拍摄水印','enabled',state.watermark,v=>{state.watermark=v});const wmChecks=document.createElement('div');wmChecks.className='checks';function checkbox(label,key){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=state[key];i.onchange=()=>state[key]=i.checked;l.append(i,document.createTextNode(label));wmChecks.append(l)}[['日期','waterDate'],['时间','waterTime'],['REC / STBY','waterRec'],['设备名称','waterDevice'],['滤镜名称','waterFilter'],['影像序号','waterSerial']].forEach(([l,k])=>checkbox(l,k));pWater.append(wmChecks);const color=document.createElement('input');color.type='color';color.value=state.waterColor;color.oninput=()=>state.waterColor=color.value;field(pWater,'文字颜色',color);select(pWater,'字体',[['等宽数码','mono'],['iOS 系统','ios'],['衬线字体','serif'],['打字机','type']],state.waterFont,v=>state.waterFont=v);slider(pWater,'字体大小','waterSize',9,28,1,state.waterSize,v=>state.waterSize=v);slider(pWater,'不透明度','waterOpacity',.2,1,.05,state.waterOpacity,v=>state.waterOpacity=v);select(pWater,'水印位置',[['左上','tl'],['右上','tr'],['左下','bl'],['右下','br']],state.waterPosition,v=>state.waterPosition=v);const custom=document.createElement('input');custom.type='text';custom.placeholder='自定义设备名称';custom.value=state.customText;custom.oninput=()=>state.customText=custom.value;field(pWater,'自定义名称',custom);const shadow=toggle(pWater,'文字阴影','shadow',state.waterShadow,v=>state.waterShadow=v);

showPane(pLook,$('tabs').firstElementChild);
function targetRatio(){if(state.ratio==='Original')return (video.videoWidth||640)/(video.videoHeight||480);return ({'4:3':4/3,'16:9':16/9,'1:1':1,'2.35:1':2.35})[state.ratio]||4/3}
function resizeOutput(){const ratio=targetRatio(),h=state.resolution;let w=Math.round(h*ratio);if(w%2)w++;canvas.width=Math.max(2,w);canvas.height=Math.max(2,h)}
function applyColor(ctx){const preset=(filters.find(x=>x[0]===selectedFilter)||filters[0])[2];const sat=Math.max(0,Math.min(2,q.saturation));const contrast=1+Math.max(-.18,Math.min(.22,q.sharp*.12));const blur=Math.max(0,q.blur*.9);const warm=Math.max(0,q.whiteBalance);const cool=Math.max(0,-q.whiteBalance);const extra=`saturate(${sat}) contrast(${contrast}) blur(${blur}px) sepia(${warm*.12}) hue-rotate(${cool*8}deg)`;ctx.filter=(preset==='none'?'':preset+' ')+extra}
const fontMap={mono:'ui-monospace,Menlo,monospace',ios:'-apple-system,BlinkMacSystemFont,sans-serif',serif:'Georgia,serif',type:'Courier New,monospace'};
function drawWatermark(recording){if(!state.watermark)return;const w=canvas.width,h=canvas.height,lines=[];if(state.waterDevice)lines.push(state.customText.trim()||'HANDYCAM DV-2000');if(state.waterFilter)lines.push(selectedFilter.toUpperCase());if(state.waterSerial)lines.push('TAPE '+String(state.shotNo).padStart(4,'0'));const d=new Date();if(state.waterDate)lines.push(d.toLocaleDateString('en-CA'));if(state.waterTime)lines.push(d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));if(state.waterRec)lines.push(recording?'● REC':'STBY');if(!lines.length)return;const size=state.waterSize*(w/640),pad=size*.8,lineH=size*1.4;let x=pad,y=pad;const right=state.waterPosition==='tr'||state.waterPosition==='br';if(right)x=w-pad;if(state.waterPosition==='bl'||state.waterPosition==='br')y=h-pad-lineH*lines.length;ctx.save();ctx.globalAlpha=state.waterOpacity;ctx.font=`600 ${size}px ${fontMap[state.waterFont]||fontMap.mono}`;ctx.textBaseline='top';ctx.textAlign=right?'right':'left';lines.forEach((line,i)=>{if(state.waterShadow){ctx.shadowColor='#000';ctx.shadowBlur=size*.4;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1}ctx.fillStyle=state.waterColor;ctx.fillText(line,x,y+i*lineH,w-pad*2)});ctx.restore()}
function draw(){const w=canvas.width,h=canvas.height;ctx.save();ctx.filter='none';ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(state.powered&&video.readyState>=2){const vw=video.videoWidth||640,vh=video.videoHeight||480,ratio=vw/vh;let dw=w,dh=h;if(state.fit==='contain'){if(w/h>ratio)dw=h*ratio;else dh=w/ratio}dw*=state.zoom;dh*=state.zoom;let dx=(w-dw)/2,dy=(h-dh)/2;if(q.jitter>.01){dx+=(Math.random()-.5)*q.jitter*3;dy+=(Math.random()-.5)*q.jitter*3}ctx.save();applyColor(ctx);if(state.facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(video,dx,dy,dw,dh);ctx.restore();ctx.filter='none';if(q.chromatic>.01){ctx.save();ctx.globalAlpha=Math.min(.12,q.chromatic*.12);ctx.globalCompositeOperation='screen';ctx.drawImage(canvas,Math.max(1,q.chromatic*2),0,w,h);ctx.restore()}if(q.purple>.01){ctx.save();ctx.globalAlpha=Math.min(.08,q.purple*.08);ctx.fillStyle='#9d65d7';ctx.fillRect(0,0,w,h);ctx.restore()}if(q.smear>.01){ctx.save();ctx.globalAlpha=Math.min(.07,q.smear*.07);ctx.drawImage(canvas,0,Math.max(1,q.smear*2),w,h);ctx.restore()}if(q.bloom>.01){ctx.save();ctx.globalAlpha=Math.min(.09,q.bloom*.09);ctx.globalCompositeOperation='screen';ctx.filter=`blur(${1+q.bloom*3}px) brightness(1.15)`;ctx.drawImage(canvas,0,0,w,h);ctx.restore()}if(q.noise>.01){ctx.save();ctx.globalAlpha=Math.min(.08,q.noise*.035);for(let i=0,n=Math.round(w*h/5000);i<n;i++){ctx.fillStyle=Math.random()>.5?'#fff':'#000';ctx.fillRect(Math.random()*w,Math.random()*h,1,1)}ctx.restore()}if(q.scan>.01){ctx.save();ctx.globalAlpha=Math.min(.1,q.scan*.04);ctx.fillStyle='#000';for(let y=0;y<h;y+=4)ctx.fillRect(0,y,w,1);ctx.restore()}if(q.vignette>.01){const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.24,w/2,h/2,Math.max(w,h)*.72);g.addColorStop(0,'#0000');g.addColorStop(1,`rgba(0,0,0,${Math.min(.32,q.vignette*.14)})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}drawWatermark(!!state.recording&&state.recording.state==='recording');if(!state.watermark||!state.waterRec){ctx.save();ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(10,h*.025)}px ui-monospace,monospace`;ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.textBaseline='bottom';ctx.fillText(state.mode==='photo'?'PHOTO':(state.recording?'● REC':'STBY'),w*.025,h*.96);ctx.restore()}}else{ctx.fillStyle='#b0b5bd';ctx.font='12px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText('NO SIGNAL',w/2,h/2)}ctx.restore()}
function frameLoop(){requestAnimationFrame(frameLoop);state.zoom+=(state.zoomTarget-state.zoom)*.2;$('zoomRead').textContent=state.zoom.toFixed(1)+'×';if(state.powered&&video.readyState>=2){const z=state.zoom;if(z!==1){/* digital zoom uses a centered source crop */}draw()}else draw()}
function updateStatus(){const rec=state.recording&&state.recording.state==='recording';$('stateText').textContent=rec?'RECORDING':state.powered?'READY':'STANDBY';$('led').style.background=rec?'#ff3434':state.powered?'#4ed26c':'#d0a23c';$('led').style.boxShadow=rec?'0 0 7px #f33':'0 0 6px #4ed26c88'}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){$('powerText').textContent='浏览器不支持摄像头，请使用 HTTPS 页面。';return}try{if(state.stream)state.stream.getTracks().forEach(t=>t.stop());state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing,width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=state.stream;await video.play();state.powered=true;$('powercover').style.display='none';resizeOutput();updateStatus();toast('摄像机已开启')}catch(e){$('powerText').textContent='无法开启摄像头：'+(e.name||e)+'。请检查权限后重试。';toast('摄像头启动失败')}}
$('powerBtn').onclick=startCamera;
async function enableAudio(){try{state.audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('不支持音频');state.audioCtx=new AC();const src=state.audioCtx.createMediaStreamSource(state.audioStream);state.audioDest=state.audioCtx.createMediaStreamDestination();src.connect(state.audioDest);toast('麦克风已开启')}catch(e){micToggle.set(false);state.audioDest=null;toast('麦克风不可用，请检查权限')}}

$('micBtn').onclick=()=>{const next=$('micBtn').dataset.on!=='1';$('micBtn').dataset.on=next?'1':'0';$('micBtn').textContent=next?'MIC ON':'MIC OFF';$('micBtn').classList.toggle('active',next);if(next)enableAudio();else disableAudio()};
$('videoMode').onclick=()=>setMode('video');$('photoMode').onclick=()=>setMode('photo');
function setMode(m){if(state.recording&&state.recording.state==='recording')return;state.mode=m;$('videoMode').classList.toggle('active',m==='video');$('photoMode').classList.toggle('active',m==='photo');$('shutter').classList.toggle('photo',m==='photo')}
$('ratioBtn').onclick=()=>{const list=['4:3','16:9','1:1','2.35:1','Original'];state.ratio=list[(list.indexOf(state.ratio)+1)%list.length];syncRatio();resizeOutput()};

$('orientationBtn').onclick=()=>{document.body.classList.toggle('force-landscape');const force=document.body.classList.contains('force-landscape');app.classList.toggle('force-landscape',force);toast(force?'已启用横向控制布局':'已恢复自动布局')};
$('menuBtn').onclick=()=>app.classList.toggle('menu');
$('closeMenu').onclick=()=>app.classList.remove('menu');
function triggerFlash(){const f=$('flash');f.classList.remove('fire');void f.offsetWidth;f.classList.add('fire')}
function recording(){return state.recording&&state.recording.state==='recording'}
$('shutter').onclick=()=>{if(!state.powered){toast('请先开启摄像头');return}if(state.mode==='photo'){triggerFlash();draw();canvas.toBlob(blob=>{if(blob)addItem('photo',blob);else toast('照片生成失败')},'image/jpeg',.94);toast('已拍摄照片');return}if(recording()){state.recording.stop();return}if(!window.MediaRecorder){toast('浏览器不支持录像');return}try{const stream=canvas.captureStream(30);if(state.audioDest)state.audioDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';state.chunks=[];state.recording=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);state.recording.ondataavailable=e=>{if(e.data&&e.data.size)state.chunks.push(e.data)};state.recording.onstop=()=>{const blob=new Blob(state.chunks,{type:state.recording.mimeType||'video/webm'});addItem('video',blob);$('shutter').classList.remove('recording');updateStatus();toast('录像已加入图库')};state.recording.start(250);$('shutter').classList.add('recording');updateStatus();toast('开始录像，再按一次停止')}catch(e){toast('无法开始录像：'+e.message)}};
function addItem(kind,blob){const url=URL.createObjectURL(blob);state.items.unshift({kind,blob,url,date:new Date()});state.shotNo++;$('galleryBtn').textContent='GALLERY '+state.items.length;renderGallery()}
function renderGallery(){const list=$('galleryList');list.innerHTML='';$('gallerySub').textContent=`${state.items.length} 个片段 · 照片与录像`;if(!state.items.length){const d=document.createElement('div');d.className='empty';d.textContent='▣  NO TAPE YET\n关闭图库并按下快门，记录你的第一段回忆。';list.append(d);return}state.items.forEach((item,i)=>{const card=document.createElement('article');card.className='item';const prev=document.createElement('div');prev.className='preview';const media=document.createElement(item.kind==='photo'?'img':'video');media.src=item.url;if(item.kind==='video'){media.controls=true;media.playsInline=true}prev.append(media);const meta=document.createElement('div');meta.className='meta';const a=document.createElement('span');a.textContent=item.kind==='photo'?'▧ PHOTO':'▶ VIDEO';const b=document.createElement('span');b.textContent=item.date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(a,b);const save=document.createElement('button');save.className='btn save';save.textContent=item.kind==='photo'?'⬇ 保存照片 / 分享':'⬇ 保存视频 / 分享';save.onclick=()=>saveItem(item);const del=document.createElement('button');del.className='btn danger';del.textContent='删除';del.onclick=()=>{if(!confirm('确定删除这段影像？'))return;URL.revokeObjectURL(item.url);state.items.splice(i,1);$('galleryBtn').textContent='GALLERY '+state.items.length;renderGallery()};card.append(prev,meta,save,del);list.append(card)})}
async function saveItem(item){const ext=item.kind==='photo'?'jpg':item.blob.type.includes('mp4')?'mp4':'webm';const file=new File([item.blob],`DV_${Date.now()}.${ext}`,{type:item.blob.type||'application/octet-stream'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast('已打开系统分享菜单');return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=item.url;a.download=file.name;document.body.append(a);a.click();a.remove();toast('已触发下载；iPhone 可用分享菜单存入照片')}
$('galleryBtn').onclick=()=>{$('gallery').classList.add('open');renderGallery()};
$('closeGallery').onclick=()=>$('gallery').classList.remove('open');

// Keep the preview's source geometry separate from the canvas geometry, preventing accidental squash/stretch.
let lastWidth=canvas.width,lastHeight=canvas.height;function geometryGuard(){const r=targetRatio();if(state.ratio!=='Original'){const h=state.resolution,w=Math.round(h*r);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}if(canvas.width!==lastWidth||canvas.height!==lastHeight){lastWidth=canvas.width;lastHeight=canvas.height}}
function renderTick(){requestAnimationFrame(renderTick);state.zoom+=(state.zoomTarget-state.zoom)*.15;$('zoomRead').textContent=state.zoom.toFixed(1)+'×';draw()}
// Replace the default drawing path with the zoom-aware path and make the legacy controls always sync.
function syncRatio(){ $('ratioBtn').textContent=state.ratio==='Original'?'原始':state.ratio }

resizeOutput();syncRatio();syncResolution();applySkin();updateStatus();renderTick();

})();
