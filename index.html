<style>

body{color-scheme:light;--page:#e9ecf0;--camc:#f5f6f8;--camb:0 solid transparent;--camr:0;--deck:#fff;--deckb:#dfe3e8;--ink:#1f2328;--mut:#6b7280;--btn:#fff;--btnb:#cdd3dc;--btnk:#1f2328;--btnts:none;--btnsh:none;--act:#374151;--actb:#374151;--actk:#fff;--actts:none;--actsh:none;--lcdb:#e3e7ec;--lcdw:3px;--lcdsh:0 1px 3px rgba(0,0,0,.18);--menu:#fff;--menub:#dfe3e8;--menuink:var(--ink);--menumut:var(--mut);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;--rad:8px;--crad:12px;--bbw:1px;--ls:.02em;--acc:#374151;--shr:#cfd5dd;--shbg:#fff;--shi:#e5484d;--shp:#4b5563;--stitch:none}

body.skin-metal{--brush:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 4px);--page:#6f747b;--camc:var(--brush),linear-gradient(#d6d9dd,#aaaeb4);--deck:var(--brush),linear-gradient(#e4e6e9,#c5c8cd);--deckb:#7d8188;--ink:#1e2126;--mut:#555a63;--btn:linear-gradient(#64666a,#2e2f32 50%,#19191b 51%,#323336);--btnb:#09090a;--btnk:#f2f2f2;--btnts:0 -1px #000;--btnsh:0 1px 0 rgba(255,255,255,.5),inset 0 1px 0 rgba(255,255,255,.25);--menu:var(--brush),#e8eaed;--menub:#7d8188;--shr:#8f9298;--shbg:#2a2b2d}
body.skin-paper{--font:'Marker Felt','Noteworthy','Chalkboard SE','Comic Sans MS','Segoe Print','PingFang SC','Microsoft YaHei',cursive;--page:#d8c97a;--camc:linear-gradient(90deg,transparent 30px,rgba(214,70,60,.5) 30px 32px,transparent 32px),repeating-linear-gradient(transparent 0 23px,rgba(100,150,200,.35) 23px 24px),#f8f0a8;--deck:linear-gradient(#fdf8c8,#f1e691);--deckb:#b2a24a;--ink:#3a3320;--mut:#7a6f45;--btn:linear-gradient(#fffce4,#efe5a6);--btnb:#a89a45;--btnk:#4a3a10;--btnsh:0 1px 1px rgba(0,0,0,.2);--act:linear-gradient(#ffe587,#f2c230);--actb:#a07b0a;--actk:#3a2a00;--actts:none;--lcdb:#6b4b2b;--menu:repeating-linear-gradient(transparent 0 23px,rgba(100,150,200,.3) 23px 24px),#fcf6bd;--menub:#b2a24a;--shr:#b2a24a;--shbg:#fdf8c8}
body.skin-retro{color-scheme:light;--page:linear-gradient(#bfe6ff,#eaf7ff 45%,#f4fff0);--camc:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.95),rgba(255,255,255,0) 55%),linear-gradient(#f7fcff,#e3f2fc);--camb:1px solid #9fcbea;--camr:16px;--deck:linear-gradient(rgba(255,255,255,.95),rgba(232,245,255,.95));--deckb:#a9d2ee;--ink:#21425e;--mut:#5f7f98;--btn:linear-gradient(#fff,#eef7ff 48%,#d6ecff 52%,#eef8ff);--btnb:#8cbde6;--btnk:#1f4b73;--btnts:0 1px #fff;--btnsh:0 1px 2px rgba(60,120,180,.25),inset 0 1px 0 #fff;--act:linear-gradient(#f2ffd0,#c6f063 48%,#a2dc2a 52%,#cdf57a);--actb:#7fb51a;--actk:#2d4a00;--actts:0 1px rgba(255,255,255,.7);--actsh:0 0 6px rgba(160,220,40,.5),inset 0 1px 0 rgba(255,255,255,.8);--lcdb:#fff;--lcdw:5px;--lcdsh:0 0 0 1px #8cbde6,0 3px 10px rgba(60,120,180,.3);--menu:linear-gradient(#fbfeff,#eef7fd);--menub:#a9d2ee;--font:'Trebuchet MS',Verdana,'Lucida Grande','PingFang SC','Microsoft YaHei',sans-serif;--rad:14px;--crad:14px;--bbw:1px;--ls:.02em;--acc:#3ba0e6;--shr:#8cbde6;--shbg:linear-gradient(#fff,#d9eeff);--shi:radial-gradient(circle at 40% 30%,#ffd0d0,#ff5a5a 50%,#d42020);--shp:radial-gradient(circle at 40% 30%,#e6fbff,#5cc8f0 55%,#1e8fc6)}
body.skin-dark{color-scheme:dark;--page:radial-gradient(ellipse at 50% 0%,#2a3442,#0b0d11 70%);--camc:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,0) 40%),linear-gradient(#1c2027,#0f1115);--camb:1px solid #000;--camr:10px;--deck:linear-gradient(#2a2e36,#16181d 50%,#0f1114 51%,#1a1d22);--deckb:#000;--ink:#e3e9f2;--mut:#8f9aab;--btn:linear-gradient(#5a5f69,#2c3037 49%,#15171b 51%,#262a31);--btnb:#000;--btnk:#e8eef7;--btnts:0 -1px #000;--btnsh:inset 0 1px 0 rgba(255,255,255,.18),0 1px 0 rgba(255,255,255,.06);--act:linear-gradient(#8fd8ff,#2f97e6 49%,#156cc2 51%,#3ea6f2);--actb:#0a3a6a;--actk:#fff;--actts:0 -1px rgba(0,0,0,.4);--actsh:0 0 8px rgba(70,170,255,.6),inset 0 1px 0 rgba(255,255,255,.4);--lcdb:#050607;--lcdw:5px;--lcdsh:0 0 0 1px #3a404a,0 1px 0 rgba(255,255,255,.08),inset 0 0 16px #000;--menu:linear-gradient(#1d2128,#121418);--menub:#000;--font:'Segoe UI',Tahoma,Verdana,'PingFang SC','Microsoft YaHei',sans-serif;--rad:6px;--crad:8px;--bbw:1px;--ls:.02em;--acc:#3ea6f2;--shr:#3a404a;--shbg:linear-gradient(#2a2e36,#0f1114);--shi:radial-gradient(circle at 40% 30%,#ff9a8a,#e0301c 55%,#7a1008);--shp:radial-gradient(circle at 40% 30%,#d8f2ff,#3ea6f2 55%,#0d4f8c)}
body.skin-ccd{color-scheme:light;--brs:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,rgba(0,0,0,.04) 1px 2px,transparent 2px 3px);--page:#8d939b;--camc:var(--brs),linear-gradient(#e9ecef,#c3c8ce 55%,#d6dade);--deck:var(--brs),linear-gradient(#dfe3e7,#b9bec5);--deckb:#8a9098;--ink:#262b31;--mut:#5a626c;--btn:linear-gradient(#f5f6f8,#d3d7dc);--btnb:#7a8189;--btnk:#2e343b;--btnts:0 1px rgba(255,255,255,.7);--btnsh:0 2px 0 #646a72,0 3px 5px rgba(0,0,0,.3),inset 0 1px 0 #fff;--act:radial-gradient(circle at 9px 50%,#8dff6a 0 2.5px,rgba(141,255,106,.45) 3.5px,transparent 5.5px),linear-gradient(#c4c9cf,#e4e7ea);--actb:#6a7078;--actk:#1d2228;--actts:0 1px rgba(255,255,255,.6);--actsh:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.6);--lcdb:#14171b;--lcdw:7px;--lcdsh:0 0 0 1px #6c727a,0 1px 0 rgba(255,255,255,.6),inset 0 0 14px #000;--menu:var(--brs),linear-gradient(#eef0f2,#d3d7dc);--menub:#8a9098;--font:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;--rad:7px;--crad:10px;--bbw:1px;--ls:.04em;--acc:#5a6470;--shr:#8a9098;--shbg:linear-gradient(#f4f5f7,#aab0b8);--shi:radial-gradient(circle at 40% 30%,#ff8a7a,#d8281a 55%,#8f1006);--shp:radial-gradient(circle at 40% 30%,#fff,#d0d5db 45%,#8d949c)}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.side{display:contents}
.tbar{order:0}.top{order:1}.lcd{order:2}#fstrip{order:3}.deck{order:4}#menu{order:5}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.tb{display:flex;gap:5px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:var(--crad);border:var(--lcdw) solid var(--lcdb);box-shadow:var(--lcdsh);overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:16px;font-size:12px;line-height:1.6;color:#9a9a92;transition:opacity .07s}
#pw.off{opacity:0;pointer-events:none}
.deck,#menu{outline:var(--stitch);outline-offset:-5px}
.deck{background:var(--deck);border-radius:var(--crad);padding:7px 10px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--deckb)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px;align-items:center}
.btn{background:var(--btn);color:var(--btnk);border:1px solid var(--btnb);border-bottom-width:var(--bbw);border-radius:var(--rad);padding:6px 9px;font:inherit;font-size:11px;letter-spacing:var(--ls);text-shadow:var(--btnts);box-shadow:var(--btnsh);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .08s}
.btn.act{background:var(--act);color:var(--actk);border-color:var(--actb);text-shadow:var(--actts);box-shadow:var(--actsh)}
.btn:active{transform:translateY(1px) scale(.97)}
body.skin-ccd .btn{text-transform:uppercase;font-weight:600;margin-bottom:2px}
body.skin-ccd .btn.act{padding-left:16px;transform:translateY(2px)}
body.skin-ccd .btn:active{transform:translateY(2px);box-shadow:0 0 0 #646a72,0 1px 2px rgba(0,0,0,.3),inset 0 1px 0 #fff}
body.skin-ccd .zb{border-radius:50%;width:40px;height:40px;font-size:18px;padding:0}
.zb{width:46px;font-size:16px;padding:4px 0;touch-action:none}
.zr{min-width:48px;text-align:center;font-size:12px}
.evr{display:flex;align-items:center;gap:8px;font-size:11px}
.evr .btn{padding:4px 8px}
.evr input{flex:1;min-width:0;accent-color:var(--acc);margin:0}
.evr i{width:34px;text-align:right;font-style:normal;color:var(--mut)}
.shut{width:58px;height:58px;border-radius:50%;border:4px solid var(--shr);background:var(--shbg);position:relative;cursor:pointer;padding:0;flex:none;transition:transform .1s}
.shut:active{transform:scale(.92)}
.shut::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--shi);transition:.15s}
.shut.photo::after{background:var(--shp)}
.shut.rec::after{inset:16px;border-radius:5px;background:var(--shi)}
.shut.rec{animation:pulse 1.2s infinite}
.shut.snap{animation:snap .18s}
body.skin-ccd .shut{box-shadow:0 3px 0 #646a72,0 4px 6px rgba(0,0,0,.3)}
body:not(.mob) #ori,body.natl #ori{display:none}
#fstrip{display:none;flex:none;gap:8px;overflow-x:auto;padding:4px 2px}
.cam.fpick #fstrip{display:flex;animation:up .22s ease}
.tile{flex:none;width:62px;border:0;padding:0;background:none;cursor:pointer;text-align:center;color:var(--ink);font:inherit;font-size:10px;transition:transform .15s}
.tile .sw{display:block;width:62px;height:62px;border-radius:10px;border:2px solid var(--btnb);box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tile.sel{transform:scale(1.07)}
.tile.sel .sw{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile .nm{display:block;margin-top:3px;white-space:nowrap}
.tile .fcl{display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--btn);color:var(--btnk)}
#menu{display:none;flex:none;height:42%;overflow-y:auto;background:var(--menu);color:var(--menuink);border:1px solid var(--menub);border-radius:var(--crad);padding:10px 12px 14px;box-sizing:border-box}
.cam.menu #menu{display:block;animation:up .22s ease}
.cam.menu .deck{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding-bottom:3px}
.tabs .btn{flex:none}
body.skin-xp .tabs .btn,body.skin-w7 .tabs .btn{border-radius:3px 3px 0 0}
body.skin-xp .tabs .btn.act{background:#fcfcfe;border-top:3px solid #ffc83c;box-shadow:none}
body.skin-w7 .tabs .btn.act{background:linear-gradient(#fff,#eaf3fc);border-top:2px solid #3a8dde}
.pane{display:none}.pane.on{display:block;animation:fade .18s}
.gh{font-size:11px;color:var(--menumut);margin:12px 0 5px;letter-spacing:.1em}

<script>
const $=s=>document.querySelector(s);
const cam=$('.cam');
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t;uniform vec2 r,cr;
uniform float T,m,z,fb,F,rot,pf,ca,bl,bd,bm,nz,sn,vg,jt,sat,wb,sh,ex,fx,fp,lf;
varying vec2 u;
vec2 PX;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p=(p-.5)*cr/z+.5;if(fp>.5)p=1.-p;p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(p.y,1.-p.x);else if(rot>.5)p=vec2(1.-p.y,p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb*ex;}
vec3 Sb(vec2 p){vec2 o=PX*.35;return (S(p+o)+S(p+vec2(-o.x,o.y))+S(p+vec2(o.x,-o.y))+S(p-o))*.25;}
float Yf(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec2 sc=u;float L=floor(sc.y*240.);float f=floor(T*30.);
 PX=1./r;
 float jit=h(vec2(L,f))-.5;
 vec2 uv=sc;
 uv.x+=jit*.0025*jt+sin(sc.y*8.+T*1.5)*.0006*jt;
 vec2 c=sc-.5;float asp=r.x/r.y;
 vec2 c2=c*(.008+dot(c,c)*.04)*ca+vec2(.0012*ca,0.);
 vec3 col=vec3(Sb(uv+c2).r,Sb(uv).g,Sb(uv-c2*1.3).b);
 float rr=bl*.003+fb;
 if(rr>.0002){vec3 bk=(col+S(uv+vec2(rr,0.))+S(uv-vec2(rr,0.))+S(uv+vec2(0.,rr*asp))+S(uv-vec2(0.,rr*asp)))*.2;col=mix(col,bk,clamp(rr*400.,0.,.9));}
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,clamp(.8*bd,0.,1.));
 float Y0=Yf(col);
 col=Y0+(cm-Yf(cm))*1.15;
 float yl=Yf(Sb(uv-vec2(PX.x,0.))),yr=Yf(Sb(uv+vec2(PX.x,0.)));
 float yu=Yf(Sb(uv-vec2(0.,PX.y))),yd=Yf(Sb(uv+vec2(0.,PX.y)));
 col+=((Y0*2.-yl-yr)*.4+(Y0*2.-yu-yd)*.2)*sh;
 float ya=Yf(S(uv+vec2(.005,0.))),yb=Yf(S(uv-vec2(.005,0.)));
 float pu=smoothstep(.04,.3,abs(ya-yb))*(.35+.65*smoothstep(.4,.9,max(ya,yb)));
 col+=vec3(.55,.05,1.)*pu*.7*pf;col.g-=pu*.12*pf;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*asp);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*bm*vec3(.85,.92,1.);
 col=(col-.5)*1.1+.5;col=mix(vec3(Yf(col)),col,1.1*sat);
 col+=vec3(.005,.01,.04)*(1.-clamp(Yf(col),0.,1.));
 col*=vec3(.96,.98,1.06);
 col=max(col,vec3(.04));
 float Y=Yf(col);float nk=1.;
 if(F==1.){col=mix(vec3(Y),col,.75)*vec3(1.05,.96,1.1);nk=1.6;}
 else if(F==2.){col=vec3(.25,1.,.3)*min(Y*2.2,1.3);nk=2.4;}
 else if(F==3.){col=vec3(Y)*1.12+.02;nk=1.3;}
 else if(F==4.){col=vec3(Y)*vec3(1.25,1.,.72)*1.05+(col-Y)*.35;}
 else if(F==5.){col=mix(col,mix(vec3(0.,.3,.4),vec3(1.,.4,.8),smoothstep(.1,.9,Y)),.65);}
 else if(F==6.){col=mix(vec3(Y),col,.72);col=(col-.5)*.85+.55;col*=vec3(1.04,1.,.93);col+=vec3(0.,.02,.04)*(1.-Y);nk=1.4;}
 else if(F==7.){col=vec3(Y)*vec3(.55,.85,1.25)+vec3(0.,.02,.06);nk=1.2;}
 else if(F==8.){float px=mod(gl_FragCoord.x,3.);vec3 mk=vec3(px<1.?1.:.55,(px>=1.&&px<2.)?1.:.55,px>=2.?1.:.55);col*=mk*1.25;col*=1.-.2*(.5+.5*sin(sc.y*r.y*3.1416));nk=.8;}
 else if(F==9.){float q=clamp(Y*1.15,0.,1.);vec3 c1=vec3(.02,0.,.25),c2=vec3(.55,0.,.55),c3=vec3(.95,.25,.1),c4=vec3(1.,.9,.2);
  col=q<.25?mix(c1,c2,q*4.):q<.5?mix(c2,c3,(q-.25)*4.):q<.75?mix(c3,c4,(q-.5)*4.):mix(c4,vec3(1.),(q-.75)*4.);nk=.7;}
 else if(F==10.){col=floor(col*5.+.5)/5.*vec3(1.05,1.,1.1);nk=.3;}
 else if(F==11.){col=1.-col;}
 else if(F==12.){col*=mix(vec3(.75,1.,1.15),vec3(1.2,.95,.75),smoothstep(.3,.75,Y));}
 else if(F==13.){col+=b*.35*bm;col=mix(vec3(Yf(col)),col,1.2)*vec3(1.06,.98,1.1);col=col*.9+.1;nk=.6;}
 if(fx>.5){float ff=1.4-1.7*dot(c,c);col=col*(1.+ff*.8);col=(col-.5)*1.25+.5;col=mix(col,vec3(1.),clamp(ff*.12,0.,.25));}
 if(lf>.5){float fl=max(1.-1.6*dot(c,c),0.);col=col*(1.+fl*.55)+vec3(.03,.03,.04)*fl;}
 col*=vec3(1.+wb*.14,1.+wb*.03,1.-wb*.18);
 col*=1.-.05*sn*(.5+.5*sin(sc.y*240.*6.2832));
 col*=1.-.02*sn*mod(f,2.);
 float n=h(sc*r+T)-.5;col+=n*.22*nz*nk*(1.-Yf(col)*.5);
 col+=(vec3(h(sc*r*.5+T+1.),h(sc*r*.5+T+2.),h(sc*r*.5+T+3.))-.5)*.08*nz*nk;
 col*=max(1.-dot(c,c)*1.1*vg,0.);
 gl_FragColor=vec4(col,1.);}`;
function mk(ty,s){const o2=gl.createShader(ty);gl.shaderSource(o2,s);gl.compileShader(o2);return o2}
const pg=gl.createProgram();
gl.attachShader(pg,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);

const UL={};['r','cr','T','m','z','fb','F','rot','pf','ca','bl','bd','bm','nz','sn','vg','jt','sat','wb','sh','ex','fx','fp','lf'].forEach(n=>UL[n]=gl.getUniformLocation(pg,n));

/* settings */
const D={wb:-.1,sh:.6,pf:.45,ca:.4,bl:0,bd:.45,bm:.35,nz:.4,sn:.3,vg:.4,jt:.3,sat:1};
const DS={mic:false,gain:1,ns:true,agc:true,ec:false,lofi:false,abr:1,skin:'light',stretch:false,car:1.78,flip:false,flash:false,light:false,lo:1,lflip:false};
const DW={color:'#f4f4ee',font:0,size:1,fr:.45,gl:.5,txt:''};
const DWI={rec:true,flt:true,bat:true,date:true,time:true,tc:true,zm:true};
let P={...D},S={...DS},WM={...DW,items:{...DWI}};

const AC=window.AudioContext||window.webkitAudioContext;
let ac,astream,aDst,aHP,aLP,aGain,aAn,aSrc,pS;
const lvBuf=new Uint8Array(512);
const wantMic=()=>S.mic&&mode==='video'&&!galOpen();
function nodes(){if(!aGain)return;aGain.gain.value=S.gain;aHP.frequency.value=S.lofi?250:20;aLP.frequency.value=S.lofi?4800:20000}
function stopMic(){if(astream)astream.getTracks().forEach(t=>t.stop());astream=aDst=aSrc=aAn=aGain=null}
function updMic(){
  const b=$('#mic');b.textContent=S.mic?'MIC ON':'MIC OFF';b.classList.toggle('act',S.mic);
  b.style.display=mode==='video'?'':'none';
  const f=$('#fls');f.textContent=mode==='photo'?'FLASH':'LIGHT';f.classList.toggle('act',mode==='photo'?S.flash:S.light);
}
async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,autoGainControl:S.agc}});
    if(!wantMic()){s.getTracks().forEach(t=>t.stop());return}
    astream=s;await ac.resume();
    aSrc=ac.createMediaStreamSource(s);
    aHP=ac.createBiquadFilter();aHP.type='highpass';aLP=ac.createBiquadFilter();aLP.type='lowpass';
    aGain=ac.createGain();aAn=ac.createAnalyser();aAn.fftSize=512;aDst=ac.createMediaStreamDestination();
    aSrc.connect(aHP);aHP.connect(aLP);aLP.connect(aGain);aGain.connect(aDst);aGain.connect(aAn);nodes();
  }catch(e){S.mic=false;save();updMic();pS&&pS.sy.forEach(f=>f());alert('无法使用麦克风：'+(e.name||e))}
}
function applyMic(){stopMic();if(wantMic()){if(!ac&&AC)ac=new AC();if(ac&&ac.resume)ac.resume();startMic()}updMic()}

/* camera + lenses */
const mmOf=l=>{l=(l||'').toLowerCase();return /ultra|0\.5|超广角/.test(l)?13:/tele|长焦/.test(l)?77:/front|前置|user/.test(l)?23:24};
async function refreshLenses(){
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const cnt={},seen={};
    lenses=ds.map(d=>{const l=(d.label||'').toLowerCase();const n=/ultra/.test(l)?'超广角':/tele/.test(l)?'长焦':/front|前置/.test(l)?'前置':'广角';cnt[n]=(cnt[n]||0)+1;return{id:d.deviceId,label:d.label,n}});
    lenses.forEach(x=>{seen[x.n]=(seen[x.n]||0)+1;x.nm=cnt[x.n]>1?x.n+seen[x.n]:x.n});
    lensBox.innerHTML='';
    if(!lenses.length){lensBox.textContent='开机后显示可用镜头';return}
    const cur2=track&&track.getSettings?track.getSettings().deviceId:null;
    lenses.forEach(x=>{const b=document.createElement('button');b.className='btn'+(x.id===cur2?' act':'');b.textContent=x.nm;
      b.onclick=()=>{if(recing())return;lensId=x.id;facing=x.n==='前置'?'user':'environment';autoWide=false;start()};lensBox.append(b)});
  }catch(e){}
}
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pwMsg('此环境不支持摄像头，请用 Chrome / Edge / Safari 打开 https 链接。');return}
  const base={width:{ideal:1280},height:{ideal:720}};
  const tries=[lensId?{...base,deviceId:{exact:lensId}}:{...base,facingMode:facing},{...base,facingMode:facing},{}];
  stream=null;let err;
  for(const v of tries){try{stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});break}catch(e){err=e}}
  if(!stream){pwMsg('无法使用摄像头：'+(err&&err.name)+'。请检查浏览器权限。');return}
  track=stream.getVideoTracks()[0];
  vid.srcObject=stream;await vid.play();on=true;$('#pw').classList.add('off');
  out.classList.remove('boot');void out.offsetWidth;out.classList.add('boot');
  curMM=mmOf(track.label);
  try{hasTorch=!!(track.getCapabilities&&track.getCapabilities().torch)}catch(e){hasTorch=false}
  applyLight();
  await refreshLenses();
  if(autoWide){autoWide=false;
    const wide=lenses.find(x=>x.n==='广角'&&!/dual|triple|三/i.test(x.label));
    const cur2=track.getSettings?track.getSettings().deviceId:null;
    if(wide&&facing==='environment'&&cur2&&cur2!==wide.id){lensId=wide.id;start()}}
}
function pwMsg(s){$('#pw').classList.remove('off');$('#pw').firstElementChild.textContent=s}

  const N=RES[si];let w,h;

function loop(ts){

    aAn.getByteTimeDomainData(lvBuf);let pk=0;for(let i=0;i<lvBuf.length;i++)pk=Math.max(pk,Math.abs(lvBuf[i]-128));

  const dt=Math.min(.1,(ts-last)/1000);last=ts;const T=ts/1000;
  if(zdir){zt=Math.min(6,Math.max(1,zt*Math.exp(zdir*dt*.85)));zT=performance.now()}
  const lz=Math.log(zc),lt=Math.log(zt);
  zc=Math.exp(lz+(lt-lz)*(1-Math.exp(-dt*7)));if(Math.abs(zc-zt)<.002)zc=zt;

    out.toBlob(b=>{if(b)addItem('img',b);

}
function loc(e){
  const r=ec.getBoundingClientRect(),b=document.body.classList;let x,y;
  if(b.contains('rotr')){x=(e.clientY-r.top)/r.height;y=(r.right-e.clientX)/r.width}
  else if(b.contains('rotl')){x=(r.bottom-e.clientY)/r.height;y=(e.clientX-r.left)/r.width}
  else{x=(e.clientX-r.left)/r.width;y=(e.clientY-r.top)/r.height}
  return {x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))};
}
function edRender(sel=true){
  ec2.clearRect(0,0,E.cw,E.ch);ec2.drawImage(E.img,0,0,E.cw,E.ch);ec2.drawImage(E.layer,0,0);
  E.stk.forEach((s,i)=>{drawStk(ec2,s);if(sel&&i===E.sel)selBox(s)});
}
function strokeSeg(c,st,i){
  c.save();c.lineCap=c.lineJoin='round';c.lineWidth=st.w*E.cw/400;
  c.globalCompositeOperation=st.er?'destination-out':'source-over';c.strokeStyle=c.fillStyle=st.col;
  const b=st.pts[i],a=st.pts[i-1]||b;
  c.beginPath();c.moveTo(a.x*E.cw,a.y*E.ch);c.lineTo(b.x*E.cw,b.y*E.ch);c.stroke();
  if(st.pts.length===1){c.beginPath();c.arc(b.x*E.cw,b.y*E.ch,c.lineWidth/2,0,7);c.fill()}
  c.restore();
}
function rebuild(){const c=E.layer.getContext('2d');c.clearRect(0,0,E.cw,E.ch);E.strokes.forEach(st=>st.pts.forEach((_,i)=>strokeSeg(c,st,i)))}
function stkUI(){const s=E.stk[E.sel];$('#sc').style.display=s?'':'none';if(s){$('#ss').value=s.s;$('#sr').value=s.r;$('#sb').value=s.b;$('#sxw').value=s.sx||1;$('#syh').value=s.sy||1}}
function setTool(t){
  E.tool=t;if(t!=='stk'){E.sel=-1;stkUI();edRender()}
  [...$('#etabs').children].forEach(b=>b.classList.toggle('act',b.dataset.t===t));
  $('#pp').style.display=t==='stk'?'none':'';$('#pk').style.display=t==='stk'?'':'none';
  $('#sws').style.display=t==='pen'?'':'none';
}
function openEd(it){
  const im=new Image();
  im.onload=()=>{
    const s=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight));
    E.img=im;E.cw=ec.width=E.layer.width=Math.round(im.naturalWidth*s);E.ch=ec.height=E.layer.height=Math.round(im.naturalHeight*s);
    E.strokes=[];E.stk=[];E.hist=[];E.sel=-1;E.cur=null;E.drag=null;
    gal.classList.remove('view');gal.classList.add('edit');setTool('pen');edRender();
  };
  im.src=it.url;
}
function addStk(o2){E.stk.push({...o2,x:.5,y:.5,s:1,r:0,b:1,sx:1,sy:1});E.sel=E.stk.length-1;E.hist.push('k');stkUI();edRender()}
ECOL.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===E.col?'sel':'';
  b.onclick=()=>{E.col=c;[...$('#sws').children].forEach(x=>x.classList.toggle('sel',x===b))};$('#sws').append(b)});
SPRN.forEach(id=>{const b=document.createElement('button');b.className='btn';const im=document.createElement('img');im.src=mkBM(id).c.toDataURL();b.append(im);
  b.onclick=()=>addStk({k:'s',id});$('#stks').append(b)});
TXT.forEach(t=>{const b=document.createElement('button');b.className='btn tg';b.textContent=t;b.onclick=()=>addStk({k:'t',t});$('#stks').append(b)});
$('#etabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTool(b.dataset.t)};
$('#es').oninput=e=>{E.sz=+e.target.value;$('#esn').textContent=E.sz};
$('#ss').oninput=e=>{const s=E.stk[E.sel];if(s){s.s=+e.target.value;edRender()}};
$('#sr').oninput=e=>{const s=E.stk[E.sel];if(s){s.r=+e.target.value;edRender()}};
$('#sb').oninput=e=>{const s=E.stk[E.sel];if(s){s.b=+e.target.value;edRender()}};
$('#sxw').oninput=e=>{const s=E.stk[E.sel];if(s){s.sx=+e.target.value;edRender()}};
$('#syh').oninput=e=>{const s=E.stk[E.sel];if(s){s.sy=+e.target.value;edRender()}};
$('#sxr').onclick=()=>{const s=E.stk[E.sel];if(s){s.sx=1;s.sy=1;stkUI();edRender()}};
$('#sd').onclick=()=>{if(E.sel<0)return;E.stk.splice(E.sel,1);E.sel=-1;stkUI();edRender()};
ec.addEventListener('pointerdown',e=>{
  e.preventDefault();try{ec.setPointerCapture(e.pointerId)}catch(_){}
  const p=loc(e);
  if(E.tool==='stk'){const i=hitStk(p);E.sel=i;if(i>=0)E.drag={i,ox:p.x-E.stk[i].x,oy:p.y-E.stk[i].y};stkUI();edRender();return}
  E.cur={col:E.col,w:E.sz,er:E.tool==='er',pts:[p]};strokeSeg(E.layer.getContext('2d'),E.cur,0);edRender();
});
ec.addEventListener('pointermove',e=>{
  const p=loc(e);
  if(E.drag){const s=E.stk[E.drag.i];s.x=p.x-E.drag.ox;s.y=p.y-E.drag.oy;edRender()}
  else if(E.cur){E.cur.pts.push(p);strokeSeg(E.layer.getContext('2d'),E.cur,E.cur.pts.length-1);edRender()}
});
['pointerup','pointercancel'].forEach(n=>ec.addEventListener(n,()=>{if(E.cur){E.strokes.push(E.cur);E.hist.push('s');E.cur=null}E.drag=null}));
$('#eu').onclick=()=>{const h=E.hist.pop();if(h==='s'){E.strokes.pop();rebuild()}else if(h==='k'){E.stk.pop();E.sel=-1;stkUI()}edRender()};
$('#ecl').onclick=()=>{E.strokes=[];E.stk=[];E.hist=[];E.sel=-1;rebuild();stkUI();edRender()};
$('#eca').onclick=()=>{gal.classList.remove('edit');gal.classList.add('view')};
$('#eok').onclick=()=>{E.sel=-1;edRender(false);
  ec.toBlob(b=>{if(!b)return;addItem('img',b);setGf(0);gi=0;gal.classList.remove('edit');gal.classList.add('view');showView()},'image/jpeg',.92)};
$('#ve').onclick=()=>{const it=cur();if(it&&it.k==='img')openEd(it)};
</script>
</body></html>
