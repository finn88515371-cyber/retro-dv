html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.side{display:contents}
.tbar{order:0}.top{order:1}.lcd{order:2}#fstrip{order:3}.deck{order:4}#menu{order:5}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.tb{display:flex;gap:5px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:var(--crad);border:var(--lcdw) solid var(--lcdb);box-shadow:var(--lcdsh);overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#grid{position:absolute;pointer-events:none;display:none;--gl:rgba(255,255,255,.55);background:linear-gradient(90deg,transparent calc(33.333% - .5px),var(--gl) calc(33.333% - .5px),var(--gl) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.667% - .5px),var(--gl) calc(66.667% - .5px),var(--gl) calc(66.667% + .5px),transparent calc(66.667% + .5px)),linear-gradient(180deg,transparent calc(33.333% - .5px),var(--gl) calc(33.333% - .5px),var(--gl) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.667% - .5px),var(--gl) calc(66.667% - .5px),var(--gl) calc(66.667% + .5px),transparent calc(66.667% + .5px))}
body.grid #grid{display:block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:16px;font-size:12px;line-height:1.6;color:#9a9a92;transition:opacity .07s}

   if(tx){x.beginPath();rrp(x,W-72*u,H-34*u,56*u,17*u,8.5*u);x.fillStyle='#fff';x.fill();x.stroke();fTxt(x,tx,W-44*u,H-22*u,11*u,'VT323,monospace','#ff7a2a','center')}}},
 {n:'胶卷',t:()=>'FILM 24 ▸',d:(x,W,H,u,tx)=>{ring(x,W,H,u,{bg:'#1f1d22',t:15,b:15,l:8,r:8,or:4,ir:3,lw:0});
   x.fillStyle='#f3efe6';for(let X=8*u;X<W-12*u;X+=18*u){x.beginPath();rrp(x,X,4*u,9*u,6*u,1.5*u);rrp(x,X,H-10*u,9*u,6*u,1.5*u);x.fill()}
   if(tx)fTxt(x,tx,W-12*u,H-17*u,10*u,'VT323,monospace','#ffb35c','right');fStar(x,19*u,25*u,6*u,'#ffe14d')}},
 {n:'像素游戏机',t:()=>'▶ PRESS START',d:(x,W,H,u,tx)=>{ring(x,W,H,u,{bg:'#c8c4d8',t:18,b:14,or:0,ir:0,lw:0});

function frText(){const f=FR[E.fr];return f.t?(E.ftx||f.t(E.t)):''}
function frameCanvas(){const key=[E.fr,E.cw,E.ch,frText(),E.fv].join('|');if(E.fkey===key)return E.fc;E.fkey=key;
  const W=Math.max(2,Math.round(E.cw/2)),H=Math.max(2,Math.round(E.ch/2)),c=mkC(W,H);FR[E.fr].d(c.getContext('2d'),W,H,Math.min(W,H)/124,frText());return E.fc=c}
function drawFrame(){if(!E.fr)return;const c=frameCanvas();ec2.save();ec2.imageSmoothingEnabled=true;soft(ec2,(dx,dy)=>ec2.drawImage(c,dx,dy,E.cw,E.ch),E.fb*E.cw/400);ec2.restore()}
function syncFrameUI(){[...$('#frs').children].forEach((b,i)=>b.classList.toggle('act',i===E.fr));const f=FR[E.fr];
  $('#ftw').style.display=f.t?'':'none';if(f.t){$('#ftx').placeholder=f.t(E.t);$('#ftx').value=E.ftx}$('#fbl').value=E.fb;$('#fblv').textContent=E.fb.toFixed(2)}
FR.forEach((f,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=f.n;b.onclick=()=>{E.fr=i;E.ftx='';syncFrameUI();edRender()};$('#frs').append(b)});
$('#fbl').oninput=e=>{E.fb=+e.target.value;$('#fblv').textContent=E.fb.toFixed(2);edRender()};
$('#ftx').oninput=e=>{E.ftx=e.target.value;edRender()};
/* ---------- pixel doodle (16 colours, mosaic soft edge) ---------- */
function gridSize(){E.gs=Math.max(2,Math.round(Math.min(E.cw,E.ch)*E.ps/100));E.gw=Math.ceil(E.cw/E.gs);E.gh=Math.ceil(E.ch/E.gs);E.layer.width=E.gw;E.layer.height=E.gh}
function rasterSeg(st,i){
  const c=E.layer.getContext('2d'),b=st.pts[i],a=st.pts[i-1]||b,x0=a.x*E.gw,y0=a.y*E.gh,x1=b.x*E.gw,y1=b.y*E.gh,n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2)),r=Math.max(st.w/2,.71),R=Math.ceil(r+1);
  for(let k=0;k<=n;k++){const cx=x0+(x1-x0)*k/n,cy=y0+(y1-y0)*k/n;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const gx=Math.floor(cx)+dx,gy=Math.floor(cy)+dy;if(gx<0||gy<0||gx>=E.gw||gy>=E.gh)continue;
      const d=Math.hypot(gx+.5-cx,gy+.5-cy),al=d<=r?1:d<=r+1?.4:0;if(!al)continue;const key=gy*E.gw+gx,old=st.m.get(key)||0;if(al<=old)continue;st.m.set(key,al);
      c.globalAlpha=al;if(st.er){c.globalCompositeOperation='destination-out';c.fillRect(gx,gy,1,1);c.globalCompositeOperation='source-over'}else{c.fillStyle=st.col;c.fillRect(gx,gy,1,1)}}}
  c.globalAlpha=1}
ECOL.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===E.col?'sel':'';
  b.onclick=()=>{E.col=c;[...$('#sws').children].forEach(x=>x.classList.toggle('sel',x===b))};$('#sws').append(b)});

function renderStk(){const box=$('#stks');box.innerHTML='';
  [...$('#scat').children].forEach(b=>b.classList.toggle('act',b.dataset.c===scat));
  if(scat==='t'){TXT.forEach(t=>{const b=document.createElement('button');b.className='btn tg';b.textContent=t;b.onclick=()=>addStk({k:'t',t});box.append(b)});return}
  (scat==='v'?VSTN:SPRN).forEach(id=>{const b=document.createElement('button');b.className='btn';const im=document.createElement('img');
    im.src=(scat==='v'?mkVB(id):mkBM(id)).c.toDataURL();b.append(im);b.onclick=()=>addStk({k:scat,id});box.append(b)});
}

ec.addEventListener('pointerdown',e=>{
  e.preventDefault();try{ec.setPointerCapture(e.pointerId)}catch(_){}
  const p=loc(e);
  if(E.tool==='adj')return;
  if(E.tool==='crop'){cropDown(p);return}
  if(E.tool==='stk'){const i=hitStk(p);E.sel=i;if(i>=0)E.drag={i,ox:p.x-E.stk[i].x,oy:p.y-E.stk[i].y};stkUI();edRender();return}
  E.cur={col:E.col,w:E.sz,er:E.tool==='er',pts:[p],m:new Map()};rasterSeg(E.cur,0);edRender();
});
ec.addEventListener('pointermove',e=>{
  const p=loc(e);
  if(E.cdrag){cropMove(p);edRender();return}
  if(E.drag){const s=E.stk[E.drag.i];s.x=p.x-E.drag.ox;s.y=p.y-E.drag.oy;edRender()}
  else if(E.cur){E.cur.pts.push(p);rasterSeg(E.cur,E.cur.pts.length-1);edRender()}
});
['pointerup','pointercancel'].forEach(n=>ec.addEventListener(n,()=>{if(E.cur){E.strokes.push(E.cur);E.hist.push('s');E.cur=null}E.drag=null;E.cdrag=null}));
$('#eu').onclick=()=>{const h=E.hist.pop();if(h==='s'){E.strokes.pop();rebuild()}else if(h==='k'){E.stk.pop();E.sel=-1;stkUI()}else if(h==='g'){restoreGeo(E.geo.pop())}edRender()};
$('#ecl').onclick=()=>{E.strokes=[];E.stk=[];E.hist=E.hist.filter(h=>h==='g');E.sel=-1;rebuild();stkUI();edRender()};
$('#eca').onclick=()=>{gal.classList.remove('edit');gal.classList.add('view')};
$('#eok').onclick=()=>{E.sel=-1;edRender(false);
  ec.toBlob(b=>{if(!b)return;addItem('img',b);setGf(0);gi=0;gal.classList.remove('edit');gal.classList.add('view');showView()},'image/jpeg',.92)};
