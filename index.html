body.skin-ccdd .cam{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 2px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.18),inset -1px 0 0 rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.7),0 12px 34px rgba(0,0,0,.85)}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.lseg{display:inline-flex;gap:2px}.lseg .btn{flex:1}.btn.dis{opacity:.4}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.side{display:contents}
.tbar{order:0}.top{order:1}.lcd{order:2}#fstrip{order:3}.deck{order:4}#menu{order:5}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.tb{display:flex;gap:5px}

<script>
const $=s=>document.querySelector(s);
const cam=$('.cam');
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t,tb,tk,ta;uniform vec2 r,cr,st;
uniform float T,m,z,fb,F,rot,pf,ca,bl,bd,bm,nz,sn,vg,jt,sat,wb,sh,ex,fx,fp,lf,fd,kc,kb,skk,ska,skt,skw,bkk,bkt;
varying vec2 u;
vec2 PX;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p=(p-.5)*cr/(z*st)+.5;if(fp>.5)p=1.-p;p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(p.y,1.-p.x);else if(rot>.5)p=vec2(1.-p.y,p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb*ex;}
vec3 Sb(vec2 p){vec2 o=PX*.35;return (S(p+o)+S(p+vec2(-o.x,o.y))+S(p+vec2(o.x,-o.y))+S(p-o))*.25;}
float Yf(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec2 sc=u;float L=floor(sc.y*240.);float f=floor(T*30.);
 PX=1./r;
 float jit=h(vec2(L,f))-.5;
 vec2 uv=sc;
 uv.x+=jit*.0025*jt+sin(sc.y*8.+T*1.5)*.0006*jt;
 vec2 c=sc-.5;float asp=r.x/r.y;
 vec2 c2=c*(.008+dot(c,c)*.04)*ca+vec2(.0012*ca,0.);
 vec3 col=vec3(Sb(uv+c2).r,Sb(uv).g,Sb(uv-c2*1.3).b);
 float rr=bl*.003+fb;
 if(rr>.0002){vec3 bk=(col+S(uv+vec2(rr,0.))+S(uv-vec2(rr,0.))+S(uv+vec2(0.,rr*asp))+S(uv-vec2(0.,rr*asp)))*.2;col=mix(col,bk,clamp(rr*400.,0.,.9));}
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,clamp(.8*bd,0.,1.));
 float Y0=Yf(col);
 col=Y0+(cm-Yf(cm))*1.15;
 float yl=Yf(Sb(uv-vec2(PX.x,0.))),yr=Yf(Sb(uv+vec2(PX.x,0.)));
 float yu=Yf(Sb(uv-vec2(0.,PX.y))),yd=Yf(Sb(uv+vec2(0.,PX.y)));
 col+=((Y0*2.-yl-yr)*.4+(Y0*2.-yu-yd)*.2)*sh;
 float ya=Yf(S(uv+vec2(.005,0.))),yb=Yf(S(uv-vec2(.005,0.)));
 float pu=smoothstep(.04,.3,abs(ya-yb))*(.35+.65*smoothstep(.4,.9,max(ya,yb)));
 col+=vec3(.55,.05,1.)*pu*.7*pf;col.g-=pu*.12*pf;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*asp);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*bm*vec3(.85,.92,1.);
 if(skk>0.)col+=texture2D(tb,vec2(uv.x,1.-uv.y)).rgb*skk*.4;
 if(bkk>0.){vec2 tu=vec2(uv.x,1.-uv.y);vec3 la=texture2D(ta,tu).rgb;float hm=smoothstep(.03,.2,Yf(la))*min(bkk,1.);vec3 bk=texture2D(tk,tu).rgb*bkk;
  col=mix(col+bk*.85,max(bk*1.05,la*.55)+bk*.1,hm);}
 col=(col-.5)*1.1+.5;col=mix(vec3(Yf(col)),col,1.1*sat);
 col+=vec3(.005,.01,.04)*(1.-clamp(Yf(col),0.,1.));
 col*=vec3(.96,.98,1.06);
 col=max(col,vec3(.04));
 float Y=Yf(col);float nk=1.;
 if(F==1.){col=mix(vec3(Y),col,.75)*vec3(1.05,.96,1.1);nk=1.6;}
 else if(F==2.){col=vec3(.25,1.,.3)*min(Y*2.2,1.3);nk=2.4;}
 else if(F==3.){col=vec3(Y)*1.12+.02;nk=1.3;}
 else if(F==4.){col=vec3(Y)*vec3(1.25,1.,.72)*1.05+(col-Y)*.35;}
 else if(F==5.){col=mix(col,mix(vec3(0.,.3,.4),vec3(1.,.4,.8),smoothstep(.1,.9,Y)),.65);}
 else if(F==6.){col=mix(vec3(Y),col,.72);col=(col-.5)*.85+.55;col*=vec3(1.04,1.,.93);col+=vec3(0.,.02,.04)*(1.-Y);nk=1.4;}
 else if(F==7.){col=vec3(Y)*vec3(.55,.85,1.25)+vec3(0.,.02,.06);nk=1.2;}
 else if(F==8.){float px=mod(gl_FragCoord.x,3.);vec3 mk=vec3(px<1.?1.:.55,(px>=1.&&px<2.)?1.:.55,px>=2.?1.:.55);col*=mk*1.25;col*=1.-.2*(.5+.5*sin(sc.y*r.y*3.1416));nk=.8;}
 else if(F==9.){float q=clamp(Y*1.15,0.,1.);vec3 c1=vec3(.02,0.,.25),c2=vec3(.55,0.,.55),c3=vec3(.95,.25,.1),c4=vec3(1.,.9,.2);
  col=q<.25?mix(c1,c2,q*4.):q<.5?mix(c2,c3,(q-.25)*4.):q<.75?mix(c3,c4,(q-.5)*4.):mix(c4,vec3(1.),(q-.75)*4.);nk=.7;}
 else if(F==10.){col=floor(col*5.+.5)/5.*vec3(1.05,1.,1.1);nk=.3;}
 else if(F==11.){col=1.-col;}
 else if(F==12.){col*=mix(vec3(.75,1.,1.15),vec3(1.2,.95,.75),smoothstep(.3,.75,Y));}
 else if(F==13.){col+=b*.35*bm;col=mix(vec3(Yf(col)),col,1.2)*vec3(1.06,.98,1.1);col=col*.9+.1;nk=.6;}
 else if(F==14.){col=mix(vec3(Y),col,1.1);col*=vec3(.97,1.03,1.);col+=vec3(-.01,.015,.03)*(1.-Y);col=mix(col,vec3(1.),.08*smoothstep(.6,1.,Y));nk=1.2;}
 else if(F==15.){col=mix(vec3(Y),col,1.45);col=(col-.5)*1.15+.5;col*=vec3(1.02,1.,1.04);nk=.8;}
 else if(F==16.){col=(col-.5)*1.18+.5;col=mix(vec3(Y),col,.95);col*=vec3(1.04,1.,.95);col*=.9+.1*smoothstep(.1,.6,Y);col*=1.-.25*dot(c,c);nk=.9;}
 else if(F==17.){float v=(Y-.5)*1.3+.5;col=vec3(v)*vec3(1.02,1.,.97);nk=1.1;}
 else if(F==18.){col=mix(vec3(Y),col,.82);col=(col-.5)*.9+.53;col*=vec3(1.05,1.,.94);col+=vec3(.02,.01,0.)*(1.-Y);nk=1.2;}
 else if(F==19.){col=mix(vec3(Y),col,1.15);col*=vec3(1.08,1.02,.86);col=(col-.5)*1.05+.52;nk=1.3;}
 else if(F==20.){col*=vec3(.88,.97,1.12);col+=b*vec3(.9,.15,.08)*.25;col=mix(vec3(Y),col,1.05);nk=1.5;}
 else if(F==21.){float v=(Y*1.05-.5)*1.12+.5;col=vec3(v);nk=2.2;}
 col=(col-.5)*kc+.5;col=max(col-kb,0.)/(1.-kb);
 if(fx>.5){float ff=1.4-1.7*dot(c,c);col=col*(1.+ff*.8);col=(col-.5)*1.25+.5;col=mix(col,vec3(1.),clamp(ff*.12,0.,.25));}
 if(fd<1.5){col=max(col,0.);col=(1.-exp(-col*1.8))/(1.-exp(-1.8));}
 if(lf>.5){float fl=max(1.-1.6*dot(c,c),0.);col=col*(1.+fl*.55)+vec3(.03,.03,.04)*fl;}
 col*=vec3(1.+wb*.14,1.+wb*.03,1.-wb*.18);
 col*=1.-.05*sn*(.5+.5*sin(sc.y*240.*6.2832));
 col*=1.-.02*sn*mod(f,2.);
 float n=h(sc*r+T)-.5;col+=n*.22*nz*nk*(1.-Yf(col)*.5);
 col+=(vec3(h(sc*r*.5+T+1.),h(sc*r*.5+T+2.),h(sc*r*.5+T+3.))-.5)*.08*nz*nk;
 col*=max(1.-dot(c,c)*1.1*vg,0.);
 gl_FragColor=vec4(col,1.);}`;
function mk(ty,s){const o2=gl.createShader(ty);gl.shaderSource(o2,s);gl.compileShader(o2);return o2}
const pg=gl.createProgram();gl.bindAttribLocation(pg,0,'a');
gl.attachShader(pg,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
const BFS=`precision mediump float;uniform sampler2D t;uniform vec2 r,cr,st;uniform float m,z,rot,fp,ex,skt,sk2,ska;varying vec2 u;
vec3 S(vec2 p){p=(p-.5)*cr/(z*st)+.5;if(fp>.5)p=1.-p;p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(p.y,1.-p.x);else if(rot>.5)p=vec2(1.-p.y,p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb*ex;}
void main(){vec3 mx=vec3(0.),av=vec3(0.);float s1=0.,s2=0.;
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec3 c=S(u+vec2(float(i),float(j))/128.);float Y=dot(c,vec3(.299,.587,.114)),w1=smoothstep(skt,1.,Y);s1+=w1;s2+=smoothstep(sk2,1.02,Y);c*=w1;mx=max(mx,c);av+=c;}
 gl_FragColor=vec4(mx*.5+av/18.,s1>0.?clamp(s2/s1,0.,1.):0.);}`;
const KFS=`precision mediump float;uniform sampler2D tm;uniform vec2 r;uniform float ska,skw;varying vec2 u;
void main(){float asp=r.x/r.y,an=ska*.0174533;vec2 dv=vec2(cos(an),sin(an)*asp);vec2 pv=vec2(-sin(an),cos(an)*asp)*(skw*.012);
 float Lm=1.2*max(1.,1./asp);vec3 a=vec3(0.);vec2 ps=vec2(pv.x,-pv.y);

  return{lines:[P.concat([P[0]])],poly:st.fill?P:null}}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function rasterShape(st){const g=shapeGeo(st),c=E.layer.getContext('2d');
  if(g.poly){let a=1e9,b=1e9,A=-1e9,B=-1e9;g.poly.forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);A=Math.max(A,x);B=Math.max(B,y)});
    c.fillStyle=st.col;for(let gy=Math.max(0,Math.floor(b));gy<=Math.min(E.gh-1,B);gy++)for(let gx=Math.max(0,Math.floor(a));gx<=Math.min(E.gw-1,A);gx++)if(inPoly(gx+.5,gy+.5,g.poly)){st.m.set(gy*E.gw+gx,1);c.fillRect(gx,gy,1,1)}}
  g.lines.forEach(L=>{for(let i=1;i<L.length;i++)rasterGrid(st,L[i-1][0],L[i-1][1],L[i][0],L[i][1])})}
function rasterSeg(st,i){const b=st.pts[i],a=st.pts[i-1]||b;rasterGrid(st,a.x*E.gw,a.y*E.gh,b.x*E.gw,b.y*E.gh)}
function rasterGrid(st,x0,y0,x1,y1){
  const c=E.layer.getContext('2d'),n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2)),r=Math.max(st.w/2,.71),R=Math.ceil(r+3);
  for(let k=0;k<=n;k++){const cx=x0+(x1-x0)*k/n,cy=y0+(y1-y0)*k/n;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const gx=Math.floor(cx)+dx,gy=Math.floor(cy)+dy;if(gx<0||gy<0||gx>=E.gw||gy>=E.gh)continue;
      const d=Math.hypot(gx+.5-cx,gy+.5-cy),al=d<=r?1:Math.max(0,Math.ceil((1-(d-r)/2.6)*4)/4*.8);if(!al)continue;const key=gy*E.gw+gx,old=st.m.get(key)||0;if(al<=old)continue;st.m.set(key,al);
      c.globalAlpha=al;if(st.er){c.globalCompositeOperation='destination-out';c.fillRect(gx,gy,1,1);c.globalCompositeOperation='source-over'}else{c.fillStyle=st.col;c.fillRect(gx,gy,1,1)}}}
  c.globalAlpha=1}
ECOL.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===E.col?'sel':'';
  b.onclick=()=>{E.col=c;[...$('#sws').children].forEach(x=>x.classList.toggle('sel',x===b))};$('#sws').append(b)});

function renderStk(){const box=$('#stks');box.innerHTML='';
  [...$('#scat').children].forEach(b=>b.classList.toggle('act',b.dataset.c===scat));
  box.style.flexDirection=scat==='b'?'column':'';box.style.alignItems=scat==='b'?'stretch':'';

    const cw=document.createElement('div');cw.className='chips';[['#f2f2f2','白'],['#0a0a0a','黑'],['#b3001b','血红']].forEach(([c2,n])=>{const b=document.createElement('button');b.className='btn'+(GOTH.col===c2?' act':'');b.textContent=n;
      b.onclick=()=>{GOTH.col=c2;[...cw.children].forEach(x=>x.classList.toggle('act',x===b));const s2=E.stk[E.sel];if(s2&&s2.k==='g'){s2.col=c2;edRender()}};cw.append(b)});box.append(cw);
    const gi=w.querySelector('#gtx');const sel=E.stk[E.sel];if(sel&&sel.k==='g')gi.value=sel.t;
    gi.oninput=()=>{const s2=E.stk[E.sel];if(s2&&s2.k==='g'&&gi.value.trim()){s2.t=gi.value;edRender()}};

    const ic=document.createElement('div');ic.className='stks';BKSN.forEach(id=>{const b=document.createElement('button');b.className='btn bk';const im=document.createElement('img');im.src=mkBK(id).c.toDataURL();b.append(im);b.onclick=()=>addStk({k:'b',id});ic.append(b)});box.append(ic);return}
  if(scat==='t'){TXT.forEach(t=>{const b=document.createElement('button');b.className='btn tg';b.textContent=t;b.onclick=()=>addStk({k:'t',t});box.append(b)});return}
  (scat==='v'?VSTN:SPRN).forEach(id=>{const b=document.createElement('button');b.className='btn';const im=document.createElement('img');
    im.src=(scat==='v'?mkVB(id):mkBM(id)).c.toDataURL();b.append(im);b.onclick=()=>addStk({k:scat,id});box.append(b)});
}

/* view zoom: two fingers pinch / pan, one finger draws */
const EV={s:1,x:0,y:0,pts:new Map(),pin:null,lock:false};
function evApply(){ec.style.transform=EV.s===1&&!EV.x&&!EV.y?'':`translate(${EV.x}px,${EV.y}px) scale(${EV.s})`;$('#ezr').textContent=EV.s>1.01?EV.s.toFixed(1)+'×':''}
function evReset(){EV.s=1;EV.x=EV.y=0;EV.pin=null;EV.pts.clear();EV.lock=false;evApply()}
function toLocal(cx,cy){const r=$('#ew').getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),b=document.body.classList;
  return b.contains('rotr')?{x:dy,y:-dx}:b.contains('rotl')?{x:-dy,y:dx}:{x:dx,y:dy}}
function pinInfo(){const [a,b]=[...EV.pts.values()];const p=toLocal((a.x+b.x)/2,(a.y+b.y)/2);return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,m:p}}
function evClamp(){const w=ec.offsetWidth,h=ec.offsetHeight,mx=w*(EV.s-1)/2,my=h*(EV.s-1)/2;EV.x=Math.max(-mx,Math.min(mx,EV.x));EV.y=Math.max(-my,Math.min(my,EV.y))}
function cancelAction(){E.mcur=null;if(E.cur){E.cur=null;rebuild()}E.drag=null;E.cdrag=null;edRender()}
ec.addEventListener('pointerdown',e=>{
  e.preventDefault();try{ec.setPointerCapture(e.pointerId)}catch(_){}
  EV.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(EV.pts.size>=2){cancelAction();EV.lock=true;const i=pinInfo();EV.pin={d0:i.d,m0:i.m,s0:EV.s,x0:EV.x,y0:EV.y};return}
  if(EV.lock)return;
  const p=loc(e);
  if(E.tool==='adj'||E.tool==='frame')return;
  if(E.tool==='crop'){cropDown(p);return}
  if(E.tool==='stk'){const i=hitStk(p);E.sel=i;if(i>=0)E.drag={i,ox:p.x-E.stk[i].x,oy:p.y-E.stk[i].y};stkUI();edRender();return}
  if(E.tool==='mos'){E.mcur={pts:[p],w:E.msz};edRender();return}
  if(E.tool==='shape'){const s2=E.layer;E.snap=document.createElement('canvas');E.snap.width=s2.width;E.snap.height=s2.height;E.snap.getContext('2d').drawImage(s2,0,0);
    E.cur={sh:E.shp,fill:E.sfill,col:E.col,w:E.sz,a:p,b:p,pts:[],m:new Map()};rasterShape(E.cur);edRender();return}
  E.cur={col:E.col,w:E.sz,er:E.tool==='er',pts:[p],m:new Map()};rasterSeg(E.cur,0);edRender();
});
ec.addEventListener('pointermove',e=>{
  if(EV.pts.has(e.pointerId))EV.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(EV.pin&&EV.pts.size>=2){const i=pinInfo(),P=EV.pin,s=Math.max(1,Math.min(8,P.s0*i.d/P.d0)),k=s/P.s0;
    EV.s=s;EV.x=i.m.x-(P.m0.x-P.x0)*k;EV.y=i.m.y-(P.m0.y-P.y0)*k;evClamp();evApply();return}
  if(EV.lock)return;
  const p=loc(e);
  if(E.cdrag){cropMove(p);edRender();return}
  if(E.drag){const s=E.stk[E.drag.i];s.x=p.x-E.drag.ox;s.y=p.y-E.drag.oy;edRender()}
  else if(E.mcur){E.mcur.pts.push(p);edRender()}
  else if(E.cur&&E.cur.sh){E.cur.b=p;E.cur.m=new Map();const c=E.layer.getContext('2d');c.clearRect(0,0,E.gw,E.gh);c.drawImage(E.snap,0,0);rasterShape(E.cur);edRender()}
  else if(E.cur){E.cur.pts.push(p);rasterSeg(E.cur,E.cur.pts.length-1);edRender()}
});
['pointerup','pointercancel'].forEach(n=>ec.addEventListener(n,e=>{EV.pts.delete(e.pointerId);
  if(EV.pts.size<2)EV.pin=null;
  if(EV.lock){if(!EV.pts.size){EV.lock=false;if(EV.s<1.05){EV.s=1;EV.x=EV.y=0;evApply()}}return}
  if(E.mcur){E.mst.push(E.mcur);E.hist.push('m');E.mcur=null;edRender()}
  if(E.cur){E.strokes.push(E.cur);E.hist.push('s');E.cur=null;E.snap=null}E.drag=null;E.cdrag=null}));
