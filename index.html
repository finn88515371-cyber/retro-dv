<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANDYCAM DV-2000</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{--page:#0d0d0f;--camc:transparent;--camb:0 solid transparent;--camr:0;--deck:linear-gradient(#2d2f35,#1f2024);--deckb:#3b3d44;--ink:#d8d8d0;--mut:#8b8d92;--btn:#3a3c43;--btnb:#55575f;--btnk:#d8d8d0;--act:#c9c9c0;--actb:#e8e8e0;--actk:#111;--actsh:none;--lcdb:#34363c;--lcdw:6px;--menu:#141416;--menub:#3b3d44;--font:ui-monospace,Menlo,monospace;--rad:7px;--crad:12px;--bbw:3px;--ls:.08em;--acc:#c9c9c0;--shr:#9a9a96;--shbg:#18181b;--shi:#d8322b;--shp:#e4e4dc}
body.skin-xp{--page:linear-gradient(#2f6fd6,#7db0ee 55%,#6fb25a 56%,#44842f);--camc:#ece9d8;--camb:3px solid #0831d9;--camr:9px 9px 0 0;--deck:#ece9d8;--deckb:#aca899;--ink:#000;--mut:#4a4a4a;--btn:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);--btnb:#003c74;--btnk:#000;--act:linear-gradient(#cdcab8,#e6e3d3);--actb:#003c74;--actk:#000;--actsh:inset 1px 1px 3px #7d7a68;--lcdb:#7f9db9;--lcdw:2px;--menu:#fcfcfe;--menub:#919b9c;--font:Tahoma,'Segoe UI',Verdana,sans-serif;--rad:3px;--crad:3px;--bbw:1px;--ls:0;--acc:#316ac5;--shr:#5c8fe0;--shbg:#e8eefc;--shi:radial-gradient(circle at 35% 30%,#ff8a70,#d8281a 55%,#a01408);--shp:radial-gradient(circle at 35% 30%,#fff,#cfd8ea 60%,#9fb0cf)}
body.skin-w7{--page:radial-gradient(ellipse at 25% 15%,#8fd3ff,#2a7fc4 45%,#0a2f5e);--camc:linear-gradient(rgba(255,255,255,.55),rgba(173,203,236,.6) 30%,rgba(150,185,225,.65));--camb:1px solid rgba(0,0,0,.55);--camr:8px;--deck:linear-gradient(#f4f6f9,#e3e8ef);--deckb:#9aa7b8;--ink:#111;--mut:#505a66;--btn:linear-gradient(#f6f6f6,#ececec 49%,#dcdcdc 50%,#cfcfcf);--btnb:#707070;--btnk:#111;--act:linear-gradient(#cfe6fa,#9ccbf0 49%,#6fb1e8 50%,#8cc4f2);--actb:#2c628b;--actk:#000;--actsh:inset 0 1px 2px rgba(0,0,0,.25);--lcdb:#7c8da3;--lcdw:2px;--menu:#f0f0f0;--menub:#8a99ab;--font:'Segoe UI',Tahoma,sans-serif;--rad:3px;--crad:4px;--bbw:1px;--ls:0;--acc:#3a8dde;--shr:#d4dfec;--shbg:#8a9bb0;--shi:radial-gradient(circle at 40% 30%,#ff9a8a,#d42a14 55%,#8f1006);--shp:radial-gradient(circle at 40% 30%,#fff,#d0dcee 60%,#8fa6c6)}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.tb{display:flex;gap:5px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:var(--crad);border:var(--lcdw) solid var(--lcdb);box-shadow:inset 0 0 24px #000;overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:16px;font-size:12px;line-height:1.6;color:#9a9a92}
#pw .btn{color:var(--btnk)}
.deck{background:var(--deck);border-radius:var(--crad);padding:7px 10px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--deckb)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px;align-items:center}
.btn{background:var(--btn);color:var(--btnk);border:1px solid var(--btnb);border-bottom-width:var(--bbw);border-radius:var(--rad);padding:6px 9px;font:inherit;font-size:11px;letter-spacing:var(--ls);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.act{background:var(--act);color:var(--actk);border-color:var(--actb);box-shadow:var(--actsh)}
.btn:active{transform:translateY(1px)}
.zb{width:46px;font-size:16px;padding:4px 0;touch-action:none}
.zr{min-width:48px;text-align:center;font-size:12px}
.shut{width:58px;height:58px;border-radius:50%;border:4px solid var(--shr);background:var(--shbg);position:relative;cursor:pointer;padding:0;flex:none}
.shut::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--shi);transition:.15s}
.shut.photo::after{background:var(--shp)}
.shut.rec::after{inset:16px;border-radius:5px;background:var(--shi)}
body:not(.mob) #ori{display:none}
#menu{display:none;flex:none;height:42%;overflow-y:auto;background:var(--menu);border:1px solid var(--menub);border-radius:var(--crad);padding:10px 12px 14px;box-sizing:border-box}
.cam.menu #menu{display:block}
.cam.menu .deck{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
.tabs .btn{flex:none}
body.skin-xp .tabs .btn,body.skin-w7 .tabs .btn{border-radius:3px 3px 0 0}
body.skin-xp .tabs .btn.act{background:#fcfcfe;border-top:3px solid #ffc83c;box-shadow:none}
body.skin-w7 .tabs .btn.act{background:linear-gradient(#fff,#eaf3fc);border-top:2px solid #3a8dde}
.pane{display:none}.pane.on{display:block}
.gh{font-size:11px;color:var(--mut);margin:12px 0 5px;letter-spacing:.1em}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.note{font-size:11px;line-height:1.6;color:var(--mut);margin:4px 0}
.ms{display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0}
.ms span{width:84px;flex:none}
.ms input{flex:1;min-width:0;accent-color:var(--acc);margin:0}
.ms i{width:34px;text-align:right;font-style:normal;color:var(--mut);font-size:11px}
#lvl{height:8px;background:rgba(128,128,128,.3);border-radius:4px;overflow:hidden;margin:6px 0}
#lvl b{display:block;height:100%;width:0;background:#3fae6a}
#gal{position:absolute;inset:0;background:var(--menu);z-index:20;display:none;flex-direction:column}
#gal.on{display:flex}
#gal header{display:flex;justify-content:space-between;align-items:center;padding:10px;font-size:12px;letter-spacing:.1em}
#gl{flex:1;overflow:auto;padding:0 10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-content:start}
#gl .it{background:rgba(128,128,128,.18);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
#gl img,#gl video{width:100%;display:block;background:#000}
#gl .btn{border-radius:0;border-width:1px 0 0;text-align:center}
body.land .cam{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 160px;grid-template-rows:auto auto minmax(0,1fr)}
body.land .cam.menu{grid-template-columns:minmax(0,1fr) 300px}
body.land .tbar{grid-column:1/3;grid-row:1}
body.land .lcd{grid-column:1;grid-row:2/4}
body.land .top{grid-column:2;grid-row:2;justify-content:center}
body.land .deck{grid-column:2;grid-row:3;overflow-y:auto;justify-content:center}
body.land #menu{grid-column:2;grid-row:3;height:auto;min-height:0}
body.land .ctl{flex-direction:column}
body.land .seg{flex-wrap:wrap;justify-content:center}
body.rotr .cam,body.rotl .cam{--pv:14px;--ph:22px;position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0}
body.rotr .cam{transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
body.rotl .cam{transform:translateY(100vh) rotate(-90deg);transform:translateY(100dvh) rotate(-90deg)}
</style></head>
<body>
<div class="cam">
  <div class="tbar"><span class="ti">Handycam DV-2000</span><span class="wc" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span></div>
  <div class="top">
    <div class="tb"><button class="btn" id="bar">4:3</button><button class="btn" id="bre">360p</button></div>
    <div class="tb"><button class="btn" id="skb">SKIN</button><button class="btn" id="gb">GALLERY 0</button><button class="btn" id="mb">MENU</button></div>
  </div>
  <div class="lcd">
    <canvas id="out" width="640" height="480"></canvas>
    <div id="flash"></div>
    <div id="pw"><div>点 POWER 开机并允许使用摄像头</div><button class="btn act" id="pwb">⏻ POWER</button></div>
  </div>
  <div class="deck">
    <div class="ctl">
      <div class="seg"><button class="btn zb" id="zo">－</button><span class="zr" id="zr">1.0×</span><button class="btn zb" id="zi">＋</button></div>
      <button class="btn" id="mic">MIC OFF</button>
    </div>
    <div class="ctl">
      <div class="seg"><button class="btn act" id="mV">VIDEO</button><button class="btn" id="mP">PHOTO</button></div>
      <button class="shut" id="sh" aria-label="shutter"></button>
      <div class="seg"><button class="btn" id="ori">横屏</button><button class="btn" id="fl">FLIP</button></div>
    </div>
  </div>
  <div id="menu">
    <div class="mh"><b>MENU</b><button class="btn" id="mc">CLOSE</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </div>
  <div id="gal"><header><span>TAPE LIBRARY</span><button class="btn" id="gc">CLOSE</button></header><div id="gl"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const cam=$('.cam');
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t;uniform vec2 r,cr;
uniform float T,m,z,fb,F,rot,pf,ca,bl,bd,bm,nz,sn,vg,jt,sat,wb,sh;
varying vec2 u;
vec2 PX;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p=(p-.5)*cr/z+.5;p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(p.y,1.-p.x);else if(rot>.5)p=vec2(1.-p.y,p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb;}
vec3 Sb(vec2 p){vec2 o=PX*.35;return (S(p+o)+S(p+vec2(-o.x,o.y))+S(p+vec2(o.x,-o.y))+S(p-o))*.25;}
float Yf(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec2 sc=u;float L=floor(sc.y*240.);float f=floor(T*30.);
 PX=1./r;
 float jit=h(vec2(L,f))-.5;
 vec2 uv=sc;
 uv.x+=jit*.0025*jt+sin(sc.y*8.+T*1.5)*.0006*jt;
 vec2 c=sc-.5;float asp=r.x/r.y;
 vec2 c2=c*(.008+dot(c,c)*.04)*ca+vec2(.0012*ca,0.);
 vec3 col=vec3(Sb(uv+c2).r,Sb(uv).g,Sb(uv-c2*1.3).b);
 float rr=bl*.003+fb;
 if(rr>.0002){vec3 bk=(col+S(uv+vec2(rr,0.))+S(uv-vec2(rr,0.))+S(uv+vec2(0.,rr*asp))+S(uv-vec2(0.,rr*asp)))*.2;col=mix(col,bk,clamp(rr*400.,0.,.9));}
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,clamp(.8*bd,0.,1.));
 float Y0=Yf(col);
 col=Y0+(cm-Yf(cm))*1.15;
 float yl=Yf(Sb(uv-vec2(PX.x,0.))),yr=Yf(Sb(uv+vec2(PX.x,0.)));
 float yu=Yf(Sb(uv-vec2(0.,PX.y))),yd=Yf(Sb(uv+vec2(0.,PX.y)));
 col+=((Y0*2.-yl-yr)*.4+(Y0*2.-yu-yd)*.2)*sh;
 float ya=Yf(S(uv+vec2(.005,0.))),yb=Yf(S(uv-vec2(.005,0.)));
 float pu=smoothstep(.04,.3,abs(ya-yb))*(.35+.65*smoothstep(.4,.9,max(ya,yb)));
 col+=vec3(.55,.05,1.)*pu*.7*pf;col.g-=pu*.12*pf;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*asp);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*bm*vec3(.85,.92,1.);
 col=(col-.5)*1.1+.5;col=mix(vec3(Yf(col)),col,1.1*sat);
 col+=vec3(.01,.02,.07)*(1.-clamp(Yf(col),0.,1.));
 col*=vec3(.93,.96,1.12);
 col=max(col,vec3(.04));
 float Y=Yf(col);float nk=1.;
 if(F==1.){col=mix(vec3(Y),col,.75)*vec3(1.05,.96,1.1);nk=1.6;}
 else if(F==2.){col=vec3(.25,1.,.3)*min(Y*2.2,1.3);nk=2.4;}
 else if(F==3.){col=vec3(Y)*1.12+.02;nk=1.3;}
 else if(F==4.){col=vec3(Y)*vec3(1.25,1.,.72)*1.05+(col-Y)*.35;}
 else if(F==5.){col=mix(col,mix(vec3(0.,.3,.4),vec3(1.,.4,.8),smoothstep(.1,.9,Y)),.65);}
 col*=vec3(1.+wb*.14,1.+wb*.03,1.-wb*.18);
 col*=1.-.05*sn*(.5+.5*sin(sc.y*240.*6.2832));
 col*=1.-.02*sn*mod(f,2.);
 float n=h(sc*r+T)-.5;col+=n*.22*nz*nk*(1.-Yf(col)*.5);
 col+=(vec3(h(sc*r*.5+T+1.),h(sc*r*.5+T+2.),h(sc*r*.5+T+3.))-.5)*.08*nz*nk;
 col*=max(1.-dot(c,c)*1.1*vg,0.);
 gl_FragColor=vec4(col,1.);}`;
function mk(ty,s){const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pg=gl.createProgram();
gl.attachShader(pg,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
const UL={};['r','cr','T','m','z','fb','F','rot','pf','ca','bl','bd','bm','nz','sn','vg','jt','sat','wb','sh'].forEach(n=>UL[n]=gl.getUniformLocation(pg,n));

/* settings */
const D={wb:-.25,sh:1,pf:1.2,ca:1,bl:0,bd:.8,bm:.8,nz:1,sn:1,vg:1,jt:1,sat:1};
const DS={mic:false,gain:1,ns:true,agc:true,ec:false,lofi:false,abr:1,skin:0};
let P={...D},S={...DS};
try{Object.assign(P,JSON.parse(localStorage.getItem('dvP2')||'{}'))}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem('dvS')||'{}'))}catch(e){}
if(P.wb===-.15)P.wb=D.wb;
const save=()=>{try{localStorage.setItem('dvP2',JSON.stringify(P));localStorage.setItem('dvS',JSON.stringify(S))}catch(e){}};

/* skins */
const SK=['dv','xp','w7'];
function applySkin(){const b=document.body.classList;SK.forEach(s=>b.remove('skin-'+s));b.add('skin-'+SK[S.skin]);save()}
applySkin();

/* state */
const mob=matchMedia('(pointer:coarse)').matches;
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;
let stream,facing='environment',on=false,mode='video',rec,chunks=[],t0=0,items=[],last=0,W=640,H=480,cw=0,ch=0,rot=0,szKey='',cr=[1,1];
let zt=1,zc=1,zT=0,zdir=0,fi=0,ri=0,si=1;
const FN=['DV','VHS','NIGHT','B&W','HOME','CYBER'];
const RATIOS=[['4:3',4/3],['16:9',16/9],['1:1',1],['2.35:1',2.35],['原始',0]];
const RES=[240,360,480,720];
const recing=()=>rec&&rec.state==='recording';

/* menu builder */
const panes=[],chipFns=[];
const syncChips=()=>chipFns.forEach(f=>f());
function mkPane(name){const d=document.createElement('div');d.className='pane';d.sy=[];d.rk=[];
  const b=document.createElement('button');b.className='btn';b.textContent=name;b.onclick=()=>showPane(d);
  $('#tabs').append(b);d.tab=b;$('#panes').append(d);panes.push(d);return d}
function showPane(d){panes.forEach(p=>{p.classList.toggle('on',p===d);p.tab.classList.toggle('act',p===d)})}
function head(p,t){const e=document.createElement('div');e.className='gh';e.textContent=t;p.append(e)}
function note(p,t){const e=document.createElement('div');e.className='note';e.textContent=t;p.append(e)}
function addSlider(p,label,lo,hi,st,obj,key,cb){
  const l=document.createElement('label');l.className='ms';
  l.innerHTML=`<span>${label}</span><input type="range" min="${lo}" max="${hi}" step="${st}"><i></i>`;
  const i=l.children[1],v=l.children[2];
  const sync=()=>{i.value=obj[key];v.textContent=(+obj[key]).toFixed(2)};
  i.oninput=()=>{obj[key]=+i.value;v.textContent=(+i.value).toFixed(2);save();cb&&cb()};
  sync();p.append(l);p.sy.push(sync);p.rk.push([obj,key,(obj===P?D:DS)[key],cb]);
}
function addToggle(p,label,obj,key,cb){
  const w=document.createElement('div');w.className='chips';
  const b=document.createElement('button');b.className='btn';
  const sync=()=>{b.classList.toggle('act',!!obj[key]);b.textContent=label+' '+(obj[key]?'开':'关')};
  b.onclick=()=>{obj[key]=!obj[key];sync();save();cb&&cb()};
  sync();w.append(b);p.append(w);p.sy.push(sync);p.rk.push([obj,key,DS[key],cb]);
}
function addChips(p,labels,get,set){
  const w=document.createElement('div');w.className='chips';
  const bs=labels.map((n,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>{set(i);syncChips()};w.append(b);return b});
  chipFns.push(()=>bs.forEach((b,i)=>b.classList.toggle('act',get()===i)));p.append(w);
}
function addReset(p){const b=document.createElement('button');b.className='btn';b.textContent='重置本页';b.style.marginTop='14px';
  b.onclick=()=>{p.rk.forEach(([o,k,d,cb])=>{o[k]=d;cb&&cb()});save();p.sy.forEach(f=>f())};p.append(b)}

function setRes(i){if(recing())return;si=i;$('#bre').textContent=RES[si]+'p'}
function setRatio(i){if(recing())return;ri=i;$('#bar').textContent=RATIOS[ri][0]}
$('#bre').onclick=()=>{setRes((si+1)%RES.length);syncChips()};
$('#bar').onclick=()=>{setRatio((ri+1)%RATIOS.length);syncChips()};
$('#skb').onclick=()=>{S.skin=(S.skin+1)%SK.length;applySkin();syncChips()};

/* mic */
const AC=window.AudioContext||window.webkitAudioContext;
let ac,astream,aDst,aHP,aLP,aGain,aAn,aSrc,pS;
const lvBuf=new Uint8Array(512);
function nodes(){if(!aGain)return;aGain.gain.value=S.gain;aHP.frequency.value=S.lofi?250:20;aLP.frequency.value=S.lofi?4800:20000}
function stopMic(){if(astream)astream.getTracks().forEach(t=>t.stop());astream=aDst=aSrc=aAn=aGain=null}
function updMic(){$('#mic').textContent=S.mic?'MIC ON':'MIC OFF';$('#mic').classList.toggle('act',S.mic)}
async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,autoGainControl:S.agc}});
    if(!S.mic){s.getTracks().forEach(t=>t.stop());return}
    astream=s;await ac.resume();
    aSrc=ac.createMediaStreamSource(s);
    aHP=ac.createBiquadFilter();aHP.type='highpass';aLP=ac.createBiquadFilter();aLP.type='lowpass';
    aGain=ac.createGain();aAn=ac.createAnalyser();aAn.fftSize=512;aDst=ac.createMediaStreamDestination();
    aSrc.connect(aHP);aHP.connect(aLP);aLP.connect(aGain);aGain.connect(aDst);aGain.connect(aAn);nodes();
  }catch(e){S.mic=false;save();updMic();pS&&pS.sy.forEach(f=>f());alert('无法使用麦克风：'+(e.name||e))}
}
function applyMic(){stopMic();if(S.mic){if(!ac&&AC)ac=new AC();if(ac&&ac.resume)ac.resume();startMic()}updMic()}
const guard=k=>()=>{if(recing()){S[k]=!S[k];pS.sy.forEach(f=>f());return}applyMic()};
$('#mic').onclick=()=>{if(recing())return;S.mic=!S.mic;save();pS.sy.forEach(f=>f());applyMic()};

/* menu panes */
const pF=mkPane('滤镜');head(pF,'选择滤镜');addChips(pF,FN,()=>fi,i=>{fi=i});
const pQ=mkPane('画质');
head(pQ,'分辨率');addChips(pQ,RES.map(n=>n+'p'),()=>si,setRes);
head(pQ,'画面比例');addChips(pQ,RATIOS.map(r=>r[0]),()=>ri,setRatio);
head(pQ,'清晰度');
addSlider(pQ,'锐化',0,2,.01,P,'sh');addSlider(pQ,'色彩拖影',0,2,.01,P,'bd');addSlider(pQ,'后期模糊',0,2,.01,P,'bl');addReset(pQ);
const pC=mkPane('色彩');
addSlider(pC,'白平衡 蓝↔黄',-1,1,.01,P,'wb');addSlider(pC,'饱和度',0,2,.01,P,'sat');addSlider(pC,'紫边',0,3,.01,P,'pf');
addSlider(pC,'色散(红蓝边)',0,3,.01,P,'ca');addSlider(pC,'高光扩散',0,3,.01,P,'bm');addSlider(pC,'暗角',0,2,.01,P,'vg');addReset(pC);
const pR=mkPane('复古');
addSlider(pR,'噪点',0,3,.01,P,'nz');addSlider(pR,'扫描线',0,3,.01,P,'sn');addSlider(pR,'画面抖动',0,3,.01,P,'jt');addReset(pR);
pS=mkPane('声音');
note(pS,'iPhone 上开启麦克风通常会让其他 App 的音乐暂停。想边听歌边录像，请保持麦克风关闭（录出来没有声音）。电脑和安卓一般不受影响。');
head(pS,'麦克风');addToggle(pS,'麦克风',S,'mic',guard('mic'));
head(pS,'输入电平');{const l=document.createElement('div');l.id='lvl';l.innerHTML='<b></b>';pS.append(l)}
addSlider(pS,'输入增益',0,4,.05,S,'gain',nodes);
head(pS,'处理');
addToggle(pS,'降噪',S,'ns',guard('ns'));addToggle(pS,'自动增益',S,'agc',guard('agc'));addToggle(pS,'回声消除',S,'ec',guard('ec'));
addToggle(pS,'复古音质（窄频）',S,'lofi',nodes);
head(pS,'录音码率');addChips(pS,['64k 低','128k 标准','256k 高'],()=>S.abr,i=>{S.abr=i;save()});
addReset(pS);
const pK=mkPane('外观');head(pK,'界面皮肤');addChips(pK,['DV 摄像机','Windows XP','Windows 7'],()=>S.skin,i=>{S.skin=i;applySkin()});
showPane(pF);syncChips();updMic();
$('#mb').onclick=()=>cam.classList.toggle('menu');
$('#mc').onclick=()=>cam.classList.remove('menu');

/* orientation */
let lastDp=innerHeight>=innerWidth,land=!lastDp;
function layout(){
  const dp=innerHeight>=innerWidth,b=document.body.classList;
  b.toggle('mob',mob);b.toggle('land',land);
  b.toggle('rotr',mob&&land&&dp);b.toggle('rotl',mob&&!land&&!dp);
  $('#ori').textContent=land?'竖屏':'横屏';
}
addEventListener('resize',()=>{const dp=innerHeight>=innerWidth;if(dp!==lastDp){lastDp=dp;land=!dp}layout()});
$('#ori').onclick=()=>{if(recing())return;land=!land;layout()};
layout();

/* camera (video only; mic is separate) */
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pwMsg('此环境不支持摄像头，请用 Chrome / Edge / Safari 打开 https 链接。');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){pwMsg('无法使用摄像头：'+e.name+'。请检查浏览器权限。');return}
  vid.srcObject=stream;await vid.play();on=true;$('#pw').style.display='none';
}
function pwMsg(s){$('#pw').firstElementChild.textContent=s}
$('#pwb').onclick=()=>{if(S.mic)applyMic();start()};
$('#fl').onclick=()=>{if(recing())return;facing=facing==='user'?'environment':'user';if(on)start()};

/* zoom buttons: hold to zoom */
function zb(id,d){const e=$(id);
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();zdir=d;zT=performance.now();try{e.setPointerCapture(ev.pointerId)}catch(_){}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,()=>{zdir=0}));
  e.addEventListener('contextmenu',ev=>ev.preventDefault());
}
zb('#zi',1);zb('#zo',-1);

function size(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
  const outL=mob?land:true;
  rot=(outL&&vw<vh)?1:(!outL&&vw>vh)?2:0;
  const sa=rot?vh/vw:vw/vh;
  let ta=RATIOS[ri][1];if(!ta)ta=sa;else if(!outL)ta=1/ta;
  const N=RES[si];let w,h;
  if(ta>=1){h=N;w=Math.round(N*ta)}else{w=N;h=Math.round(N/ta)}
  w&=~1;h&=~1;
  const s=Math.max(1,Math.round(720/N));
  const key=w+'x'+h+'x'+s;
  if(key!==szKey){szKey=key;cw=w;ch=h;gc.width=w;gc.height=h;out.width=W=w*s;out.height=H=h*s;gl.viewport(0,0,w,h)}
  cr=ta>sa?[1,sa/ta]:[ta/sa,1];
  return true;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ov(T){
  const f=Math.max(12,Math.min(W,H)*.05),m=f*.9,isRec=recing();
  oc.font=`bold ${f}px ui-monospace,Menlo,monospace`;oc.textBaseline='top';
  const tx=(s,x,y,al)=>{oc.textAlign=al||'left';
    oc.fillStyle='rgba(255,40,60,.75)';oc.fillText(s,x-1.6,y);
    oc.fillStyle='rgba(40,200,255,.75)';oc.fillText(s,x+1.6,y);
    oc.shadowColor='#fff';oc.shadowBlur=f*.35;oc.fillStyle='#f4f4ee';oc.fillText(s,x,y);oc.shadowBlur=0};
  const blink=Math.floor(T*1.5)%2===0;
  if(mode==='photo')tx('PHOTO',m,m);
  else tx(isRec?(blink?'● REC':'  REC'):'STBY',m,m);
  if(fi)tx(FN[fi],m,m+f*1.25);
  tx('SP ▮▮▮▯',W-m,m,'right');
  if(zdir||Math.abs(zt-zc)>.005||performance.now()-zT<1500){
    const n=Math.max(0,Math.min(8,Math.round(Math.log(zc)/Math.log(6)*8)));
    tx('W '+'▮'.repeat(n)+'▯'.repeat(8-n)+' T',W/2,H-m-f*3.4,'center');
  }
  const d=new Date();
  tx(d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase(),m,H-m-f*2.2);
  tx(d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),m,H-m-f);
  tx(isRec?fmt((performance.now()-t0)/1000):'0:00:00',W-m,H-m-f,'right');
}
function loop(ts){
  requestAnimationFrame(loop);
  if(aAn&&cam.classList.contains('menu')){
    aAn.getByteTimeDomainData(lvBuf);let pk=0;for(let i=0;i<lvBuf.length;i++)pk=Math.max(pk,Math.abs(lvBuf[i]-128));
    $('#lvl b').style.width=Math.min(100,pk/128*100)+'%';
  }
  if(!on||vid.readyState<2||ts-last<33||!size())return;
  const dt=Math.min(.1,(ts-last)/1000);last=ts;const T=ts/1000;
  if(zdir){zt=Math.min(6,Math.max(1,zt*Math.exp(zdir*dt*.85)));zT=performance.now()}
  const lz=Math.log(zc),lt=Math.log(zt);
  zc=Math.exp(lz+(lt-lz)*(1-Math.exp(-dt*7)));if(Math.abs(zc-zt)<.002)zc=zt;
  $('#zr').textContent=zc.toFixed(1)+'×';
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  gl.uniform2f(UL.r,cw,ch);gl.uniform2f(UL.cr,cr[0],cr[1]);gl.uniform1f(UL.T,T%1000);
  gl.uniform1f(UL.m,facing==='user'?1:0);gl.uniform1f(UL.z,zc);
  gl.uniform1f(UL.fb,Math.min(Math.abs(zt-zc)*.0015,.008));
  gl.uniform1f(UL.F,fi);gl.uniform1f(UL.rot,rot);
  for(const k in D)gl.uniform1f(UL[k],P[k]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  oc.imageSmoothingEnabled=false;oc.drawImage(gc,0,0,W,H);ov(T);
}
oc.fillStyle='#000';oc.fillRect(0,0,640,480);requestAnimationFrame(loop);

function setMode(m){
  if(recing())return;
  mode=m;$('#mV').classList.toggle('act',m==='video');$('#mP').classList.toggle('act',m==='photo');
  $('#sh').className='shut'+(m==='photo'?' photo':'');
}
$('#mV').onclick=()=>setMode('video');$('#mP').onclick=()=>setMode('photo');
function add(it){items.unshift(it);$('#gb').textContent='GALLERY '+items.length}
$('#sh').onclick=()=>{
  if(!on)return;
  if(mode==='photo'){
    const fl=$('#flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),60);
    out.toBlob(b=>add({k:'img',blob:b,url:URL.createObjectURL(b)}),'image/jpeg',.92);
    return;
  }
  if(recing()){rec.stop();return}
  if(typeof MediaRecorder==='undefined'){alert('此浏览器不支持录像');return}
  const cs=out.captureStream(30);
  if(aDst)aDst.stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  const o={videoBitsPerSecond:4e6,audioBitsPerSecond:[64e3,128e3,256e3][S.abr]};if(mt)o.mimeType=mt;
  chunks=[];rec=new MediaRecorder(cs,o);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/mp4'});add({k:'vid',blob:b,url:URL.createObjectURL(b)});$('#sh').classList.remove('rec')};
  rec.start(500);t0=performance.now();$('#sh').classList.add('rec');
};
async function saveItem(it){
  const ext=it.k==='img'?'jpg':(it.blob.type.includes('mp4')?'mp4':'webm');
  const f=new File([it.blob],'DV_'+Date.now()+'.'+ext,{type:it.blob.type});
  try{if(mob&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=it.url;a.download=f.name;a.click();
}
function render(){
  const g=$('#gl');g.innerHTML='';
  if(!items.length){g.textContent='NO TAPE';return}
  items.forEach(it=>{
    const d=document.createElement('div');d.className='it';
    const el=document.createElement(it.k==='img'?'img':'video');el.src=it.url;
    if(it.k==='vid'){el.controls=true;el.playsInline=true}
    const b=document.createElement('button');b.className='btn';b.textContent='SAVE / SHARE';b.onclick=()=>saveItem(it);
    d.append(el,b);g.append(d);
  });
}
$('#gb').onclick=()=>{render();$('#gal').classList.add('on')};
$('#gc').onclick=()=>$('#gal').classList.remove('on');
</script>
