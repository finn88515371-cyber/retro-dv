<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body.skin-leather,body.skin-linen,body.skin-wood,body.skin-metal,body.skin-paper{--font:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;--rad:6px;--crad:8px;--bbw:1px;--ls:0;--acc:#2f6fc4;--act:linear-gradient(#7fb0ee,#3478d4 50%,#1f5fbd 51%,#3f86de);--actb:#17467f;--actk:#fff;--actts:0 -1px rgba(0,0,0,.45);--actsh:inset 0 1px 0 rgba(255,255,255,.35);--lcdb:#17130f;--lcdw:4px;--lcdsh:0 1px 0 rgba(255,255,255,.35),inset 0 0 12px #000;--shi:radial-gradient(circle at 40% 28%,#ff9a8a,#d42a14 55%,#8f1006);--shp:radial-gradient(circle at 40% 28%,#fff,#d8d8dc 60%,#9a9aa2)}
body.skin-leather{color-scheme:dark;--lth:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.7px) 0 0/5px 5px,radial-gradient(rgba(0,0,0,.2) 1px,transparent 1.7px) 2px 2px/5px 5px;--page:#2a1a10;--camc:var(--lth),linear-gradient(#6c472a,#47301b);--deck:var(--lth),linear-gradient(#5d3c23,#3f2815);--deckb:#1d1008;--stitch:2px dashed #d9c590;--ink:#f3e8cf;--mut:#c6b189;--btn:linear-gradient(#85715f,#54402f 50%,#3b2819 51%,#563f2d);--btnb:#190d05;--btnk:#f8eed8;--btnts:0 -1px rgba(0,0,0,.6);--btnsh:0 1px 0 rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.3);--menu:linear-gradient(#f6eddb,#e6dabc);--menub:#1d1008;--menuink:#3a2a18;--menumut:#8a7656;--shr:#cdb98a;--shbg:#2d1b0e}
body.skin-linen{--lin:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);--page:#5d616a;--camc:var(--lin),linear-gradient(#b7bbc2,#a0a4ac);--deck:var(--lin),linear-gradient(#cfd2d8,#b9bdc4);--deckb:#6e727b;--ink:#23262c;--mut:#4b505a;--btn:linear-gradient(#fdfdfd,#e1e1e3 50%,#c9c9cc 51%,#e6e6e8);--btnb:#7a7d86;--btnk:#23262c;--btnts:0 1px rgba(255,255,255,.9);--btnsh:0 1px 1px rgba(0,0,0,.25),inset 0 1px 0 #fff;--menu:var(--lin),#e1e3e7;--menub:#6e727b;--shr:#8d9199;--shbg:#3a3d44}
body.skin-wood{color-scheme:dark;--wood:repeating-linear-gradient(90deg,rgba(0,0,0,.11) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(255,220,170,.08) 0 1px,transparent 1px 5px),repeating-linear-gradient(180deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);--page:#3a2312;--camc:var(--wood),linear-gradient(#97653b,#74492a);--deck:var(--wood),linear-gradient(#603b20,#432710);--deckb:#24130a;--ink:#f4e8d0;--mut:#d0b78f;--btn:linear-gradient(#8f6644,#5e3d24 50%,#472a1a 51%,#63422b);--btnb:#20110a;--btnk:#f8ecd5;--btnts:0 -1px rgba(0,0,0,.55);--btnsh:0 1px 0 rgba(255,255,255,.15),inset 0 1px 0 rgba(255,255,255,.28);--act:linear-gradient(#ffdc92,#eaad40 50%,#d68f1f 51%,#f1ba5c);--actb:#7a4a08;--actk:#3a2000;--actts:0 1px rgba(255,255,255,.5);--menu:linear-gradient(#f8f0da,#eadfc0);--menub:#24130a;--menuink:#3a2a18;--menumut:#8a7656;--shr:#c9a86a;--shbg:#3a2210}
body.skin-metal{--brush:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 4px);--page:#6f747b;--camc:var(--brush),linear-gradient(#d6d9dd,#aaaeb4);--deck:var(--brush),linear-gradient(#e4e6e9,#c5c8cd);--deckb:#7d8188;--ink:#1e2126;--mut:#555a63;--btn:linear-gradient(#64666a,#2e2f32 50%,#19191b 51%,#323336);--btnb:#09090a;--btnk:#f2f2f2;--btnts:0 -1px #000;--btnsh:0 1px 0 rgba(255,255,255,.5),inset 0 1px 0 rgba(255,255,255,.25);--menu:var(--brush),#e8eaed;--menub:#7d8188;--shr:#8f9298;--shbg:#2a2b2d}
body.skin-paper{--font:'Marker Felt','Noteworthy','Chalkboard SE','Comic Sans MS','Segoe Print','PingFang SC','Microsoft YaHei',cursive;--page:#d8c97a;--camc:linear-gradient(90deg,transparent 30px,rgba(214,70,60,.5) 30px 32px,transparent 32px),repeating-linear-gradient(transparent 0 23px,rgba(100,150,200,.35) 23px 24px),#f8f0a8;--deck:linear-gradient(#fdf8c8,#f1e691);--deckb:#b2a24a;--ink:#3a3320;--mut:#7a6f45;--btn:linear-gradient(#fffce4,#efe5a6);--btnb:#a89a45;--btnk:#4a3a10;--btnsh:0 1px 1px rgba(0,0,0,.2);--act:linear-gradient(#ffe587,#f2c230);--actb:#a07b0a;--actk:#3a2a00;--actts:none;--lcdb:#6b4b2b;--menu:repeating-linear-gradient(transparent 0 23px,rgba(100,150,200,.3) 23px 24px),#fcf6bd;--menub:#b2a24a;--shr:#b2a24a;--shbg:#fdf8c8}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);overflow:hidden}
.cam{--pv:8px;--ph:8px;position:relative;height:100%;display:flex;flex-direction:column;gap:6px;padding:var(--pv) var(--ph);box-sizing:border-box;max-width:560px;margin:0 auto;background:var(--camc);border:var(--camb);border-radius:var(--camr);overflow:hidden}
body.skin-w7 .cam{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.side{display:contents}
.tbar{order:0}.top{order:1}.lcd{order:2}#fstrip{order:3}.deck{order:4}#menu{order:5}
.tbar{display:none;flex:none;align-items:center;justify-content:space-between;margin:calc(var(--pv)*-1) calc(var(--ph)*-1) 0}
body.skin-xp .tbar{display:flex;height:30px;padding:0 5px 0 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff 95%,#003dd7);border-radius:6px 6px 0 0}
body.skin-w7 .tbar{display:flex;height:28px;padding:0 0 0 8px;align-items:flex-start}
.ti{font-size:13px;font-weight:bold;display:flex;align-items:center;height:100%}
body.skin-xp .ti{color:#fff;text-shadow:1px 1px #0f1089}
body.skin-w7 .ti{color:#000;font-weight:normal;text-shadow:0 0 8px #fff,0 0 3px #fff}
.ti::before{content:'';width:14px;height:14px;border-radius:3px;margin-right:7px;background:radial-gradient(circle at 35% 30%,#fff,#7fb2ff 45%,#1c4fc4)}
.wc{display:flex;gap:2px}
.wc i{display:block;font-style:normal;text-align:center;color:#fff;font-weight:bold}
body.skin-xp .wc i{width:21px;height:21px;border:1px solid #fff;border-radius:3px;font:bold 12px/19px Tahoma;background:linear-gradient(#5b8def,#2a60d6 50%,#1f4fc4)}
body.skin-xp .wc i:last-child{background:linear-gradient(#ee9a7c,#d8532f 50%,#c53c1a)}
body.skin-w7 .wc i{width:27px;height:18px;border:1px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 4px 4px;font:12px/16px 'Segoe UI';color:#222;background:linear-gradient(rgba(255,255,255,.75),rgba(200,215,235,.6) 50%,rgba(165,190,222,.6) 51%,rgba(205,222,242,.75))}
body.skin-w7 .wc i:last-child{width:47px;color:#fff;background:linear-gradient(#e9a395,#c8503c 50%,#b4301a 51%,#d86a58)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.tb{display:flex;gap:5px}
.lcd{flex:1;min-height:0;position:relative;background:#000;border-radius:var(--crad);border:var(--lcdw) solid var(--lcdb);box-shadow:var(--lcdsh);overflow:hidden}
#out{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:16px;font-size:12px;line-height:1.6;color:#9a9a92}
.deck,#menu{outline:var(--stitch);outline-offset:-5px}
.deck{background:var(--deck);border-radius:var(--crad);padding:7px 10px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--deckb)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px;align-items:center}
.btn{background:var(--btn);color:var(--btnk);border:1px solid var(--btnb);border-bottom-width:var(--bbw);border-radius:var(--rad);padding:6px 9px;font:inherit;font-size:11px;letter-spacing:var(--ls);text-shadow:var(--btnts);box-shadow:var(--btnsh);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.act{background:var(--act);color:var(--actk);border-color:var(--actb);text-shadow:var(--actts);box-shadow:var(--actsh)}
.btn:active{transform:translateY(1px)}
.zb{width:46px;font-size:16px;padding:4px 0;touch-action:none}
.zr{min-width:48px;text-align:center;font-size:12px}
.evr{display:flex;align-items:center;gap:8px;font-size:11px}
.evr .btn{padding:4px 8px}
.evr input{flex:1;min-width:0;accent-color:var(--acc);margin:0}
.evr i{width:34px;text-align:right;font-style:normal;color:var(--mut)}
.shut{width:58px;height:58px;border-radius:50%;border:4px solid var(--shr);background:var(--shbg);position:relative;cursor:pointer;padding:0;flex:none}
.shut::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--shi);transition:.15s}
.shut.photo::after{background:var(--shp)}
.shut.rec::after{inset:16px;border-radius:5px;background:var(--shi)}
body:not(.mob) #ori{display:none}
#fstrip{display:none;flex:none;gap:8px;overflow-x:auto;padding:4px 2px}
.cam.fpick #fstrip{display:flex}
.tile{flex:none;width:62px;border:0;padding:0;background:none;cursor:pointer;text-align:center;color:var(--ink);font:inherit;font-size:10px}
.tile .sw{display:block;width:62px;height:62px;border-radius:10px;border:2px solid var(--btnb);box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tile.sel .sw{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile .nm{display:block;margin-top:3px;white-space:nowrap}
#menu{display:none;flex:none;height:42%;overflow-y:auto;background:var(--menu);color:var(--menuink);border:1px solid var(--menub);border-radius:var(--crad);padding:10px 12px 14px;box-sizing:border-box}
.cam.menu #menu{display:block}
.cam.menu .deck{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;letter-spacing:.1em}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
.tabs .btn{flex:none}
body.skin-xp .tabs .btn,body.skin-w7 .tabs .btn{border-radius:3px 3px 0 0}
body.skin-xp .tabs .btn.act{background:#fcfcfe;border-top:3px solid #ffc83c;box-shadow:none}
body.skin-w7 .tabs .btn.act{background:linear-gradient(#fff,#eaf3fc);border-top:2px solid #3a8dde}
.pane{display:none}.pane.on{display:block}
.gh{font-size:11px;color:var(--menumut);margin:12px 0 5px;letter-spacing:.1em}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0;align-items:center}
.note{font-size:11px;line-height:1.6;color:var(--menumut);margin:4px 0}
.ms{display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0}
.ms span{width:84px;flex:none}
.ms input{flex:1;min-width:0;accent-color:var(--acc);margin:0}
.ms i{width:34px;text-align:right;font-style:normal;color:var(--menumut);font-size:11px}
.txt{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:var(--rad);border:1px solid var(--btnb);background:#fff;color:#111;font:inherit;font-size:13px}
#lvl{height:8px;background:rgba(128,128,128,.3);border-radius:4px;overflow:hidden;margin:6px 0}
#lvl b{display:block;height:100%;width:0;background:#3fae6a}
#gal{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--menu);color:var(--menuink)}
#gal.on{display:flex}
.gh2{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.gh2 b{font-size:15px}
.gtabs{display:flex;gap:6px;padding:0 12px 8px}
#gl{flex:1;min-height:0;overflow:auto;padding:0 8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;align-content:start}
.th{position:relative;aspect-ratio:1;background:#000;overflow:hidden;border-radius:6px;cursor:pointer}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:8px}
#gv{display:none;flex:1;min-height:0;flex-direction:column}
#gal.view #gv{display:flex}
#gal.view #gl,#gal.view .gtabs{display:none}
#vm{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#vm img,#vm video{max-width:100%;max-height:100%}
.vb{padding:10px;display:flex;flex-direction:column;gap:8px}
.btn.big{font-size:15px;padding:14px 10px;width:100%;font-weight:bold}
.vr{display:flex;gap:8px}.vr .btn{flex:1;padding:10px 6px;font-size:12px}
.hint{font-size:11px;color:var(--menumut);text-align:center;line-height:1.5}
body.land .cam{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 176px;grid-template-rows:auto minmax(0,1fr);gap:5px 6px}
body.land .cam.menu{grid-template-columns:minmax(0,1fr) 300px}
body.land .tbar{grid-column:1/3;grid-row:1}
body.land.skin-xp .tbar{height:24px}
body.land.skin-w7 .tbar{height:22px}
body.land .lcd{grid-column:1;grid-row:2}
body.land .side{display:flex;flex-direction:column;gap:5px;grid-column:2;grid-row:2;min-height:0;overflow-y:auto}
body.land .side>*{flex:none}
body.land .top{flex-direction:column;align-items:stretch;gap:4px}
body.land .tb{display:grid;grid-template-columns:1fr 1fr;gap:4px}
body.land .deck{gap:5px;padding:6px}
body.land #menu{flex:1;min-height:0;height:auto}
body.land .cam.fpick .deck{display:none}
body.land #fstrip{flex-wrap:wrap;justify-content:center;overflow-x:hidden;overflow-y:auto}
body.land .tile{width:50px}
body.land .tile .sw{width:50px;height:50px}
body.land .ctl{flex-direction:column;align-items:stretch;gap:5px}
body.land .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
body.land .zseg{grid-template-columns:1fr 1.3fr 1fr}
body.land .btn{padding:5px 3px;font-size:10px;text-align:center;white-space:nowrap}
body.land .zb{width:auto;padding:3px 0;font-size:14px}
body.land .shut{width:46px;height:46px;align-self:center}
body.land #gv{flex-direction:row}
body.land .vb{width:240px;flex:none;overflow-y:auto}
body.rotr .cam,body.rotl .cam{--pv:12px;--ph:20px;position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0}
body.rotr .cam{transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
body.rotl .cam{transform:translateY(100vh) rotate(-90deg);transform:translateY(100dvh) rotate(-90deg)}
</style></head>
<body class="skin-light">
<div class="cam">
  <div class="tbar"><span class="ti">Handycam DV-2000</span><span class="wc" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span></div>
  <div class="side">
    <div class="top">
      <div class="tb"><button class="btn" id="bar">4:3</button><button class="btn" id="bre">480p</button><button class="btn" id="fb">FILTER</button></div>
      <div class="tb"><button class="btn" id="gb">GALLERY 0</button><button class="btn" id="mb">MENU</button></div>
    </div>
    <div id="fstrip"></div>
    <div class="deck">
      <div class="ctl">
        <div class="seg zseg"><button class="btn zb" id="zo">－</button><span class="zr" id="zr">1.0×</span><button class="btn zb" id="zi">＋</button></div>
        <div class="seg"><button class="btn" id="fls">FLASH</button><button class="btn" id="mic">MIC OFF</button></div>
      </div>
      <div class="evr"><button class="btn" id="evr">EV</button><input type="range" id="ev" min="-2" max="2" step=".1" value="0"><i id="evv">0.0</i></div>
      <div class="ctl">
        <div class="seg"><button class="btn act" id="mV">VIDEO</button><button class="btn" id="mP">PHOTO</button></div>
        <button class="shut" id="sh" aria-label="shutter"></button>
        <div class="seg"><button class="btn" id="ori">竖屏</button><button class="btn" id="fl">FLIP</button></div>
      </div>
    </div>

<script>
const $=s=>document.querySelector(s);
const cam=$('.cam');
const out=$('#out'),oc=out.getContext('2d');
const gc=document.createElement('canvas'),gl=gc.getContext('webgl');
const VS='attribute vec2 a;varying vec2 u;void main(){u=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D t;uniform vec2 r,cr;
uniform float T,m,z,fb,F,rot,pf,ca,bl,bd,bm,nz,sn,vg,jt,sat,wb,sh,ex,fx,fp;
varying vec2 u;
vec2 PX;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 S(vec2 p){p=(p-.5)*cr/z+.5;if(fp>.5)p=1.-p;p.x=mix(p.x,1.-p.x,m);
 if(rot>1.5)p=vec2(p.y,1.-p.x);else if(rot>.5)p=vec2(1.-p.y,p.x);
 return texture2D(t,clamp(p,0.,1.)).rgb*ex;}
vec3 Sb(vec2 p){vec2 o=PX*.35;return (S(p+o)+S(p+vec2(-o.x,o.y))+S(p+vec2(o.x,-o.y))+S(p-o))*.25;}
float Yf(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec2 sc=u;float L=floor(sc.y*240.);float f=floor(T*30.);
 PX=1./r;
 float jit=h(vec2(L,f))-.5;
 vec2 uv=sc;
 uv.x+=jit*.0025*jt+sin(sc.y*8.+T*1.5)*.0006*jt;
 vec2 c=sc-.5;float asp=r.x/r.y;
 vec2 c2=c*(.008+dot(c,c)*.04)*ca+vec2(.0012*ca,0.);
 vec3 col=vec3(Sb(uv+c2).r,Sb(uv).g,Sb(uv-c2*1.3).b);
 float rr=bl*.003+fb;
 if(rr>.0002){vec3 bk=(col+S(uv+vec2(rr,0.))+S(uv-vec2(rr,0.))+S(uv+vec2(0.,rr*asp))+S(uv-vec2(0.,rr*asp)))*.2;col=mix(col,bk,clamp(rr*400.,0.,.9));}
 vec3 sm=(S(uv-vec2(.003,0.))+S(uv-vec2(.007,0.))+S(uv-vec2(.011,0.))+S(uv-vec2(.015,0.)))*.25;
 vec3 cm=mix(col,sm,clamp(.8*bd,0.,1.));
 float Y0=Yf(col);
 col=Y0+(cm-Yf(cm))*1.15;
 float yl=Yf(Sb(uv-vec2(PX.x,0.))),yr=Yf(Sb(uv+vec2(PX.x,0.)));
 float yu=Yf(Sb(uv-vec2(0.,PX.y))),yd=Yf(Sb(uv+vec2(0.,PX.y)));
 col+=((Y0*2.-yl-yr)*.4+(Y0*2.-yu-yd)*.2)*sh;
 float ya=Yf(S(uv+vec2(.005,0.))),yb=Yf(S(uv-vec2(.005,0.)));
 float pu=smoothstep(.04,.3,abs(ya-yb))*(.35+.65*smoothstep(.4,.9,max(ya,yb)));
 col+=vec3(.55,.05,1.)*pu*.7*pf;col.g-=pu*.12*pf;
 vec3 b=vec3(0.);
 for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a)*asp);
  b+=max(S(uv+d*.012)-.55,0.)+max(S(uv+d*.03)-.55,0.)*.8;}
 col+=b*.14*bm*vec3(.85,.92,1.);
 col=(col-.5)*1.1+.5;col=mix(vec3(Yf(col)),col,1.1*sat);
 col+=vec3(.005,.01,.04)*(1.-clamp(Yf(col),0.,1.));
 col*=vec3(.96,.98,1.06);
 col=max(col,vec3(.04));
 float Y=Yf(col);float nk=1.;
 if(F==1.){col=mix(vec3(Y),col,.75)*vec3(1.05,.96,1.1);nk=1.6;}
 else if(F==2.){col=vec3(.25,1.,.3)*min(Y*2.2,1.3);nk=2.4;}
 else if(F==3.){col=vec3(Y)*1.12+.02;nk=1.3;}
 else if(F==4.){col=vec3(Y)*vec3(1.25,1.,.72)*1.05+(col-Y)*.35;}
 else if(F==5.){col=mix(col,mix(vec3(0.,.3,.4),vec3(1.,.4,.8),smoothstep(.1,.9,Y)),.65);}
 else if(F==6.){col=mix(vec3(Y),col,.72);col=(col-.5)*.85+.55;col*=vec3(1.04,1.,.93);col+=vec3(0.,.02,.04)*(1.-Y);nk=1.4;}
 else if(F==7.){col=vec3(Y)*vec3(.55,.85,1.25)+vec3(0.,.02,.06);nk=1.2;}
 else if(F==8.){float px=mod(gl_FragCoord.x,3.);vec3 mk=vec3(px<1.?1.:.55,(px>=1.&&px<2.)?1.:.55,px>=2.?1.:.55);col*=mk*1.25;col*=1.-.2*(.5+.5*sin(sc.y*r.y*3.1416));nk=.8;}
 else if(F==9.){float q=clamp(Y*1.15,0.,1.);vec3 c1=vec3(.02,0.,.25),c2=vec3(.55,0.,.55),c3=vec3(.95,.25,.1),c4=vec3(1.,.9,.2);
  col=q<.25?mix(c1,c2,q*4.):q<.5?mix(c2,c3,(q-.25)*4.):q<.75?mix(c3,c4,(q-.5)*4.):mix(c4,vec3(1.),(q-.75)*4.);nk=.7;}
 else if(F==10.){col=floor(col*5.+.5)/5.*vec3(1.05,1.,1.1);nk=.3;}
 else if(F==11.){col=1.-col;}
 else if(F==12.){col*=mix(vec3(.75,1.,1.15),vec3(1.2,.95,.75),smoothstep(.3,.75,Y));}
 else if(F==13.){col+=b*.35*bm;col=mix(vec3(Yf(col)),col,1.2)*vec3(1.06,.98,1.1);col=col*.9+.1;nk=.6;}
 if(fx>.5){float ff=1.4-1.7*dot(c,c);col=col*(1.+ff*.8);col=(col-.5)*1.25+.5;col=mix(col,vec3(1.),clamp(ff*.12,0.,.25));}
 col*=vec3(1.+wb*.14,1.+wb*.03,1.-wb*.18);
 col*=1.-.05*sn*(.5+.5*sin(sc.y*240.*6.2832));
 col*=1.-.02*sn*mod(f,2.);
 float n=h(sc*r+T)-.5;col+=n*.22*nz*nk*(1.-Yf(col)*.5);
 col+=(vec3(h(sc*r*.5+T+1.),h(sc*r*.5+T+2.),h(sc*r*.5+T+3.))-.5)*.08*nz*nk;
 col*=max(1.-dot(c,c)*1.1*vg,0.);
 gl_FragColor=vec4(col,1.);}`;
function mk(ty,s){const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pg=gl.createProgram();
gl.attachShader(pg,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pg,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
const UL={};['r','cr','T','m','z','fb','F','rot','pf','ca','bl','bd','bm','nz','sn','vg','jt','sat','wb','sh','ex','fx','fp'].forEach(n=>UL[n]=gl.getUniformLocation(pg,n));

/* storage: IndexedDB */
let db;
const idb=()=>new Promise(res=>{try{const rq=indexedDB.open('dvcam',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('items',{keyPath:'id'});rq.onsuccess=()=>{db=rq.result;res()};rq.onerror=()=>res()}catch(e){res()}});
const idbPut=r=>{if(!db)return;try{db.transaction('items','readwrite').objectStore('items').put(r)}catch(e){}};
const idbDel=id=>{if(!db)return;try{db.transaction('items','readwrite').objectStore('items').delete(id)}catch(e){}};
const idbAll=()=>new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}});
const pad=n=>String(n).padStart(2,'0');
function mkItem(r){const d=new Date(r.t),ext=r.k==='img'?'jpg':(r.blob.type.includes('mp4')?'mp4':'webm');
  const name=`DV_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${ext}`;
  return {...r,url:URL.createObjectURL(r.blob),file:new File([r.blob],name,{type:r.blob.type})}}
function updCount(){$('#gb').textContent='GALLERY '+items.length;$('#gn').textContent=items.length+' 项'}
function addItem(k,blob,dur){
  const r={id:Date.now()+'-'+Math.floor(Math.random()*1000),k,blob,t:Date.now(),d:dur||0};
  idbPut(r);items.unshift(mkItem(r));updCount();
  if($('#gal').classList.contains('on'))renderGal();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
idb().then(async()=>{const all=await idbAll();items=all.sort((a,b)=>b.t-a.t).map(mkItem);updCount()});

/* menu builder */
const panes=[],chipFns=[];
const syncChips=()=>chipFns.forEach(f=>f());
function mkPane(name){const d=document.createElement('div');d.className='pane';d.sy=[];d.rk=[];
  const b=document.createElement('button');b.className='btn';b.textContent=name;b.onclick=()=>showPane(d);
  $('#tabs').append(b);d.tab=b;$('#panes').append(d);panes.push(d);return d}
function showPane(d){panes.forEach(p=>{p.classList.toggle('on',p===d);p.tab.classList.toggle('act',p===d)})}
function head(p,t){const e=document.createElement('div');e.className='gh';e.textContent=t;p.append(e)}
function note(p,t){const e=document.createElement('div');e.className='note';e.textContent=t;p.append(e)}
function addSlider(p,label,lo,hi,st,obj,key,cb){
  const l=document.createElement('label');l.className='ms';
  l.innerHTML=`<span>${label}</span><input type="range" min="${lo}" max="${hi}" step="${st}"><i></i>`;
  const i=l.children[1],v=l.children[2];
  const sync=()=>{i.value=obj[key];v.textContent=(+obj[key]).toFixed(2)};
  i.oninput=()=>{obj[key]=+i.value;v.textContent=(+i.value).toFixed(2);save();cb&&cb()};
  sync();p.append(l);p.sy.push(sync);p.rk.push([obj,key,DEF.get(obj)[key],cb]);
}
function addToggle(p,label,obj,key,cb){
  const w=document.createElement('div');w.className='chips';
  const b=document.createElement('button');b.className='btn';
  const sync=()=>{b.classList.toggle('act',!!obj[key]);b.textContent=label+' '+(obj[key]?'开':'关')};
  b.onclick=()=>{obj[key]=!obj[key];sync();save();cb&&cb()};
  sync();w.append(b);p.append(w);p.sy.push(sync);p.rk.push([obj,key,DEF.get(obj)[key],cb]);
}
function addChips(p,labels,get,set){
  const w=document.createElement('div');w.className='chips';
  const bs=labels.map((n,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>{set(i);syncChips()};w.append(b);return b});
  chipFns.push(()=>bs.forEach((b,i)=>b.classList.toggle('act',get()===i)));p.append(w);
}
function addReset(p){const b=document.createElement('button');b.className='btn';b.textContent='重置本页';b.style.marginTop='14px';
  b.onclick=()=>{p.rk.forEach(([o2,k,d,cb])=>{o2[k]=d;cb&&cb()});save();p.sy.forEach(f=>f());syncChips()};p.append(b)}

/* mic */
const AC=window.AudioContext||window.webkitAudioContext;
let ac,astream,aDst,aHP,aLP,aGain,aAn,aSrc,pS;
const lvBuf=new Uint8Array(512);
function nodes(){if(!aGain)return;aGain.gain.value=S.gain;aHP.frequency.value=S.lofi?250:20;aLP.frequency.value=S.lofi?4800:20000}
function stopMic(){if(astream)astream.getTracks().forEach(t=>t.stop());astream=aDst=aSrc=aAn=aGain=null}
function updMic(){$('#mic').textContent=S.mic?'MIC ON':'MIC OFF';$('#mic').classList.toggle('act',S.mic)}
async function startMic(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,autoGainControl:S.agc}});
    if(!S.mic){s.getTracks().forEach(t=>t.stop());return}
    astream=s;await ac.resume();
    aSrc=ac.createMediaStreamSource(s);
    aHP=ac.createBiquadFilter();aHP.type='highpass';aLP=ac.createBiquadFilter();aLP.type='lowpass';
    aGain=ac.createGain();aAn=ac.createAnalyser();aAn.fftSize=512;aDst=ac.createMediaStreamDestination();
    aSrc.connect(aHP);aHP.connect(aLP);aLP.connect(aGain);aGain.connect(aDst);aGain.connect(aAn);nodes();
  }catch(e){S.mic=false;save();updMic();pS&&pS.sy.forEach(f=>f());alert('无法使用麦克风：'+(e.name||e))}
}
function applyMic(){stopMic();if(S.mic){if(!ac&&AC)ac=new AC();if(ac&&ac.resume)ac.resume();startMic()}updMic()}
const guard=k=>()=>{if(recing()){S[k]=!S[k];pS.sy.forEach(f=>f());return}applyMic()};
$('#mic').onclick=()=>{if(recing())return;S.mic=!S.mic;save();pS.sy.forEach(f=>f());applyMic()};

function layout(){

  land=mob?(dp?o!==0:true):!dp;
  b.toggle('mob',mob);b.toggle('land',land);
  b.toggle('rotr',mob&&dp&&o===1);b.toggle('rotl',mob&&dp&&o===2);
  $('#ori').textContent=['竖屏','横屏↺','横屏↻'][o];
}

/* camera + lenses */
const mmOf=l=>{l=(l||'').toLowerCase();return /ultra|0\.5|超广角/.test(l)?13:/tele|长焦/.test(l)?77:/front|前置|user/.test(l)?23:24};
async function refreshLenses(){
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const cnt={},seen={};
    lenses=ds.map(d=>{const l=(d.label||'').toLowerCase();const n=/ultra/.test(l)?'超广角':/tele/.test(l)?'长焦':/front|前置/.test(l)?'前置':'广角';cnt[n]=(cnt[n]||0)+1;return{id:d.deviceId,label:d.label,n}});
    lenses.forEach(x=>{seen[x.n]=(seen[x.n]||0)+1;x.nm=cnt[x.n]>1?x.n+seen[x.n]:x.n});
    lensBox.innerHTML='';
    if(!lenses.length){lensBox.textContent='开机后显示可用镜头';return}
    const cur=track&&track.getSettings?track.getSettings().deviceId:null;
    lenses.forEach(x=>{const b=document.createElement('button');b.className='btn'+(x.id===cur?' act':'');b.textContent=x.nm;
      b.onclick=()=>{if(recing())return;lensId=x.id;facing=x.n==='前置'?'user':'environment';autoWide=false;start()};lensBox.append(b)});
  }catch(e){}
}
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pwMsg('此环境不支持摄像头，请用 Chrome / Edge / Safari 打开 https 链接。');return}
  const base={width:{ideal:1280},height:{ideal:720}};
  const tries=[lensId?{...base,deviceId:{exact:lensId}}:{...base,facingMode:facing},{...base,facingMode:facing},{}];
  stream=null;let err;
  for(const v of tries){try{stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});break}catch(e){err=e}}
  if(!stream){pwMsg('无法使用摄像头：'+(err&&err.name)+'。请检查浏览器权限。');return}
  track=stream.getVideoTracks()[0];
  vid.srcObject=stream;await vid.play();on=true;$('#pw').style.display='none';
  curMM=mmOf(track.label);
  try{hasTorch=!!(track.getCapabilities&&track.getCapabilities().torch)}catch(e){hasTorch=false}
  await refreshLenses();
  if(autoWide){autoWide=false;
    const wide=lenses.find(x=>x.n==='广角'&&!/dual|triple|三/i.test(x.label));
    const cur=track.getSettings?track.getSettings().deviceId:null;
    if(wide&&facing==='environment'&&cur&&cur!==wide.id){lensId=wide.id;start()}}
}
function pwMsg(s){$('#pw').firstElementChild.textContent=s}

/* zoom + exposure + flash */
function zb(id,d){const e=$(id);
  e.addEventListener('pointerdown',ev2=>{ev2.preventDefault();zdir=d;zT=performance.now();try{e.setPointerCapture(ev2.pointerId)}catch(_){}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,()=>{zdir=0}));
  e.addEventListener('contextmenu',ev2=>ev2.preventDefault());
}
zb('#zi',1);zb('#zo',-1);
const showEV=()=>{$('#evv').textContent=(ev>0?'+':'')+ev.toFixed(1)};
$('#ev').oninput=e=>{ev=+e.target.value;evT=performance.now();showEV()};
$('#evr').onclick=()=>{ev=0;$('#ev').value=0;evT=performance.now();showEV()};

function size(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
  if(recing()&&szKey)return true;
  const dp=innerHeight>=innerWidth,outL=mob?land:true;
  if(outL&&vw<vh)rot=(mob&&dp&&o)?(o===2?2:1):(mob&&!dp&&angle()===270?2:1);
  else if(!outL&&vw>vh)rot=2;else rot=0;
  const sa=rot?vh/vw:vw/vh;
  let rv=RATIOS[ri][1];if(rv===-1)rv=S.car;
  const ta=rv?(outL?rv:1/rv):sa;
  const N=RES[si];let w,h;
  if(ta>=1){h=N;w=Math.round(N*ta)}else{w=N;h=Math.round(N/ta)}
  w&=~1;h&=~1;
  const s=Math.max(1,Math.round(720/N));
  const key=w+'x'+h+'x'+s;
  if(key!==szKey){szKey=key;cw=w;ch=h;gc.width=w;gc.height=h;out.width=W=w*s;out.height=H=h*s;gl.viewport(0,0,w,h)}
  cr=S.stretch?[1,1]:(ta>sa?[1,sa/ta]:[ta/sa,1]);
  return true;
}
const fmt=s=>{s=Math.floor(s);return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
function ov(T){
  const it=WM.items,wf=WMF[WM.font],fam=wf[0]==='monospace'?'ui-monospace,Menlo,Consolas,monospace':`"${wf[0]}",monospace`;
  const u=Math.min(W,H)*.05,f=Math.max(9,u*WM.size*wf[1]),m=u*.9,ls=f*1.2,isRec=recing();
  const fr=WM.fr*1.6*(Math.min(W,H)/360);
  oc.font=`${wf[0]==='monospace'?'bold ':''}${f}px ${fam}`;oc.textBaseline='top';
  const tx2=(s,x,y,al)=>{oc.textAlign=al||'left';
    if(WM.fr>0){oc.shadowBlur=0;oc.fillStyle='rgba(255,40,60,.7)';oc.fillText(s,x-fr,y);oc.fillStyle='rgba(40,200,255,.7)';oc.fillText(s,x+fr,y)}
    oc.shadowColor=WM.color;oc.shadowBlur=f*.35*WM.gl;oc.fillStyle=WM.color;oc.fillText(s,x,y);oc.shadowBlur=0};
  const blink=Math.floor(T*1.5)%2===0;
  if(it.rec){if(mode==='photo')tx2('PHOTO',m,m);else tx2(isRec?(blink?'● REC':'  REC'):'STBY',m,m)}
  if(it.flt&&fi)tx2(FO[fi],m,m+(it.rec?ls:0));
  if(it.bat)tx2('SP [###-]',W-m,m,'right');
  if(it.zm&&(zdir||Math.abs(zt-zc)>.005||performance.now()-zT<1500)){
    const n=Math.max(0,Math.min(8,Math.round(Math.log(zc)/Math.log(6)*8)));
    tx2('W ['+'#'.repeat(n)+'-'.repeat(8-n)+'] T',W/2,H-m-ls*2.4,'center');
    tx2(Math.round(curMM*zc)+'mm',W/2,H-m-ls*3.5,'center');
  }
  if(performance.now()-evT<1500)tx2('EV '+(ev>0?'+':'')+ev.toFixed(1),W/2,m,'center');
  const d=new Date();
  if(it.date)tx2(d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase(),m,H-m-f-ls);
  if(it.time)tx2(d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),m,H-m-f);
  if(it.tc)tx2(isRec?fmt((performance.now()-t0)/1000):'0:00:00',W-m,H-m-f,'right');
  if(WM.txt)tx2(WM.txt,W/2,H-m-f,'center');
}
function loop(ts){
  requestAnimationFrame(loop);
  if(aAn&&cam.classList.contains('menu')){
    aAn.getByteTimeDomainData(lvBuf);let pk=0;for(let i=0;i<lvBuf.length;i++)pk=Math.max(pk,Math.abs(lvBuf[i]-128));
    $('#lvl b').style.width=Math.min(100,pk/128*100)+'%';
  }
  if(!on||vid.readyState<2||ts-last<33||!size())return;
  const dt=Math.min(.1,(ts-last)/1000);last=ts;const T=ts/1000;
  if(zdir){zt=Math.min(6,Math.max(1,zt*Math.exp(zdir*dt*.85)));zT=performance.now()}
  const lz=Math.log(zc),lt=Math.log(zt);
  zc=Math.exp(lz+(lt-lz)*(1-Math.exp(-dt*7)));if(Math.abs(zc-zt)<.002)zc=zt;
  $('#zr').textContent=zc.toFixed(1)+'×';
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  gl.uniform2f(UL.r,cw,ch);gl.uniform2f(UL.cr,cr[0],cr[1]);gl.uniform1f(UL.T,T%1000);
  gl.uniform1f(UL.m,facing==='user'?1:0);gl.uniform1f(UL.z,zc);
  gl.uniform1f(UL.fb,Math.min(Math.abs(zt-zc)*.0015,.008));
  gl.uniform1f(UL.F,fi);gl.uniform1f(UL.rot,rot);
  gl.uniform1f(UL.ex,Math.pow(2,ev));gl.uniform1f(UL.fx,flashFx);gl.uniform1f(UL.fp,S.flip?1:0);
  for(const k in D)gl.uniform1f(UL[k],P[k]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  oc.imageSmoothingEnabled=false;oc.drawImage(gc,0,0,W,H);ov(T);
  if(shotReq){shotReq=0;flashFx=0;
    out.toBlob(b=>{if(b)addItem('img',b);
      if(torchOn){torchOn=false;try{track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{})}catch(e){}}},'image/jpeg',.92)}
}
oc.fillStyle='#000';oc.fillRect(0,0,640,480);requestAnimationFrame(loop);

function setMode(m){
  if(recing())return;
  mode=m;$('#mV').classList.toggle('act',m==='video');$('#mP').classList.toggle('act',m==='photo');
  $('#sh').className='shut'+(m==='photo'?' photo':'');
}
$('#mV').onclick=()=>setMode('video');$('#mP').onclick=()=>setMode('photo');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function takePhoto(){
  if(shotReq)return;
  const fl=$('#flash');
  if(S.flash){
    let real=false;
    if(hasTorch){try{await track.applyConstraints({advanced:[{torch:true}]});real=true;torchOn=true;await sleep(220)}catch(e){real=false}}
    flashFx=real?0:1;
  }
  fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),S.flash?90:60);
  shotReq=1;
}
$('#sh').onclick=()=>{
  if(!on)return;
  if(mode==='photo'){takePhoto();return}
  if(recing()){rec.stop();return}
  if(typeof MediaRecorder==='undefined'){alert('此浏览器不支持录像');return}
  const cs=out.captureStream(30);
  if(aDst)aDst.stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  const op={videoBitsPerSecond:4e6,audioBitsPerSecond:[64e3,128e3,256e3][S.abr]};if(mt)op.mimeType=mt;
  chunks=[];rec=new MediaRecorder(cs,op);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/mp4'});addItem('vid',b,(performance.now()-t0)/1000);$('#sh').classList.remove('rec')};
  rec.start(500);t0=performance.now();$('#sh').classList.add('rec');
};

/* gallery */
let gf=0,gi=0;
const gal=$('#gal');
const flt=()=>items.filter(x=>gf===0||(gf===1?x.k==='img':x.k==='vid'));
const canShare=it=>!!(navigator.canShare&&navigator.canShare({files:[it.file]}));
function renderGal(){
  const L=flt(),g=$('#gl');g.innerHTML='';updCount();
  if(!L.length){g.textContent='还没有拍摄内容';return}
  L.forEach((it,i)=>{
    const d=document.createElement('div');d.className='th';
    const el=document.createElement(it.k==='img'?'img':'video');
    if(it.k==='vid'){el.src=it.url+'#t=0.1';el.muted=true;el.preload='metadata';el.playsInline=true}else el.src=it.url;
    d.append(el);
    if(it.k==='vid'){const b=document.createElement('i');b.textContent='▶ '+fmt(it.d||0).replace(/^0:/,'');d.append(b)}
    d.onclick=()=>{gi=i;gal.classList.add('view');showView()};g.append(d);
  });
}
function cur(){return flt()[gi]}
function showView(){
  const L=flt();if(!L.length){gal.classList.remove('view');renderGal();return}
  gi=Math.max(0,Math.min(gi,L.length-1));const it=L[gi],vm=$('#vm');vm.innerHTML='';
  const el=document.createElement(it.k==='img'?'img':'video');el.src=it.url;
  if(it.k==='vid'){el.controls=true;el.playsInline=true}
  vm.append(el);
  $('#vi').textContent=(gi+1)+' / '+L.length;
  $('#vs').textContent=canShare(it)?'保存 / 分享到相册':'下载保存';
}
function dl(it){const a=document.createElement('a');a.href=it.url;a.download=it.file.name;document.body.appendChild(a);a.click();a.remove()}
$('#vs').onclick=()=>{const it=cur();if(!it)return;
  if(canShare(it)){navigator.share({files:[it.file]}).catch(e=>{if(e&&e.name!=='AbortError')dl(it)})}else dl(it)};
$('#vd').onclick=()=>{const it=cur();if(it)dl(it)};
$('#vo').onclick=()=>{const it=cur();if(it)window.open(it.url,'_blank')};
$('#vx').onclick=()=>{const it=cur();if(!it||!confirm('删除这个文件？删除后无法恢复。'))return;
  idbDel(it.id);URL.revokeObjectURL(it.url);items=items.filter(x=>x!==it);updCount();showView()};
$('#vp').onclick=()=>{gi--;if(gi<0)gi=flt().length-1;showView()};
$('#vn').onclick=()=>{gi++;if(gi>=flt().length)gi=0;showView()};
$('#gtabs').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;gf=+b.dataset.g;
  [...$('#gtabs').children].forEach(x=>x.classList.toggle('act',x===b));renderGal()};
$('#gb').onclick=()=>{gal.classList.remove('view');renderGal();gal.classList.add('on')};
$('#gc').onclick=()=>{if(gal.classList.contains('view')){gal.classList.remove('view');renderGal()}else gal.classList.remove('on')};
